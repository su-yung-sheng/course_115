<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>繳交審核與加分 · 資訊科技課程</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<!-- 本頁住在 shared/，設定檔在各學期資料夾裡。用 ?term= 決定載哪一份，
     沒帶就依今天的日期判斷（和 status.html 同一套做法）。 -->
<script src="semester.js"></script>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('term');
  if (!t || !/^115\d{2}$/.test(t)) {
    t = (window.SEMESTER && SEMESTER.current) ? SEMESTER.current() : '11501';
  }
  window.__TERM = t;
  /* ?v=… 是防快取。
     ★ 為什麼需要：config.js 是靜態檔，GitHub Pages 會叫瀏覽器快取 10 分鐘。
       改了 SERVER_URL（ngrok 常換）或 CLASSROOM.GAS_URL 之後，
       畫面上會**沿用舊值**卻毫無徵兆 —— 症狀是「後端明明開著卻說離線」、
       「ID 明明填了卻說沒設定」，然後花半小時找不存在的 bug。
       這幾頁是老師的工具頁，一天開不了幾次，永遠拿最新的最划算。
       （學生的闖關頁沒有加：那些頁一堂課會被載幾十次，
         而且 10 分鐘後快取本來就會自己過期。） */
  document.write('<scr' + 'ipt src="../' + t + '/config.js?v=' + Date.now() + '"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="../' + t + '/content/flowchart.js?v=' + Date.now() + '"></scr' + 'ipt>');
})();
</script>
<script>
/* 共用 JS 也要防快取 —— 只擋 config.js 是不夠的。
   2026-08-06 第三次踩到：頁面明明改好也推上去了，老師看到的還是舊畫面，
   因為 classroom.js 還是快取裡那一份。改版後「沒變」和「壞了」長得一樣，
   老師沒有辦法分辨，只能一直問。 */
(function () {
  var v = '?v=' + Date.now();
  ['auth.js', 'grading.js', 'classroom.js'].forEach(function (f) {
    document.write('<scr' + 'ipt src="' + f + v + '"></scr' + 'ipt>');
  });
})();
</script>

<style>
  html,body,button,input,select{font-family:'Noto Sans TC',system-ui,sans-serif}
  body{background:#e7e5e4}
  .pop{animation:pop .3s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="min-h-screen text-slate-800">

<main class="max-w-5xl mx-auto px-4 py-8">
  <header class="mb-6">
    <a href="#" id="back-teacher" class="text-sm font-bold text-slate-400 hover:text-slate-700">← 回教師端</a>
    <h1 class="text-2xl sm:text-3xl font-black mt-2">📥 繳交審核與加分</h1>
    <p class="text-slate-500 text-sm mt-2 leading-relaxed">
      學生把<b>流程圖圖片</b>與<b>程式執行錄影</b>交到 Google Classroom，
      你在這裡確認之後按一下給分：圖片 <b>+1⭐</b>、影片 <b>+1⭐</b>（每一關各算各的）。<br>
      <span class="text-slate-400 text-xs">給分是人工的 —— 系統只幫你把名單、繳交狀態和目前星數排在一起，
      最後點開看過再決定的還是你。</span><br>
      <span class="text-slate-300 text-[11px]">版本 <span id="ver" class="font-mono"></span>
        —— 和預期不符就按 Ctrl+Shift+R 強制重新整理（GitHub Pages 會快取 10 分鐘）</span>
    </p>
  </header>

  <div id="app"></div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
         setPersistence, browserSessionPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const C = window.CONFIG || {};
const TERM = window.__TERM;
const app = initializeApp(C.FIREBASE);
const auth = getAuth(app);
const db = getFirestore(app);
const PROGRESS = TERM + '-progress';
const ROSTER = (C.COLLECTIONS && C.COLLECTIONS.ROSTER) || 'roster';

/* 兩種單元清單：
     流程圖 → 11501/content/flowchart.js（十關排流程圖）
     程式設計 → config.js 的 CONFIG.UNITS
   下學期沒有逐關流程圖，所以那一欄可能是空的 —— 空的就只顯示程式設計。 */
const FLOW = (window.FLOW_UNITS || []).map(u => ({ id: u.id, no: u.no, title: u.title }));
const PROG = (C.UNITS || []).map((u, i) => ({ id: u[0], no: i + 1, title: u[1] }));

const KINDS = {
  img: { key: 'img', label: '流程圖圖片', icon: '🖼️', units: FLOW, mod: 'flowchart', field: 'imgUnits' },
  vid: { key: 'vid', label: '程式錄影',   icon: '🎬', units: PROG, mod: 'scratch',   field: 'vidUnits' }
};

/* 班級與座號。
   ★ 名冊的欄位是 cls／no（不是 class／seat）—— 我一開始寫錯，
     那一欄會永遠是空的而且不會報錯。規格見 docs/03_資料格式規格.md。
   名冊沒填時從學號推算：1410112 → 班級 801、座號 12（後四碼）。 */
function clsOf(sid, r) {
  var v = String((r && r.cls) || '').trim();
  if (v) return v;
  sid = String(sid || '');
  return sid.length >= 4 ? '8' + sid.slice(-4, -2) : '';
}
function noOf(sid, r) {
  var v = String((r && r.no) || '').trim();
  if (v) return v;
  return String(sid || '').slice(-2);
}

/* 「資訊科技 801」→ 801 的抽取放在 shared/classroom.js（CLASSROOM.classFromCourseName），
   兩邊都會用到，不要各寫一份。 */

const state = {
  who: null,            // 登入的老師
  no: 1,                // 第幾關（流程圖與程式各有自己的十關，用序號一起對應）
  klass: '',            // 目前在看哪一班（載入後會自動選第一個）
  roster: {},           // 學號 → { name, class, seat }
  progress: {},         // 學號 → progress 文件
  cr: { on: false, err: '', courses: [], works: [], courseId: '', workId: '', rows: {},
        matched: '', ambiguous: null },   // 這一關配到哪一份作業／配到多份時的候選
  busy: '',
  msg: ''
};

const el = id => document.getElementById(id);
// 同一個分頁開啟，所以要有回去的路
{ const b = el('back-teacher'); if (b) b.href = '../' + TERM + '/teacher.html'; }
// 版本印在畫面上：改版後看到舊值就知道是快取，不必猜是不是壞了
{ const v = el('ver'); if (v) v.textContent = (window.CLASSROOM && CLASSROOM.VERSION) || '（舊版 classroom.js）'; }
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 登入：只有老師 ─────────────────────────────────
   ⚠️ 不能只判斷「有沒有人登入」。教師端和學生頁同一個 Firebase 專案、
      同一個網域，登入狀態整個瀏覽器共用 —— 這台電腦開過學生頁的話，
      user 就是非 null，直接放行會變成「畫面進得去但每一筆讀取都被規則擋下」。 */
function isTeacher(u) {
  return !!(u && u.email && window.AUTH && AUTH.isTeacherEmail(u.email));
}
/* ★ 持久性要和教師端一致（SESSION ＝ sessionStorage），而且要在
   掛上 onAuthStateChanged 之前設好。

   為什麼會影響到「又要登入一次」：
     教師端用 SESSION 持久性，登入狀態存在 sessionStorage ——
     那是**每個分頁各自獨立**的。這一頁若用預設的 LOCAL，
     會去 localStorage 找，那裡根本沒有東西，於是要求重新登入。
     教師端的連結也改成同一個分頁開啟，sessionStorage 才帶得過來。

   ⚠️ 這個登入不能省。Firestore 的安全規則要一個 Firebase 身分才肯讓人
      讀全班名冊與進度、寫加分欄位；Classroom 那條線（Apps Script ＋
      通行碼）Firestore 完全不認得。沒有它，這一頁連名單都讀不出來。 */
setPersistence(auth, browserSessionPersistence)
  .catch(e => console.warn('設定持久性失敗', e))
  .finally(() => {
    onAuthStateChanged(auth, async (u) => {
      if (!isTeacher(u)) { render(); return; }
      state.who = u;
      await loadAll();
      render();
    });
  });

async function loadAll() {
  state.busy = '讀取名冊與進度…'; render();
  try {
    const [rs, ps] = await Promise.all([getDocs(collection(db, ROSTER)), getDocs(collection(db, PROGRESS))]);
    const r = {};
    rs.forEach(d => { r[d.id] = d.data() || {}; });
    const p = {};
    ps.forEach(d => { p[d.id] = d.data() || {}; });
    state.roster = r; state.progress = p;
    // 一載入就選好第一個班（教師成績登錄系統也是一開啟就有一個班在作用中）
    if (!state.klass) { const cs = allClasses(); state.klass = cs.length ? cs[0] : ''; }
    state.msg = '';
  } catch (e) {
    state.msg = '讀不到資料：' + e.message;
  }
  state.busy = '';
}

/* ── Classroom ───────────────────────────────────── */
async function connectClassroom(keyFromInput) {
  const gasUrl = (C.CLASSROOM && C.CLASSROOM.GAS_URL) || '';
  const key = String(keyFromInput != null ? keyFromInput : CLASSROOM.savedKey()).trim();
  state.cr.err = ''; state.busy = '連線中…'; render();
  try {
    CLASSROOM.init(gasUrl, key);
    await CLASSROOM.ping();                 // 先確認網址與通行碼，錯了不必等後面
    CLASSROOM.saveKey(key);                 // 通行碼記在這台瀏覽器，不進版控
    state.cr.courses = await CLASSROOM.courses();
    state.cr.on = true;
  } catch (e) {
    state.cr.err = e.message;      // classroom.js 已經把錯誤翻成「下一步怎麼辦」
  }
  state.busy = ''; render();
}
async function pickCourse(id) {
  state.cr.courseId = id; state.cr.workId = ''; state.cr.rows = {};
  // 課名裡有班級就自動篩到那一班（「資訊科技 801」→ 801）
  const course = state.cr.courses.find(c => c.id === id);
  const guess = CLASSROOM.classFromCourseName(course && course.name);
  if (guess && allClasses().indexOf(guess) >= 0) state.klass = guess;
  state.busy = '讀取作業清單…'; render();
  try { state.cr.works = await CLASSROOM.coursework(id); }
  catch (e) { state.cr.err = e.message; }
  state.busy = ''; render();
}
/**
 * 讀取「這一關」的繳交。
 *
 * 老師的作業名稱帶著單元代號（「2026/08/06 任務一：2-1-1A 班級置物櫃」），
 * 所以選好關卡按一下就找得到，不必每次在下拉選單裡翻。
 * 找不到或找到多份時**不會亂猜** —— 改成讓老師自己指定，
 * 猜錯的代價是整班的分數登記到別關去。
 */
async function loadThisUnit() {
  state.cr.err = ''; state.cr.matched = ''; state.cr.ambiguous = null;
  const ids = Object.keys(KINDS).map(unitIdOf).filter(Boolean);
  const r = CLASSROOM.findWork(state.cr.works, ids);
  if (r.work) { state.cr.matched = r.work.title; return pickWork(r.work.id); }
  state.cr.ambiguous = r.many || [];
  state.cr.err = (r.many && r.many.length)
    ? `作業名稱裡有「${r.id}」的不只一份（${r.many.length} 份），請自己指定是哪一份。`
    : `這門課裡找不到作業名稱含「${ids.join('」或「')}」的那一份。`
      + '請確認作業標題有帶關卡代號，或自己從下拉選單指定。';
  render();
}

/** 整批給分：只給「真的有那一種附件」的人 —— 沒交影片的不該拿到影片的分 */
async function awardAllHandedIn() {
  const todo = [];
  students().forEach(s => Object.keys(KINDS).forEach(kk => {
    if (s.per[kk].atts.length && !s.per[kk].given) todo.push([s.sid, kk]);
  }));
  if (!todo.length) { state.msg = '沒有「有繳交但還沒給分」的項目。'; render(); return; }
  const who = (state.klass || '這一') + ' 班';
  if (!confirm(`${who}第 ${state.no} 關：把 ${todo.length} 個「有繳交但還沒給分」的項目一次給分？\n` +
               '（沒有交那一種檔案的不會給。還是建議先點開看過幾份再按）')) return;
  for (const [sid, kk] of todo) await award(sid, kk, true);
}

async function pickWork(id) {
  state.cr.workId = id;
  state.busy = '讀取繳交狀況…'; render();
  try {
    /* Apps Script 回來的就是「學號 → 這一筆繳交」，
       email → 學號 的對應在 .gs 裡面做完了 ——
       這樣回應裡不含姓名與 email，網址萬一外流也不會把全班名單帶出去。 */
    state.cr.rows = await CLASSROOM.submissions(state.cr.courseId, id);
    state.cr.err = '';
  } catch (e) { state.cr.err = e.message; }
  state.busy = ''; render();
}

/* ── 給分／取消 ───────────────────────────────────
   寫進 modules.{flowchart|scratch}.{imgUnits|vidUnits}[單元] = { at, by }。
   這兩格學生寫不動（安全規則擋著），所以學生端之後怎麼寫自己的進度
   都不會把加分蓋掉。 */
/* 一份作業裡同時有「流程圖圖片」和「程式錄影」兩個附件，
   所以卡片上兩塊都要顯示。附件是圖片還是影片用 guessKind 判斷 ——
   那只是「看起來」，最後仍然由老師點開確認。 */
function attOf(sub, kind) {
  if (!sub) return [];
  return (sub.attachments || []).filter(a => CLASSROOM.guessKind(a) === kind);
}

async function award(sid, kindKey, on) {
  const k = KINDS[kindKey];
  const unitId = unitIdOf(kindKey);
  if (!unitId) { state.msg = '這個學期沒有對應的關卡，無法加分。'; render(); return; }
  const cur = ((state.progress[sid] || {}).modules || {})[k.mod] || {};
  const map = Object.assign({}, cur[k.field] || {});
  if (on) map[unitId] = { at: Date.now(), by: state.who.email };
  else delete map[unitId];

  state.busy = '寫入…'; render();
  try {
    await setDoc(doc(db, PROGRESS, sid), {
      studentId: sid,
      modules: { [k.mod]: { [k.field]: map } },
      updatedAt: Date.now()
    }, { merge: true });
    // 本機也更新，畫面立刻反映（不必整批重讀）
    state.progress[sid] = state.progress[sid] || {};
    state.progress[sid].modules = state.progress[sid].modules || {};
    state.progress[sid].modules[k.mod] = Object.assign({}, cur, { [k.field]: map });
    state.msg = '';
  } catch (e) {
    state.msg = '寫入失敗：' + e.message;
  }
  state.busy = ''; render();
}

/** 這一關在該模組裡的單元代號（流程圖與程式各有自己的十關，用第幾關對應） */
function unitIdOf(kindKey) {
  const list = KINDS[kindKey].units;
  const u = list.find(x => x.no === state.no);
  return u ? u.id : '';
}

/** 名冊裡實際有哪些班級 */
function allClasses() {
  const set = {};
  Object.keys(state.roster).forEach(sid => {
    const c = clsOf(sid, state.roster[sid]);
    if (c) set[c] = true;
  });
  return Object.keys(set).sort();
}

function students() {
  return Object.keys(state.roster).sort()
    .filter(sid => !state.klass || clsOf(sid, state.roster[sid]) === state.klass)
    .map(sid => {
      const r = state.roster[sid] || {};
      const p = state.progress[sid] || {};
      const sub = state.cr.rows[sid] || null;
      const per = {};
      Object.keys(KINDS).forEach(kk => {
        const k = KINDS[kk], uid = unitIdOf(kk);
        per[kk] = {
          unitId: uid,
          given: uid ? GRADING.hasBonus(((p.modules || {})[k.mod] || {})[k.field], uid) : false,
          atts: attOf(sub, kk === 'img' ? 'image' : 'video')
        };
      });
      return {
        sid, name: r.name || '', cls: clsOf(sid, r), no: noOf(sid, r),
        stars: GRADING.starsWithBonus(p),
        sub, per,
        // 看不出類型的附件單獨列出來，不要默默藏起來
        other: sub ? (sub.attachments || []).filter(a => CLASSROOM.guessKind(a) === 'unknown') : []
      };
    });
}

/* ── 畫面 ───────────────────────────────────────── */
function render() {
  if (!state.who) {
    el('app').innerHTML = `
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 text-center pop">
        <div class="text-4xl mb-3">🔐</div>
        <h2 class="text-xl font-black mb-2">請用老師的學校 Google 帳號登入</h2>
        <p class="text-slate-500 text-sm mb-2">這一頁會讀全班成績，只有老師進得來。</p>
        <p class="text-slate-400 text-xs mb-5 leading-relaxed">
          資料庫的安全規則要一個 Firebase 身分才肯放行，Classroom 那邊的連線它不認得。<br>
          從教師端點「📥 繳交審核」進來的話會沿用你在那邊的登入，不必再登一次。</p>
        <button id="login" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-6 py-3 rounded-xl">用 Google 登入</button>
      </div>`;
    return;
  }

  const classes = allClasses();
  const list = students();
  const cnt = k => list.filter(s => s.per[k].given).length;
  const inCnt = list.filter(s => s.sub && CLASSROOM.handedIn(s.sub)).length;
  const maxNo = Math.max(FLOW.length, PROG.length, 1);

  el('app').innerHTML = `
    ${state.busy ? `<div class="mb-3 text-sm font-bold text-slate-500">⏳ ${esc(state.busy)}</div>` : ''}
    ${state.msg ? `<div class="mb-3 bg-amber-50 border border-amber-300 text-amber-800 text-sm rounded-xl px-4 py-3">${esc(state.msg)}</div>` : ''}

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4 pop">
      <!-- 班級：一排藥丸分頁，和教師成績登錄系統同一套操作。
           ★ 不加「班級：」字樣，px 也收窄一點 —— 十二個班要排得下一行。
             多那三個字就會擠掉最後一班，然後 812 自己掉到第二行。 -->
      <div class="flex items-center gap-2 flex-wrap mb-4">
        ${classes.length
          ? classes.map(c => `
            <button data-klass="${esc(c)}" class="px-4 py-2 rounded-full text-sm transition-all duration-200
              ${c === state.klass
                ? 'font-bold bg-blue-600 text-white shadow-md transform hover:scale-105'
                : 'font-medium bg-white text-gray-600 hover:bg-gray-100 border border-gray-200 hover:shadow-sm'}">
              ${esc(c)}</button>`).join('')
          : '<span class="text-sm text-slate-400">名冊是空的</span>'}
      </div>

      <!-- 關卡：流程圖與程式各有自己的十關，用「第幾關」一起對應
           （學生交的是同一份作業，裡面有 png 也有 mp4） -->
      <div class="flex items-center gap-2 flex-wrap">
        ${Array.from({ length: maxNo }, (_, i) => i + 1).map(n => `
          <button data-no="${n}" class="w-10 h-10 rounded-full text-sm transition-all duration-200
            ${n === state.no
              ? 'font-bold bg-indigo-600 text-white shadow-md'
              : 'font-medium bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}">
            ${n}</button>`).join('')}
      </div>
      <div class="mt-3 text-xs text-slate-500 leading-relaxed">
        ${esc(state.klass || '—')} 班 ${list.length} 人｜第 ${state.no} 關
        ${FLOW.length ? `　🖼️ ${esc((FLOW.find(u => u.no === state.no) || {}).title || '')}` : ''}
        ${PROG.length ? `　🎬 ${esc((PROG.find(u => u.no === state.no) || {}).title || '')}` : ''}
        <br>已給分：流程圖 <b class="text-emerald-600">${cnt('img')}</b>、程式 <b class="text-emerald-600">${cnt('vid')}</b>
        ${state.cr.on ? `｜Classroom 顯示已繳交 <b class="text-indigo-600">${inCnt}</b>` : ''}
      </div>
    </div>

    ${crPanel()}

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      ${list.map(card).join('') || '<div class="text-slate-400 text-sm">這一班名冊是空的。</div>'}
    </div>`;
}

/* 一張學生小卡（沿用教師成績登錄系統的卡片樣式）。
   ★ 有繳交就加框線 —— 老師掃一眼就知道要點誰，不必一個一個開。
     沒繳交是虛線灰框，和「已加分」的綠底一眼分得出三種狀態。 */
function card(s) {
  const hasAny = s.sub && CLASSROOM.handedIn(s.sub);
  const base = hasAny
    ? 'bg-white border-blue-300 shadow-[0_0_0_3px_rgba(147,197,253,0.35)]'
    : 'bg-white border-gray-200';
  return `
    <div class="${base} border rounded-2xl p-4 transition-all duration-200 hover:shadow-lg">
      <div class="flex items-baseline justify-between mb-3">
        <h3 class="font-bold text-gray-800 text-lg truncate" title="${esc(s.name)}">${esc(s.name || '（名冊沒有姓名）')}</h3>
        <span class="text-xs text-gray-400 font-mono shrink-0 ml-2">${esc(s.cls)} ${esc(s.no)}號</span>
      </div>
      <div class="text-[11px] text-gray-400 font-mono -mt-2 mb-3">${esc(s.sid)}　
        <span class="text-amber-500">流程圖 ${s.stars.flowchart}⭐ ・ 程式 ${s.stars.scratch}⭐</span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        ${block(s, 'img')}
        ${block(s, 'vid')}
      </div>
      ${s.other.length ? `<div class="mt-2 text-[11px] text-slate-400">
        其他附件（看不出類型）：${s.other.map(a => link(a)).join('、')}</div>` : ''}
    </div>`;
}

/** 卡片上的一塊：流程圖 或 程式 */
function block(s, kk) {
  const k = KINDS[kk], p = s.per[kk];
  const has = p.atts.length > 0;
  const box = p.given
    ? 'bg-emerald-50 border-emerald-400'
    : (has ? 'bg-white border-blue-400' : 'bg-slate-50 border-dashed border-slate-300');
  return `
    <div class="border-2 ${box} rounded-xl p-2 text-center">
      <div class="text-xs font-black text-slate-600 mb-1">${k.icon} ${esc(k.label.replace('流程圖圖片', '流程圖').replace('程式錄影', '程式'))}</div>
      <div class="text-[11px] leading-snug mb-2 min-h-[2.2em]">
        ${has ? p.atts.map(a => link(a)).join('<br>')
              : `<span class="text-slate-400">${state.cr.on ? '未繳交' : '未連接'}</span>`}
      </div>
      <button data-award="${esc(s.sid)}" data-kind="${kk}" data-on="${p.given ? '0' : '1'}"
        ${p.unitId ? '' : 'disabled'}
        class="w-full px-2 py-1.5 rounded-lg text-xs font-bold transition
        ${p.given ? 'bg-emerald-600 text-white hover:bg-emerald-700'
                  : 'bg-indigo-600 text-white hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400'}">
        ${p.given ? '✅ 已加分（點一下取消）' : '+1⭐'}
      </button>
    </div>`;
}

/** 附件連結：點開就是那份 png／mp4（在 Drive 裡開，老師本來就登入了） */
function link(a) {
  return `<a href="${esc(a.link)}" target="_blank" rel="noopener"
     class="text-indigo-600 underline hover:text-indigo-800 break-all">${esc(a.title)}</a>`;
}

function errBox(msg) {
  const html = esc(msg).replace(/(https?:\/\/\S+)/g,
    '<a href="$1" target="_blank" rel="noopener" class="underline font-bold break-all">$1</a>');
  return `<div class="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 mb-3 whitespace-pre-wrap leading-relaxed">${html}</div>`;
}

function crPanel() {
  const gasUrl = (C.CLASSROOM && C.CLASSROOM.GAS_URL) || '';
  if (!state.cr.on) {
    return `
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4 pop">
        <div class="font-black text-sm mb-1">🔗 Google Classroom（可不接）</div>
        <p class="text-xs text-slate-500 leading-relaxed mb-3">
          接起來之後，這一頁會直接列出誰交了、交了什麼，點開就能看。<br>
          <b>不接也能用</b> —— 自己開 Classroom 看完，回來按給分就好。
        </p>
        ${gasUrl ? '' : `<p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-3">
          還沒設定 <span class="font-mono">CLASSROOM.GAS_URL</span>（在 ${esc(TERM)}/config.js）。
          部署步驟寫在 <span class="font-mono">shared/classroom.gs</span> 開頭，約五分鐘。</p>`}
        ${state.cr.err ? errBox(state.cr.err) : ''}
        <!-- 通行碼刻意不放在 config.js —— 那個 repo 是公開的。
             在這裡輸入一次，記在這台瀏覽器裡。 -->
        <div class="flex flex-wrap items-end gap-2">
          <div>
            <label class="block text-xs font-black text-slate-500 mb-1">通行碼</label>
            <input id="cr-key" type="password" value="${esc(CLASSROOM.savedKey())}" placeholder="Apps Script 的 QUERY_KEY"
                   class="border-2 border-slate-200 rounded-lg px-3 py-2 text-sm w-56">
          </div>
          <button id="cr-connect" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-lg" ${gasUrl ? '' : 'disabled'}>連接 Google Classroom</button>
        </div>
        <p class="text-[11px] text-slate-400 mt-2">通行碼就是 Apps Script「專案設定 → 指令碼屬性」裡的 <span class="font-mono">QUERY_KEY</span>，只會存在這台電腦。</p>
      </div>`;
  }
  return `
    <div class="bg-white rounded-2xl border border-indigo-200 shadow-sm p-5 mb-4 pop">
      <div class="flex items-center justify-between mb-3">
        <div class="font-black text-sm">🔗 Google Classroom　<span class="text-emerald-600 text-xs">已連接</span></div>
        <button id="cr-off" class="text-xs text-slate-400 hover:text-rose-600 font-bold">中斷並清除通行碼</button>
      </div>
      ${state.cr.err ? errBox(state.cr.err) : ''}
      <div class="grid sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-black text-slate-500 mb-1">課程</label>
          <select id="cr-course" class="w-full border-2 border-slate-200 rounded-lg px-3 py-2 text-sm">
            <option value="">請選擇…</option>
            ${state.cr.courses.map(c => `<option value="${esc(c.id)}" ${c.id === state.cr.courseId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
          </select>
          <p class="text-[11px] text-slate-400 mt-1">課名裡有班級（例如「資訊科技 801」）就會自動把名單篩到那一班。</p>
        </div>
        <div class="flex items-end">
          <button id="cr-load" ${state.cr.courseId ? '' : 'disabled'}
            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white text-sm font-bold px-4 py-2 rounded-lg">
            🔍 讀取第 ${state.no} 關的繳交
          </button>
        </div>
      </div>
      ${state.cr.matched ? `<p class="mt-2 text-xs text-emerald-700">已對到作業：<b>${esc(state.cr.matched)}</b></p>` : ''}
      ${(state.cr.ambiguous || state.cr.err) && state.cr.courseId ? `
        <div class="mt-3">
          <label class="block text-xs font-black text-slate-500 mb-1">自己指定作業</label>
          <select id="cr-work" class="w-full border-2 border-slate-200 rounded-lg px-3 py-2 text-sm">
            <option value="">請選擇…</option>
            ${((state.cr.ambiguous && state.cr.ambiguous.length) ? state.cr.ambiguous : state.cr.works)
              .map(w => `<option value="${esc(w.id)}" ${w.id === state.cr.workId ? 'selected' : ''}>${esc(w.title)}</option>`).join('')}
          </select>
        </div>` : ''}
      ${state.cr.workId ? `
        <div class="mt-3 flex items-center gap-3 flex-wrap">
          <button id="cr-all" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg">
            把「已繳交」的人一次給分（流程圖＋程式）
          </button>
          <span class="text-xs text-slate-400">建議先點開看過幾份再按 —— 系統分不出交的是不是對的東西。</span>
        </div>` : ''}
    </div>`;
}

/* ── 事件 ───────────────────────────────────────── */
document.addEventListener('click', async (e) => {
  if (e.target.closest('#login')) {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (err) { state.msg = '登入失敗：' + err.message; render(); }
    return;
  }
  const cb = e.target.closest('[data-klass]');
  if (cb) { state.klass = cb.dataset.klass; render(); return; }
  const nb = e.target.closest('[data-no]');
  if (nb) {
    state.no = Number(nb.dataset.no);
    // 換關卡就要重新對作業 —— 舊的繳交資料留著會張冠李戴
    state.cr.workId = ''; state.cr.rows = {}; state.cr.matched = ''; state.cr.ambiguous = null;
    render(); return;
  }
  if (e.target.closest('#cr-load')) { loadThisUnit(); return; }
  if (e.target.closest('#cr-connect')) {
    const box = document.getElementById('cr-key');
    connectClassroom(box ? box.value : undefined);
    return;
  }
  if (e.target.closest('#cr-off')) {
    CLASSROOM.forgetKey();
    state.cr = { on: false, err: '', courses: [], works: [], courseId: '', workId: '', rows: {} };
    render(); return;
  }
  if (e.target.closest('#cr-all')) { awardAllHandedIn(); return; }
  const ab = e.target.closest('[data-award]');
  if (ab) { award(ab.dataset.award, ab.dataset.kind, ab.dataset.on === '1'); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'cr-course') { pickCourse(e.target.value); return; }
  if (e.target.id === 'cr-work') { pickWork(e.target.value); return; }
});

render();
</script>
</body>
</html>
