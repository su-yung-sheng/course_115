<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資訊科技課程 · 入口</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- 學期判定的單一來源（日期區間，不是用月份猜）-->
<script src="shared/semester.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html,body{font-family:'Noto Sans TC',system-ui,sans-serif}
  body{background-color:#e7e5e4;
       background-image:linear-gradient(rgba(120,113,108,.06) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(120,113,108,.06) 1px,transparent 1px);
       background-size:26px 26px}
</style>
</head>
<body class="p-6 text-slate-800">

<div class="max-w-lg mx-auto mt-12 text-center">

  <p class="text-sm font-bold tracking-widest text-slate-500 uppercase">前峰國中 八年級</p>
  <h1 class="text-3xl font-black mt-2 mb-8">資訊科技課程</h1>

  <!-- 自動導向提示：倒數可以取消，否則按不到下面的手動選擇 -->
  <div id="auto" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4 hidden">
    <p class="text-sm font-bold text-slate-600">
      <span id="sec">3</span> 秒後前往<span id="term-name" class="text-slate-900"></span>…
    </p>
    <button id="cancel" class="mt-3 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold rounded-xl border border-slate-300 transition">
      先不要，我自己選
    </button>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <a href="11501/hub.html" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md hover:border-slate-300 transition">
      <div class="text-2xl mb-1">📘</div>
      <div class="font-black">上學期</div>
      <div class="text-xs text-slate-400 font-bold mt-1">115-1</div>
    </a>
    <a href="11502/hub.html" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md hover:border-slate-300 transition">
      <div class="text-2xl mb-1">📗</div>
      <div class="font-black">下學期</div>
      <div class="text-xs text-slate-400 font-bold mt-1">115-2</div>
    </a>
  </div>

  <div class="mt-8 text-xs text-slate-400 leading-relaxed">
    <p>
      老師工具：
      <a href="11501/teacher.html" class="underline hover:text-slate-600">上學期教師端</a> ·
      <a href="11502/teacher.html" class="underline hover:text-slate-600">下學期教師端</a>
    </p>
    <p class="mt-2">
      系統檢查：
      <a href="shared/status.html?term=11501" class="underline hover:text-slate-600">上學期</a> ·
      <a href="shared/status.html?term=11502" class="underline hover:text-slate-600">下學期</a>
    </p>
    <p class="mt-2">
      <a href="shared/google-test.html" class="underline hover:text-slate-600">Google 帳號登入可行性測試</a>
    </p>
  </div>
</div>

<script>
/* 總入口的導向規則
   ─────────────────────────────────────────────────────────
   ?term=11501     直接前往指定學期（測試、或做書籤用）
   ?stay           完全不自動導向，停在這一頁自己選
   都沒帶          依 shared/semester.js 的日期區間判定，倒數 3 秒後導向

   為什麼要能取消：原本設 1.2 秒就跳，下面兩張手動選擇的卡片根本按不到，
   想測另一個學期只能手打網址。倒數期間按任何地方都會取消。 */
(function () {
  var q = new URLSearchParams(location.search);

  // ① 指定學期 → 直接走
  var want = q.get('term');
  if (want && /^115\d{2}$/.test(want)) {
    location.replace(want + '/hub.html');
    return;
  }

  // ② 要求停留 → 什麼都不做
  if (q.has('stay')) return;

  // ③ 同一個瀏覽階段內已經選過「自己選」→ 尊重它，不要每次都倒數
  try { if (sessionStorage.getItem('entry-stay') === '1') return; } catch (e) {}

  // ★ 學期一律由 shared/semester.js 判定（明確的日期區間）。
  //   月份判斷會出錯：2026-07 用「2～7 月＝下學期」會判成 11502，
  //   但那時 115 學年度還沒開始。
  var term = SEMESTER.current();
  document.getElementById('term-name').textContent = SEMESTER.name(term);
  document.getElementById('auto').classList.remove('hidden');

  var left = 3, timer = null;
  var secEl = document.getElementById('sec');

  function stop() {
    if (!timer) return;
    clearInterval(timer); timer = null;
    document.getElementById('auto').classList.add('hidden');
    try { sessionStorage.setItem('entry-stay', '1'); } catch (e) {}
  }

  timer = setInterval(function () {
    left--;
    if (left <= 0) { clearInterval(timer); timer = null; location.replace(term + '/hub.html'); return; }
    secEl.textContent = left;
  }, 1000);

  // 按取消、點畫面任何地方、或按鍵，都算「我要自己選」
  document.getElementById('cancel').addEventListener('click', function (e) { e.stopPropagation(); stop(); });
  document.addEventListener('click', stop);
  document.addEventListener('keydown', stop);
})();
</script>

</body>
</html>
