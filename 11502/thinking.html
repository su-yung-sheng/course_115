<!-- 身分守門：未從闖關基地登入者導回入口 -->
<script src="config.js"></script>
<script src="../shared/semester.js"></script>

<body class="bg-slate-100 h-screen overflow-hidden">
<!-- 返回基地：固定左上，每頁只放一顆（嵌入 iframe 時自動隱藏） -->
<a id="back-to-hub" href="hub.html" title="返回闖關基地"
   style="position:fixed;top:1rem;left:1rem;z-index:9999;display:inline-flex;align-items:center;gap:.35rem;background:#1e293b;color:#fff;font-weight:700;font-size:.875rem;padding:.5rem .875rem;border-radius:9999px;box-shadow:0 10px 15px -3px rgba(0,0,0,.2);text-decoration:none;">&#8592; 返回基地</a>
<script>
if (window.self !== window.top) { var b = document.getElementById('back-to-hub'); if (b) b.style.display='none'; }
</script>

    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // --- Icon 組件 (SVG) ---
        const Icon = ({ path, className }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const Icons = {
            User: (props) => <Icon {...props} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            LogOut: (props) => <Icon {...props} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>} />,
            Play: (props) => <Icon {...props} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Monitor: (props) => <Icon {...props} path={<><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>} />,
            Award: (props) => <Icon {...props} path={<><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>} />,
            Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
            Calendar: (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>} />,
            Timer: (props) => <Icon {...props} path={<><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></>} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />
        };

        // --- 全域時間與日期格式化工具 ---
        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        const formatDate = (date) => {
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 星期${days[date.getDay()]}`;
        };

        // --- Firebase 資料庫設定與初始化 ---
        const fbStore = {
            db: null, doc: null, getDoc: null, setDoc: null, arrayUnion: null, collection: null, getDocs: null
        };

        const initFB = async () => {
            if (fbStore.db) return true;
            try {
                const { initializeApp, getApps, getApp } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js')")();
                const { getFirestore, doc, getDoc, setDoc, arrayUnion, collection, getDocs } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')")();
                const { getAuth, signInAnonymously, onAuthStateChanged } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js')")();

                // Firebase：核心設定集中在 config.js，
                // 這裡只覆蓋本頁專屬的 appId／measurementId（運算思維）
                const firebaseConfig = Object.assign({}, window.CONFIG.FIREBASE, {
                  appId: "1:85509938573:web:f02e73f85b86f9e06771c4",
                  measurementId: "G-998D8NXNY1"
                });

                const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
                const auth = getAuth(app);
                
                try {
                    // AUTH.attachSession()：已經有身分（例如剛在闖關基地用學校 Google 帳號登入）
                    //    就不要再匿名登入，否則會把 Google 身分蓋掉，安全規則的 isOwner() 失效。
                    await AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
                } catch (authErr) {
                    console.warn("匿名登入失敗 (可能未於 Firebase Console 啟用)，將嘗試直接讀寫資料庫:", authErr);
                }
                
                fbStore.db = getFirestore(app);
                fbStore.doc = doc;
                fbStore.getDoc = getDoc;
                fbStore.setDoc = setDoc;
                fbStore.arrayUnion = arrayUnion;

                // 進度回報：把本頁的 Firestore 函式交給共用模組
                if (window.REPORT) REPORT.configure({
                    db: fbStore.db, doc, getDoc, setDoc, arrayUnion
                });
                fbStore.collection = collection;
                fbStore.getDocs = getDocs;
                return true;
            } catch (err) {
                console.error("Firebase 初始化失敗:", err);
                return false;
            }
        };

        // --- 班級過關紀錄查詢 Modal 組件 ---
        const QueryModal = ({ onClose, userClass }) => {
            const [studentsData, setStudentsData] = useState([]);
            const [loadingData, setLoadingData] = useState(true);
            const [errorMsg, setErrorMsg] = useState("");

            useEffect(() => {
                const fetchClassData = async () => {
                    setLoadingData(true);
                    setErrorMsg("");
                    try {
                        const ok = await initFB();
                        if (!ok) throw new Error("資料庫連線失敗");

                        const progressCol = fbStore.collection(fbStore.db, 'artifacts', 'comp-think-app', 'public', 'data', 'progress_sem2');
                        const snapshot = await fbStore.getDocs(progressCol);
                        
                        const data = [];
                        snapshot.forEach(doc => {
                            const d = doc.data();
                            if (d.classRoom === userClass) {
                                data.push(d);
                            }
                        });
                        
                        data.sort((a, b) => parseInt(a.seatNo) - parseInt(b.seatNo));
                        setStudentsData(data);
                        
                        if(data.length === 0) setErrorMsg(`目前 ${userClass} 班尚無任何通關紀錄。`);
                    } catch (err) {
                        setErrorMsg("查詢失敗，請確認 Firebase 資料庫規則已設為允許讀取。" + err.message);
                    } finally {
                        setLoadingData(false);
                    }
                };
                fetchClassData();
            }, [userClass]);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-4xl w-full mx-auto overflow-hidden relative flex flex-col max-h-[90vh]">
                        <div className="bg-green-600 px-6 py-4 flex justify-between items-center shrink-0">
                            <h3 className="text-xl font-bold text-white"><i className="fa-solid fa-users mr-2"></i>{userClass} 班過關紀錄查詢</h3>
                            <button onClick={onClose} className="text-green-200 hover:text-white transition-colors">
                                <i className="fa-solid fa-xmark text-2xl"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-50">
                            {loadingData ? (
                                <div className="text-center text-slate-500 py-16 flex flex-col items-center">
                                    <i className="fa-solid fa-spinner animate-spin text-5xl mb-4 text-green-500"></i>
                                    <p className="font-medium">正在載入 {userClass} 班的資料...</p>
                                </div>
                            ) : errorMsg ? (
                                <div className="text-center text-slate-500 py-10 font-medium bg-white rounded-xl border border-dashed border-slate-300">
                                    {errorMsg}
                                </div>
                            ) : (
                                <div className="overflow-hidden rounded-xl border border-slate-200 shadow-sm bg-white">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-700 text-sm">
                                                <th className="p-4 border-b border-slate-200 font-bold w-20">座號</th>
                                                <th className="p-4 border-b border-slate-200 font-bold w-32">姓名</th>
                                                <th className="p-4 border-b border-slate-200 font-bold w-24 text-center">過關數</th>
                                                <th className="p-4 border-b border-slate-200 font-bold">已通關關卡 (游標懸停顯示獨立通關日期)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            {studentsData.map((student, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
                                                    <td className="p-4 text-slate-600 font-mono font-bold">{student.seatNo}</td>
                                                    <td className="p-4 font-bold text-slate-800">{student.name}</td>
                                                    <td className="p-4 text-center">
                                                        <span className="bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full">
                                                            {student.completed ? student.completed.length : 0}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-slate-500 font-medium">
                                                        {student.completed && student.completed.length > 0 ? (
                                                            <div className="flex flex-wrap gap-2">
                                                                {student.completed.sort((a,b)=>a-b).map(id => (
                                                                    <div key={id} className="group relative inline-block cursor-help">
                                                                        <span className="bg-green-50 text-green-700 px-2.5 py-1.5 rounded-lg text-xs font-bold border border-green-100 shadow-sm transition-colors group-hover:bg-green-600 group-hover:text-white">
                                                                            #{id}
                                                                        </span>
                                                                        <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block bg-slate-800 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap z-10 shadow-lg">
                                                                            <i className="fa-regular fa-calendar-check mr-1 text-emerald-400"></i>
                                                                            通關日期: {student.completionDates?.[id] || student[`completionDates.${id}`] || '未知 (舊紀錄)'}
                                                                            <div className="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        ) : '無'}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 個人通關證書檢視 Modal 組件 ---
        const MyCertificatesModal = ({ onClose, user, completedChallenges, completedDates, completedImages, challenges }) => {
            const [selectedId, setSelectedId] = useState(
                completedChallenges.length > 0 ? [...completedChallenges].sort((a,b) => a-b)[0] : null
            );

            const currentChallenge = challenges.find(c => c.id === selectedId);
            const todayStr = formatDate(new Date()); 
            
            const passDate = completedDates[selectedId] || todayStr;
            const passImage = completedImages[selectedId];

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl shadow-2xl max-w-5xl w-full mx-auto overflow-hidden flex flex-col md:flex-row min-h-[550px] animate-[fadeIn_0.3s_ease-out]">
                        
                        <div className="w-full md:w-1/3 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 max-h-[50vh] md:max-h-none">
                            <div className="p-6 bg-green-600 text-white flex justify-between items-center shrink-0">
                                <h3 className="text-lg font-bold"><i className="fa-solid fa-trophy mr-2 text-amber-400"></i>我的成就庫</h3>
                                <button onClick={onClose} className="md:hidden text-green-200 hover:text-white transition-colors">
                                    <i className="fa-solid fa-xmark text-2xl"></i>
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {completedChallenges.length === 0 ? (
                                    <div className="text-center text-slate-400 mt-10">
                                        <i className="fa-solid fa-folder-open text-5xl mb-4 opacity-50"></i>
                                        <p className="font-bold">尚未獲得任何證書</p>
                                        <p className="text-sm mt-1">請先去挑戰關卡吧！</p>
                                    </div>
                                ) : (
                                    [...completedChallenges].sort((a,b) => a-b).map(id => {
                                        const c = challenges.find(ch => ch.id === id);
                                        return (
                                            <button 
                                                key={id}
                                                onClick={() => setSelectedId(id)}
                                                className={`w-full text-left p-4 rounded-xl font-bold flex items-center justify-between transition-all ${
                                                    selectedId === id 
                                                        ? 'bg-green-100 text-green-800 border-2 border-green-400 shadow-sm' 
                                                        : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${selectedId === id ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                        {c?.id}
                                                    </div>
                                                    <span>{c?.title}</span>
                                                </div>
                                                {selectedId === id && <i className="fa-solid fa-chevron-right text-green-500"></i>}
                                            </button>
                                        )
                                    })
                                )}
                            </div>
                        </div>

                        <div className="w-full md:w-2/3 p-6 sm:p-10 bg-slate-100 flex flex-col items-center justify-center relative">
                            <button onClick={onClose} className="hidden md:flex absolute top-6 right-6 text-slate-400 hover:text-slate-600 bg-white hover:bg-slate-200 rounded-full w-10 h-10 items-center justify-center shadow-sm transition-colors z-10">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>

                            {currentChallenge ? (
                                <div className="w-full max-w-xl bg-white border-[8px] border-double border-green-100 p-8 sm:p-12 shadow-xl relative text-center animate-[fadeIn_0.4s_ease-out]">
                                    <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                        <div className="bg-gradient-to-br from-amber-400 to-amber-600 text-white w-16 h-16 flex items-center justify-center rounded-full shadow-lg border-4 border-white">
                                            <i className="fa-solid fa-award text-3xl"></i>
                                        </div>
                                    </div>
                                    <h2 className="text-2xl sm:text-3xl font-black text-green-900 mt-6 mb-8 tracking-[0.2em] relative inline-block">
                                        通關證明
                                        <span className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-12 h-1 bg-amber-400 rounded-full"></span>
                                    </h2>
                                    
                                    <div className="text-lg text-slate-700 mb-6 leading-relaxed">
                                        茲證明 <br/>
                                        <span className="text-2xl font-bold text-green-700 mx-2">{user.classRoom}</span> 班 
                                        <span className="text-2xl font-bold text-green-700 mx-2">{user.seatNo}</span> 號 <br/>
                                        <span className="text-3xl font-black text-slate-900 mt-3 inline-block">{user.name}</span>
                                    </div>

                                    <div className="text-slate-500 font-bold mb-3">已成功完成運算思維挑戰關卡：</div>
                                    <div className="text-2xl sm:text-3xl font-black text-emerald-600 mb-6 py-3 px-6 bg-emerald-50 rounded-xl inline-block border border-emerald-100 shadow-inner">
                                        {currentChallenge.title}
                                    </div>

                                    {/* 動態顯示雲端截圖 */}
                                    {passImage && (
                                        <div className="mt-4 mb-6 mx-auto p-1 border-2 border-green-100 border-dashed rounded-lg max-w-[280px] bg-slate-50 relative group">
                                            <img src={passImage} alt="通關截圖證明" className="w-full h-auto object-contain rounded shadow-sm max-h-[160px]" />
                                            <div className="absolute top-2 right-2 bg-green-900/70 text-white text-[10px] px-2 py-1 rounded backdrop-blur-md opacity-0 group-hover:opacity-100 transition-opacity">
                                                <i className="fa-solid fa-camera mr-1"></i>截圖佐證
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex justify-between items-end mt-8 pt-6 border-t-2 border-dashed border-slate-200">
                                        <div className="text-left">
                                            <div className="font-bold text-slate-800">運算思維挑戰平台</div>
                                            <div className="text-[10px] text-slate-400 mt-1 uppercase tracking-wider font-bold"><i className="fa-solid fa-check-circle text-emerald-500 mr-1"></i>System Verified</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-xs font-bold text-slate-500 mb-1">通關日期</div>
                                            <div className="text-sm font-bold text-slate-700">{passDate}</div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="text-slate-400 text-center flex flex-col items-center">
                                    <i className="fa-solid fa-medal text-7xl mb-4 opacity-30"></i>
                                    <p className="text-lg font-bold">選擇左側列表檢視通關證書</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 證書製作/通關確認 Modal 組件 ---
        const CertVerificationModal = ({ onClose, user, challenge, studyTime, onComplete }) => {
            // 設定集中在 config.js（換網址、換密碼只改那一支）
            const API_BASE = window.CONFIG.SERVER_URL;
            const CLASS_PASS = window.CONFIG.CLASS_PASS;      // 需與 Colab Secrets 的 CLASS_PASSCODE2 一致
            const GAS_WEB_APP_URL = window.CONFIG.GAS_UPLOAD_URL;

            /* ⚠️ 以前「還在連」和「連不上」顯示的是同一句「伺服器連線中...」——
               老師因此分不出後端是還沒連上、還是根本掛了。分成兩句。 */
            const OFFLINE_NOTE = "連不上伺服器 —— 請告訴老師（可能是後端沒開，或同時上線的人太多）";
            const [isOnline, setIsOnline] = useState(false);
            const [netNote, setNetNote] = useState("伺服器連線中...");
            const [isProcessing, setIsProcessing] = useState(false);
            const [selectedFile, setSelectedFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [result, setResult] = useState(null); 
            
            const fileInputRef = useRef(null);
            
            const [certDate] = useState(formatDate(new Date()));
            const [certTime] = useState(formatTime(studyTime));

            useEffect(() => {
                let interval;
                /* ⚠️⚠️ 2026-08-26 老師回報：多人連線之後卡在「伺服器連線中...」。
                   原因是這個輪詢本身：
                     ‧ 原本每 5 秒一次，一個班 30 人就是**每分鐘 360 次**
                       打到 ngrok，很容易撞到免費方案的請求上限
                     ‧ 而且 setIsOnline(res.ok) 是**一次失敗就判離線**，
                       上傳按鈕（disabled={!isOnline...}）跟著鎖死，
                       學生就再也傳不出去 —— 後端其實還活著
                     ‧ 沒有逾時，慢的請求會一直堆積
                   ⇒ 頻率降下來、失敗要容忍、背景分頁不打、請求要有逾時。 */
                const MISS_LIMIT = 3;        // 連續失敗這麼多次才算真的離線
                let misses = 0, alive = true;
                const checkHealth = async () => {
                    if(isProcessing) return;         // 自己正在辨識就不用問
                    if(document.hidden) return;      // 分頁在背景，不要浪費配額
                    const ctl = new AbortController();
                    const timer = setTimeout(() => ctl.abort(), 8000);
                    try {
                        const res = await fetch(API_BASE + "/health", {
                            headers: { 'ngrok-skip-browser-warning': '1' },
                            signal: ctl.signal
                        });
                        if(!alive) return;
                        if(res.ok){ misses = 0; setIsOnline(true); setNetNote("伺服器連線中..."); }
                        else if(++misses >= MISS_LIMIT){ setIsOnline(false); setNetNote(OFFLINE_NOTE); }
                    } catch(e) {
                        if(!alive) return;
                        if(++misses >= MISS_LIMIT){ setIsOnline(false); setNetNote(OFFLINE_NOTE); }
                    } finally {
                        clearTimeout(timer);
                    }
                };
                checkHealth();
                interval = setInterval(checkHealth, 25000);
                return () => { alive = false; clearInterval(interval); };
            }, [isProcessing]);

            const handleFileChange = (e) => {
                if(e.target.files.length > 0) {
                    const file = e.target.files[0];
                    setSelectedFile(file);
                    setPreviewUrl(URL.createObjectURL(file));
                    setResult(null);
                }
            };

            const startAnalysis = async () => {
                if(!selectedFile) return;
                setIsProcessing(true);
                setResult(null);

                // ── 排隊回饋：先問目前排隊人數，讓學生知道自己排第幾個 ──
                //    30 人同時上傳時，沒有回饋學生會一直重按，反而把佇列塞爆。
                let myPos = 1;
                try {
                    const q = await (await fetch(API_BASE + "/queue", {
                        headers: { 'ngrok-skip-browser-warning': '1' }, cache: 'no-store'
                    })).json();
                    myPos = (q.pending || 0) + 1;
                } catch (e) { /* 問不到就當自己第一個，不影響流程 */ }

                setResult({
                    status: 'queued',
                    msg: myPos > 1
                        ? `🧠 已送出！你排第 ${myPos} 位，前面還有 ${myPos - 1} 位同學（約 ${Math.max(1, Math.round((myPos - 1) * 6 / 60 * 10) / 10)} 分鐘）`
                        : '🧠 已送出，正在辨識中…'
                });

                // 等待期間持續更新前面還有幾位
                const queueTimer = setInterval(async () => {
                    try {
                        const q = await (await fetch(API_BASE + "/queue", {
                            headers: { 'ngrok-skip-browser-warning': '1' }, cache: 'no-store'
                        })).json();
                        const ahead = Math.max(0, (q.pending || 1) - 1);

                            msg: ahead > 0

                const englishMappings = {

                    "必勝棋局": "winnable chess",
                    "變數謎題": "variable puzzle",
                    "遊園專車": "amusement park bus",

                formData.append("password", (CLASS_PASS || "").trim());

                try {
                    const res = await fetch(API_BASE + "/analyze", {
                        method: 'POST',
                        headers: { 'ngrok-skip-browser-warning': '1' },
                        body: formData
                    });
                    if(!res.ok) throw new Error("伺服器拒絕連線");
                    
                    const data = await res.json();
                    
                    if(data.status === "success") {
                        const rawTexts = data.raw_text || [];

                        // 🔒 判定改由「後端」裁決（data.pass）：關鍵字比對全部在伺服器做，
                        //    前端只負責顯示結果，學生用開發者工具改不了通關條件。
                        if(data.pass === true) {
                            setResult({ status: 'uploading', msg: "截圖驗證成功！正在上傳備份至雲端硬碟..." });
                            
                            // 開始上傳截圖至 Google Drive (GAS)

                            try {
                                if (!GAS_WEB_APP_URL || !GAS_WEB_APP_URL.startsWith("http")) {
                                    uploadNote = "（截圖備份未設定，僅記錄通關）";
                                } else {

                                    });

                                    const gasPayload = {

                                    });

                                    const raw = await gasRes.text();
                                    let gasData = null;

                            } catch (uploadErr) {

                            onComplete(challenge.id, certDate, finalImageUrl);

                                : ["截圖未通過驗證，請確認畫面有『挑戰成功』與關卡名稱"];
                            setResult({ status: 'fail', msg: "截圖驗證失敗，請確認圖片內容：", errors: errors });
                        }
                    } else {
                        setResult({ status: 'error', msg: "辨識失敗：" + data.message });
                    }
                } catch(err) {
                    setResult({ status: 'error', msg: "連線錯誤：請確認伺服器正在執行，且 API 網址正確。" });
                } finally {
                    clearInterval(queueTimer);   // 停掉排隊輪詢
                    setIsProcessing(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 overflow-y-auto">

                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>

                        <div className="text-center mb-8">
                            <div className="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-full text-sm font-semibold text-slate-500 mb-6 shadow-sm transition-colors">
                                <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse shadow-[0_0_0_4px_rgba(16,185,129,0.2)]' : 'bg-slate-300'}`}></span>

        // --- 主應用程式 ---
        const App = () => {
            // 快速通道：hub 登入時已把完整身分寫進 localStorage，

                        let count = 0;
                        snapshot.forEach(doc => {
                            const d = doc.data();
                            if (d.classRoom === user.classRoom && d.completed && d.completed.includes(selectedChallenge.id)) {
                                count++;
                            }
                        });
                        
                        if (isMounted) setClassPassCount(count);
                    } catch (err) {
                        console.error("無法取得通關人數:", err);
                        if (isMounted) setClassPassCount('-');
                    }
                };
                
                fetchPassCount();
                return () => { isMounted = false; };
            }, [selectedChallenge, user, completedChallenges]);

            const handleChallengeComplete = async (challengeId, passDate, imageUrl) => {
                if (!completedChallenges.includes(challengeId)) {
                    const newCompleted = [...completedChallenges, challengeId];
                    setCompletedChallenges(newCompleted);
                    setCompletedDates(prev => ({...prev, [challengeId]: passDate}));
                    if(imageUrl) setCompletedImages(prev => ({...prev, [challengeId]: imageUrl}));
                    
                    if (fbStore.db && user) {
                        try {
                            const progressRef = fbStore.doc(fbStore.db, 'artifacts', 'comp-think-app', 'public', 'data', 'progress_sem2', user.docId);
                            
                            const updateData = {
                                completed: fbStore.arrayUnion(challengeId),
                                completionDates: { [challengeId]: passDate },
                                lastUpdated: new Date().toISOString(),
                                name: user.name,
                                classRoom: user.classRoom,
                                seatNo: user.seatNo
                            };
                            if (imageUrl) {
                                updateData.completionImages = { [challengeId]: imageUrl };
                            }

                            await fbStore.setDoc(progressRef, updateData, { merge: true });
                        } catch (err) {
                            console.error("寫入進度失敗:", err);
                        }
                    }

                    // ★ 回報統一進度，hub 的卡片才會即時亮燈
                    //   星等走 GRADING：運算思維每通過一小關 +2 星
                    if (window.REPORT && window.GRADING) {
                        try {
                            await REPORT.unit('thinking', String(challengeId), {
                                star: GRADING.thinkingStars(1),   // 每關固定 2 星
                                score: 100
                            });
                        } catch (e) {
                            console.error('回報闖關進度失敗', e);
                        }
                    }
                }
            };

            // 依身分載入進度並進入系統（身分來源：闖關基地 SSO）
            const doLogin = async (classRoom, seatNo, name) => {
                if (classRoom && seatNo && name) {
                    setLoading(true);
                    const docId = `${classRoom}_${seatNo}_${name}`;
                    
                    const ok = await initFB();
                    let loadedProgress = [];
                    let loadedDates = {};
                    let loadedImages = {};
                    
                    if (ok) {
                        try {
                            const progressRef = fbStore.doc(fbStore.db, 'artifacts', 'comp-think-app', 'public', 'data', 'progress_sem2', docId);
                            const snap = await fbStore.getDoc(progressRef);
                            if (snap.exists()) {
                                const data = snap.data();
                                loadedProgress = data.completed || [];
                                loadedDates = data.completionDates || {};
                                loadedImages = data.completionImages || {};
                                
                                Object.keys(data).forEach(key => {
                                    if (key.startsWith('completionDates.')) {
                                        const id = key.split('.')[1];
                                        loadedDates[id] = data[key];
                                    }
                                    if (key.startsWith('completionImages.')) {
                                        const id = key.split('.')[1];
                                        loadedImages[id] = data[key];
                                    }
                                });
                            }
                        } catch (err) {
                            console.error("讀取進度失敗:", err);
                        }
                    }

                    setTimeout(() => {
                        setUser({ classRoom, seatNo, name, docId });
                        setCompletedChallenges(loadedProgress);
                        setCompletedDates(loadedDates);
                        setCompletedImages(loadedImages);
                        setStudyTime(0);
                        setLoading(false);
                    }, 800);
                }
            };

            // SSO：掛載時由闖關基地帶入身分自動登入（登出統一在 hub 處理）
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    // 有快取：畫面已經進去了，這裡只在背景補讀雲端進度
                    if (cachedMe) {
                        const ok = await initFB();
                        if (!ok || cancelled) return;
                        await doLogin(cachedMe.cls, cachedMe.no, cachedMe.name);
                        return;
                    }
                    // 沒快取（例如清過瀏覽器資料）：才走完整的名冊查詢
                    setLoading(true);
                    const ok = await initFB();
                    if (!ok) { setLoading(false); return; }
                    const me = await SSO.resolve(async (sid) => {
                        const snap = await fbStore.getDoc(fbStore.doc(fbStore.db, SSO.ROSTER, sid));
                        return snap.exists() ? snap.data() : null;
                    });
                    if (cancelled) return;
                    if (!me) { setLoading(false); return; }   // resolve 失敗時已自行導回 hub
                    await doLogin(me.cls, me.no, me.name);
                })();
                return () => { cancelled = true; };
            }, []);

            const handleOpenChallenge = (challenge) => {
                setSelectedChallenge(challenge);
                const width = 1024;
                const height = 768;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                
                window.open(
                    challenge.url,
                    `Challenge_${challenge.id}`,
                    `width=${width},height=${height},top=${top},left=${left},toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes`
                );
            };

            if (!user) {
                // SSO：身分由闖關基地帶入，本頁不再提供登入表單
                return (
                    <div className="min-h-full bg-gradient-to-br from-blue-100 to-green-200 flex items-center justify-center p-4 font-sans relative">
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden z-10 text-center">
                            <div className="bg-green-600 p-6">
                                <Icons.Monitor className="w-12 h-12 text-white mx-auto mb-2" />
                                <h1 className="text-2xl font-bold text-white">運算思維挑戰平台</h1>
                            </div>
                            <div className="p-10">
                                <p className="text-slate-600 font-medium">
                                    {loading ? '正在從闖關基地確認身分…' : '無法確認身分，請回闖關基地重新登入。'}
                                </p>
                                {!loading && (
                                    <a href="hub.html"
                                       className="inline-block mt-6 px-6 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white font-bold transition">
                                        回闖關基地
                                    </a>
                                )}
                            </div>
                        </div>
                        <div className="absolute bottom-6 w-full text-center text-sm text-green-800/60 font-medium tracking-widest">
                            一一五學年度下學期八年級
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-full bg-slate-100 flex flex-col font-sans relative">
                    {showCertModal && <CertVerificationModal onClose={() => setShowCertModal(false)} user={user} challenge={selectedChallenge} studyTime={studyTime} onComplete={handleChallengeComplete} />}
                    
                    {showMyCertsModal && <MyCertificatesModal onClose={() => setShowMyCertsModal(false)} user={user} completedChallenges={completedChallenges} completedDates={completedDates} completedImages={completedImages} challenges={challenges} />}
                    
                    {showQueryModal && <QueryModal onClose={() => setShowQueryModal(false)} userClass={user.classRoom} />}

                    <header className="bg-white shadow-sm z-10 shrink-0">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                                <div className="bg-green-600 p-2 rounded-lg"><Icons.Award className="w-6 h-6 text-white" /></div>
                                <span className="text-xl font-bold text-slate-800 hidden sm:block">運算思維挑戰</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowQueryModal(true)} className="text-green-600 hover:text-green-800 transition-colors flex items-center text-sm font-medium px-4 py-2 rounded-md hover:bg-green-50">
                                    <i className="fa-solid fa-users mr-2"></i>班級進度
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col lg:flex-row gap-6 overflow-hidden">
                        <aside className="w-full lg:w-1/3 xl:w-1/4 flex flex-col gap-4 h-full">
                            <div className="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col h-full border border-slate-200">
                                <div className="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
                                    <h2 className="font-bold text-slate-700 flex items-center">
                                        <Icons.BookOpen className="w-5 h-5 mr-2 text-green-500" />挑戰清單
                                    </h2>
                                    <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">共 {challenges.length} 題</span>
                                </div>
                                <div className="overflow-y-auto p-2 space-y-2 flex-1">
                                    {challenges.map((challenge) => (
                                        <button
                                            key={challenge.id}
                                            onClick={() => handleOpenChallenge(challenge)}
                                            className={`w-full text-left p-4 rounded-lg transition-all duration-200 flex items-center justify-between group ${selectedChallenge?.id === challenge.id ? 'bg-green-600 text-white shadow-md' : 'hover:bg-green-50 text-slate-700'}`}
                                        >
                                            <div>
                                                <div className={`font-bold text-lg sm:text-xl ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-slate-800'}`}>
                                                    {challenge.id}. {challenge.title}
                                                    {completedChallenges.includes(challenge.id) && (
                                                        <i className={`fa-solid fa-circle-check ml-2 ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-emerald-500'}`} title="已通關"></i>
                                                    )}
                                                </div>
                                                <div className="text-sm mt-1 flex items-center">
                                                    <span className={`${selectedChallenge?.id === challenge.id ? 'text-green-200' : 'text-slate-400'} mr-1`}>難度:</span>
                                                    <span className={`font-bold text-lg ${selectedChallenge?.id === challenge.id ? 'text-yellow-300' : getDifficultyColor(challenge.difficulty)}`}>{challenge.difficulty}</span>
                                                </div>
                                            </div>
                                            <Icons.Play className={`w-6 h-6 ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-slate-300 group-hover:text-green-400'}`} />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        <section className="flex-1 flex flex-col gap-4 h-full">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 shrink-0">
                                <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div className="flex items-center space-x-4">
                                        <div className="bg-green-100 p-3 rounded-full"><Icons.User className="w-8 h-8 text-green-600" /></div>
                                        <div>
                                            <h2 className="text-2xl font-bold text-slate-800">{user.name}</h2>
                                            <div className="text-slate-500 flex items-center mt-1">
                                                <span className="bg-green-50 text-green-700 px-2 py-0.5 rounded text-sm font-medium mr-2">{user.classRoom} 班</span>
                                                <span className="bg-green-50 text-green-700 px-2 py-0.5 rounded text-sm font-medium mr-2">{user.seatNo} 號</span>
                                                <span className="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-sm font-medium">進度: {completedChallenges.length}/{challenges.length}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                                        <button 
                                            onClick={() => setShowMyCertsModal(true)}
                                            className="w-full sm:w-auto px-5 py-3 rounded-xl font-bold flex items-center justify-center shadow-md transition-all bg-amber-500 hover:bg-amber-600 text-white transform hover:scale-105"
                                        >
                                            <i className="fa-solid fa-trophy text-xl mr-2"></i> 我的證書
                                        </button>
                                        <button 
                                            onClick={() => selectedChallenge ? setShowCertModal(true) : alert("請先在左側選擇挑戰關卡，再製作證書！")} 
                                            className={`w-full sm:w-auto px-5 py-3 rounded-xl font-bold flex items-center justify-center shadow-md transition-all ${
                                                selectedChallenge 
                                                    ? 'bg-gradient-to-r from-green-500 to-purple-600 hover:from-green-600 hover:to-purple-700 text-white transform hover:scale-105' 
                                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                            }`}
                                        >
                                            <i className="fa-solid fa-award text-xl mr-2"></i> 證書製作
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 relative overflow-hidden flex items-center justify-center min-h-[200px]">
                                {selectedChallenge ? (
                                    <div className="text-center text-slate-500 p-8">
                                        <div className="bg-green-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6"><Icons.Monitor className="w-12 h-12 text-green-400" /></div>
                                        <p className="text-lg mb-4">挑戰 <span className="font-bold text-green-600">「{selectedChallenge.title}」</span> 正在執行...</p>
                                        
                                        {/* 統計人數顯示區塊 */}
                                        {classPassCount !== null && (
                                            <div className="inline-flex items-center justify-center space-x-2 bg-emerald-50 text-emerald-700 px-5 py-2 rounded-full text-sm font-medium border border-emerald-200 mb-6 animate-[fadeIn_0.3s_ease-out] shadow-sm">
                                                <i className="fa-solid fa-fire text-emerald-500"></i>
                                                <span>本班已通關：<span className="font-bold text-xl mx-1">{classPassCount}</span> 人</span>
                                            </div>
                                        )}
                                        
                                        <div className="block">
                                            <button onClick={() => handleOpenChallenge(selectedChallenge)} className="px-6 py-2 bg-green-50 text-green-600 hover:bg-green-100 rounded-full font-medium transition-colors text-sm">點此重新開啟視窗</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center text-slate-400">
                                        <Icons.BookOpen className="w-16 h-16 mx-auto mb-4 text-slate-200" />
                                        <div className="text-lg font-medium text-slate-500">請選擇左側挑戰開始學習</div>
                                    </div>
                                )}
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0">
                                <div className="flex items-center space-x-3">
                                    <Icons.Calendar className="w-6 h-6 text-green-500" />
                                    <div>
                                        <div className="text-sm text-slate-500">今天是</div>
                                        <div className="text-lg font-bold text-slate-800">{formatDate(currentDate)}</div>
                                    </div>
                                </div>
                                <div className="h-px w-full sm:h-10 sm:w-px bg-slate-200"></div>
                                <div className="flex items-center space-x-3">
                                    <Icons.Timer className="w-6 h-6 text-orange-500" />
                                    <div className="text-right">
                                        <div className="text-sm text-slate-500 text-left sm:text-right">本次學習時間</div>
                                        <div className="text-2xl font-mono font-bold text-green-600">{formatTime(studyTime)}</div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="bg-white py-3 border-t border-slate-200 shrink-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500 font-medium tracking-widest">
                            一一五學年度下學期八年級
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
