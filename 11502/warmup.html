<main class="max-w-3xl mx-auto px-4 pt-20 sm:pt-8">

<script>
const $  = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STEPS = WARMUP.STEPS;
let at = 0;                 // 現在第幾關
let picked = false;         // 這一關的選擇題答對了沒

/* ── 進度條 ─────────────────────────────────────── */
function drawBar() {
  $('bar').innerHTML = STEPS.map((s, i) =>
    `<div class="flex-1 h-2.5 rounded-full ${
      i < at ? 'bg-emerald-500' : i === at ? 'bg-indigo-500' : 'bg-slate-300'
    }"></div>`).join('') +
    `<span class="text-xs font-black text-slate-500 pl-2 whitespace-nowrap">${
      Math.min(at + 1, STEPS.length)} / ${STEPS.length}</span>`;
}

/* ── 畫一關 ─────────────────────────────────────── */
function draw() {
  const s = STEPS[at];
  picked = !s.pick;         // 沒有選擇題的關（第 5 關）直接算過
  drawBar();

  $('stage').innerHTML = `
  <section class="bg-white rounded-2xl border border-slate-200 shadow-md p-5 sm:p-7 pop">
    <div class="text-3xl mb-1">${s.badge}</div>
    <h2 class="text-xl sm:text-2xl font-black mb-3">${s.title}</h2>
    <p class="text-slate-600 leading-relaxed mb-4">${s.lead}</p>

    ${s.compare ? `<div class="space-y-2 mb-4">${s.compare.map(c => `
      <div class="rounded-xl border-2 px-4 py-3 ${c.bad
        ? 'border-slate-200 bg-slate-50' : 'border-indigo-200 bg-indigo-50'}">
        <div class="text-xs font-black text-slate-400 mb-0.5">${esc(c.who)}</div>
        <div class="text-[15px] leading-relaxed">「${esc(c.say)}」</div>
      </div>`).join('')}</div>` : ''}

    ${s.steps ? `<ol class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 mb-4
        text-sm space-y-1 font-mono text-slate-700">${
        s.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}

    ${s.pick ? `
      <p class="font-black text-slate-700 mb-2">${s.pick.prompt}</p>
      <div id="opts" class="space-y-2 mb-1">${s.pick.options.map((o, i) => `
        <button data-i="${i}" class="opt w-full text-left border-2 border-slate-300 rounded-xl
          px-4 py-3 text-[15px] hover:border-indigo-400 hover:bg-indigo-50 transition">
          ${esc(o.t)}
        </button>`).join('')}</div>
      <div id="pickMsg" class="mb-4"></div>` : ''}

    <!-- 寫作區：選擇題答對之前先鎖著。
         ★ 為什麼要鎖：先做完判斷再動筆，寫出來的東西才有依據；
           兩塊同時打開的話，多數人會跳過上面直接寫下面。 -->
    <div id="writeBox" class="${s.pick ? 'opacity-40 pointer-events-none' : ''} border-t border-slate-200 pt-4">
      <p class="font-black text-slate-700 mb-1">${s.write.prompt}</p>
      <p class="text-xs text-slate-400 mb-2">💡 ${s.write.hint}</p>
      <textarea id="ans" rows="3" placeholder="${esc(s.write.placeholder || '')}"
        class="w-full border-2 border-slate-300 rounded-xl px-3.5 py-2.5 text-[15px]
               focus:border-indigo-500 outline-none"></textarea>
      <div class="flex items-center gap-3 mt-2 flex-wrap">
        <button id="send" class="bg-indigo-600 hover:bg-indigo-700 text-white font-black
          px-6 py-2.5 rounded-xl shadow transition">送出</button>
        <span id="count" class="text-xs text-slate-400"></span>
      </div>
      <div id="writeMsg" class="mt-3"></div>
    </div>
  </section>`;

  if (s.pick) {
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => onPick(+b.dataset.i, b));
  }
  $('ans').oninput = () => {
    $('count').textContent = $('ans').value.replace(/\s/g, '').length + ' 字';
  };
  $('send').onclick = onSend;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── 選擇題 ─────────────────────────────────────── */
function onPick(i, btn) {
  const o = STEPS[at].pick.options[i];
  /* ★ 選錯不鎖死、可以再選。
     鎖死的話學生只會去問旁邊的人答案，而這一關的重點是「想一遍」，
     不是「一次答對」。 */
  document.querySelectorAll('.opt').forEach(b => {
    b.className = b.className.replace(/border-(emerald|rose|indigo)-\d+/g, 'border-slate-300');
  });
  btn.className = btn.className.replace('border-slate-300',
    o.ok ? 'border-emerald-500 bg-emerald-50' : 'border-rose-400 bg-rose-50');

  $('pickMsg').innerHTML = `<div class="text-sm rounded-xl px-4 py-3 mt-2 leading-relaxed ${
    o.ok ? 'bg-emerald-50 text-emerald-900 border border-emerald-200'
         : 'bg-amber-50 text-amber-900 border border-amber-200'}">
    ${o.ok ? '✅ ' : '💭 '}${esc(o.msg)}</div>`;

  if (o.ok && !picked) {
    picked = true;
    const w = $('writeBox');
    w.className = w.className.replace('opacity-40 pointer-events-none', '');
    w.classList.add('pop');
  }
}

/* ── 寫作判定 ───────────────────────────────────── */
/* ★ 學生每一關寫了什麼，記在這裡，最後一起存。
   ⚠️ 為什麼要存：規則判定擋得住「太短、空話、抄題目、一次問兩件、
      指不出位置」，但擋不住**關鍵詞堆砌**（每個詞都對、合起來不是人話）。
      要不要為了那種句子接 AI，得先看實際上有多少人這樣寫 ——
      沒有資料就只能用猜的，而猜錯的成本是「全班卡在整站的入口」。
   ⚠️ 只留最後一次通過的那一句，而且上限 300 字。
      這是課後回頭看的樣本，不是聊天紀錄。 */
const said = {};

function onSend() {
  const s = STEPS[at];
  const text = $('ans').value;
  const r = s.write.check(text, { source: s.write.source });
  if (r.ok) said[s.id] = String(text || '').trim().slice(0, 300);

  if (!r.ok) {
    /* ⚠️ 不通過的訊息只講「怎麼改」，不講「你錯了」。
       這一頁沒有分數，重寫幾次都沒關係 —— 要讓人願意再改一次。 */
    $('writeMsg').innerHTML =
      `<div class="text-sm bg-amber-50 border border-amber-200 text-amber-900
        rounded-xl px-4 py-3 leading-relaxed shake">✏️ ${esc(r.why)}</div>`;
    $('ans').focus();
    return;
  }

  $('writeMsg').innerHTML =
    `<div class="text-sm bg-emerald-50 border border-emerald-200 text-emerald-900
      rounded-xl px-4 py-3 leading-relaxed pop">
      ✅ ${esc(s.write.ok)}
      <div class="mt-2 pt-2 border-t border-emerald-200 text-emerald-800">
        📌 <b>記住這一條：</b>${s.rule}
      </div>
      <button id="next" class="mt-3 bg-emerald-600 hover:bg-emerald-700 text-white
        font-black px-6 py-2.5 rounded-xl shadow transition">
        ${at < STEPS.length - 1 ? '下一關 →' : '完成訓練 🏅'}
      </button>
    </div>`;
  $('next').onclick = () => {
    /* ★ 最後一關通過之後，先做一次「選 ＋ 對照」再結束。
       前四關都是「看 → 選 → 寫」，第 5 關原本只有「寫」——
       他寫完就走，沒有機會看到「同一件事還有更好的講法」。
       ⚠️ 這一段不擋人：選錯可以再選，對照完直接完成訓練。 */
    if (at === STEPS.length - 1 && s.wrap) { drawWrap(s, text); return; }
    at++;
    if (at < STEPS.length) draw();
    else finish();
  };
}

/* ── 對照環節（只有第 5 關有）───────────────────── */
function drawWrap(s, mine) {
  const w = s.wrap;
  const opts = w.options.map((o, i) => ({ o, i }))
    .sort(() => Math.random() - 0.5);   // ⚠️ 洗牌，不然第二次就變成「背 B」
  $('stage').innerHTML = `
    <div class="bg-white rounded-2xl border border-slate-200 shadow-md p-6 pop">
      <div class="text-xs font-black text-slate-400 mb-1">最後一步 · 對照</div>
      <h3 class="text-lg font-black mb-3">${w.prompt}</h3>
      <div id="wrapOpts" class="space-y-2"></div>
      <div id="wrapOut" class="mt-4"></div>
    </div>`;
  $('wrapOpts').innerHTML = opts.map(({ o, i }) => `
    <button class="wrap-opt w-full text-left px-4 py-3 rounded-xl border-2 border-slate-200
      bg-white hover:border-indigo-300 transition leading-relaxed text-sm" data-i="${i}">
      ${esc(o.t)}
    </button>`).join('');

  let done = false;
  $('wrapOpts').onclick = (e) => {
    const b = e.target.closest('.wrap-opt');
    if (!b || done) return;
    const o = w.options[+b.dataset.i];
    if (!o.ok) {
      /* 選錯不鎖死，但要說出「為什麼不是它」—— 不然他只是隨機再點一個。 */
      b.classList.add('border-rose-300', 'bg-rose-50', 'opacity-70');
      b.disabled = true;
      $('wrapOut').innerHTML =
        `<div class="text-sm bg-amber-50 border border-amber-200 text-amber-900
          rounded-xl px-4 py-3 leading-relaxed">✗ ${esc(o.msg)}</div>`;
      return;
    }
    done = true;
    b.classList.add('border-emerald-400', 'bg-emerald-50');
    $('wrapOpts').querySelectorAll('.wrap-opt').forEach(x => { x.disabled = true; });
    showCompare(s, mine, o);
  };
}

/* 把「他選的好句子」和「他自己寫的」並排，四條規則逐項打勾。
   ★ 差在哪不必別人講 —— 兩句擺在一起自己看得出來。 */
function showCompare(s, mine, best) {
  const rs = WARMUP.ruleCheck(mine, { source: s.write.source });
  $('wrapOut').innerHTML = `
    <div class="text-sm bg-emerald-50 border border-emerald-200 text-emerald-900
      rounded-xl px-4 py-3 leading-relaxed mb-4">✓ ${esc(best.msg)}</div>
    <div class="grid sm:grid-cols-2 gap-3">
      <div class="rounded-xl border-2 border-slate-200 bg-slate-50 p-4">
        <div class="text-xs font-black text-slate-500 mb-1">你剛剛寫的</div>
        <div class="text-sm leading-relaxed">${esc(mine)}</div>
      </div>
      <div class="rounded-xl border-2 border-emerald-200 bg-white p-4">
        <div class="text-xs font-black text-emerald-600 mb-1">你選出來的那一句</div>
        <div class="text-sm leading-relaxed">${esc(best.t)}</div>
      </div>
    </div>
    <div class="mt-4 rounded-xl border border-slate-200 bg-white p-4">
      <div class="text-xs font-black text-slate-500 mb-2">你的句子，四條規則各做到了嗎</div>
      ${rs.map(r => `<div class="text-sm py-0.5 ${r.ok ? 'text-emerald-700' : 'text-slate-400'}">
        ${r.ok ? '✔' : '○'} ${r.n}. ${esc(r.t)}</div>`).join('')}
      <div class="mt-2 pt-2 border-t border-slate-100 text-xs text-slate-500 leading-relaxed">
        沒打勾的那幾條不影響過關 —— 下次求助時記得補上去就好。
      </div>
    </div>
    <div id="coachBox"></div>
    <button id="wrapDone" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white
      font-black px-6 py-3 rounded-xl shadow transition">完成訓練 🏅</button>`;
  $('wrapDone').onclick = () => { at = STEPS.length; finish(); };

  /* ── AI 的一句話回饋（可有可無）───────────────────
     ★ 學生已經通過四條規則了，這一句是錦上添花。
     ⚠️ 失敗、逾時、沒設定 → 什麼都不顯示，畫面完全不受影響。
        這一關是全站唯一「擋住就整站進不去」的地方，
        AI 在這裡不可以有任何一票否決權。 */
  /* ⚠️ 一律寫 window.ASKAI，不要寫裸的 ASKAI ——
     這個坑咬過五次了（fetch、document、sessionStorage、GRADING、ASKAI）。
     真的用瀏覽器開沒問題，但少載一支 js 或換個載入順序就是 ReferenceError，
     而它會把**後面整段畫面**一起帶走。 */
  if (window.ASKAI && window.ASKAI.coach) {
    window.ASKAI.coach(mine, sidOf()).then(tip => {
      if (!tip) return;
      $('coachBox').innerHTML = `
        <div class="mt-3 text-sm bg-indigo-50 border border-indigo-200 text-indigo-900
          rounded-xl px-4 py-3 leading-relaxed">💡 ${esc(tip)}</div>`;
    });
  }
}

function sidOf() {
  try { return sessionStorage.getItem('sid' + window.CONFIG.TERM) || ''; }
  catch (e) { return ''; }
}

/* ── 全部完成 ───────────────────────────────────── */
function finish() {
  at = STEPS.length;
  drawBar();
  $('stage').innerHTML = '';
  $('done').classList.remove('hidden');
  $('rules').innerHTML = WARMUP.RULES.map(r => `
    <div class="bg-white border border-slate-200 rounded-xl px-4 py-3">
      <div class="font-black text-[15px]">${r.icon} ${esc(r.t)}</div>
      <div class="text-xs text-slate-500 mt-1 leading-relaxed">${esc(r.d)}</div>
    </div>`).join('');

  /* ★ 就算存不進去，也要放人走。
     這一頁不是成績，是提醒。因為連線問題把學生擋在關卡外面，
     代價比「下次再跑一遍」大得多。 */
  /* ⚠️ sessionStorage 會丟例外，不是「一定拿得到」的東西：
     跨來源的 iframe、無痕模式、瀏覽器關掉網站資料時，讀寫都會直接 throw。
     這一行如果炸掉，下面的 saveWarmup 就跑不到 ——
     學生五關全做完了，卻什麼都沒存到，下次進來再做一遍。
     ★ 這一頁的每一個「存」都只是省事，沒有一個值得擋住學生。 */
  try { sessionStorage.setItem('warmup' + window.CONFIG.TERM, '1'); }
  catch (e) { console.warn('sessionStorage 不能用，只靠 Firestore 記', e); }
  if (window.saveWarmup) {
    /* ⚠️ 這個 catch 原本把錯誤整個吞掉，只說「可能是網路問題」——
       於是連老師也查不出是哪一種失敗。
       實際最常見的是**權限**，而權限失敗有兩個完全不同的原因：
         ① 學期鎖：11502-progress 要 2027-02-01 之後才開放學生寫
            （現在測試就是這一種，屬於正常行為）
         ② 安全規則還沒發布：測試帳號的例外沒上線
       兩種都不是網路問題，講「網路」只會讓人往錯的方向查。
       ★ 學生看到的仍然是「不影響闖關」那一句 ——
         底下那行小字是給老師看的，不必看懂也不會慌。 */
    window.saveWarmup(said).catch((err) => {
      const code = (err && err.code) || '';
      const deny = code === 'permission-denied';
      $('saveWarn').innerHTML =
        '⚠️ 這次的完成紀錄沒存起來，下次進來可能會再跑一次。<b>不影響闖關。</b>' +
        (deny
          ? '<div class="mt-1 text-[11px] opacity-80">' +
            '（給老師：寫入被安全規則擋下。11502 的進度要 2027-02-01 之後' +
            '學生才寫得進去；現在測試請用測試帳號，並確認 firestore.rules 已重新發布。）</div>'
          : '<div class="mt-1 text-[11px] opacity-80">（給老師：' +
            (code ? '錯誤代碼 ' + code : '連線或伺服器問題') + '）</div>');
      $('saveWarn').classList.remove('hidden');
      console.warn('[warmup] 存進度失敗', code, err);
    });
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

draw();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const app  = initializeApp(window.CONFIG.FIREBASE);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const sid  = sessionStorage.getItem('sid' + window.CONFIG.TERM);

  /* 做完了 → 記在進度裡。
     ★ 為什麼不能只存在瀏覽器
       電腦教室有還原卡，關機就清空，而且學生下一節課可能換一台。
       只存本機的話，每一節課都要重跑一次這五關 —— 那會讓人恨這個功能。
     ★ 為什麼放在 modules.scratch 底下
       安全規則不做欄位白名單（只看 totalStars 沒被調低），
       用 merge 寫、不動 totalStars，規則自然過，不必重新發布規則。 */
  window.saveWarmup = async function (said) {
    if (!sid) throw new Error('沒有學號');
    /* ★ 連學生寫的句子一起存。
       這是「要不要為這一關接 AI」唯一的判斷依據 ——
       規則擋不住關鍵詞堆砌，而那種句子有多少，只能看真的資料。
       ⚠️ 存的是**通過的那一句**（每一關最後一次），不是每一次嘗試。
          全部留下來的話，這一份會變成聊天紀錄，而不是樣本。 */
    await setDoc(doc(db, window.CONFIG.COLLECTIONS.PROGRESS, sid),
      { modules: { scratch: {
        warmup: true,
        warmupSaid: said || {},
        warmupAt: new Date().toISOString().slice(0, 16)
      } } }, { merge: true });
  };

  AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
</script>
</body>
