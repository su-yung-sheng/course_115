<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino 智慧專題｜資訊科技 115-2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html, body, button, input, select, textarea { font-family:'Noto Sans TC', system-ui, sans-serif; }
  body{
    background-color:#e7e5e4 !important;
    background-image:
      linear-gradient(rgba(120,113,108,.06) 1px,transparent 1px),
      linear-gradient(90deg, rgba(120,113,108,.06) 1px,transparent 1px) !important;
    background-size:26px 26px !important;
  }
  .hl  {background:linear-gradient(transparent 52%, rgba(250,204,21,.65) 52%);font-weight:800}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop{animation:pop .35s ease-out both}
  /* 依設計規範第 5 節：只有「模擬器區塊」保留深色，模擬電子控制台的情境感 */
  .console{background:#0f172a;color:#e2e8f0;border-radius:1rem}
  .led{width:34px;height:34px;border-radius:9999px;background:#1e293b;
       box-shadow:inset 0 0 0 2px #334155;transition:all .2s}
  .led.on{background:#fde047;box-shadow:0 0 18px 4px rgba(253,224,71,.55), inset 0 0 0 2px #facc15}
  .fan{width:44px;height:44px;transition:transform .1s linear}
  .fan.spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 五節課的步驟列。⚠️ 換行不橫捲 —— 捲的版本在窄螢幕會把最後一節切掉一半，
     而學生不會知道右邊還有東西（和 level.html 踩過的是同一個坑）。 */
  .lessons{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid #e2e8f0;
           border-radius:16px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .lsn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
       font-size:13px;font-weight:800;border:2px solid transparent;white-space:nowrap;cursor:pointer}
  @media (max-width:520px){ .lsn{padding:6px 9px;font-size:12px;gap:4px} }
  .lsn-now {background:#4f46e5;color:#fff}
  .lsn-done{background:#ecfdf5;color:#047857;border-color:#6ee7b7}
  .lsn-todo{background:#fff;color:#94a3b8;border-color:#e2e8f0}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px 16px}
  .pick{border:2px solid #e2e8f0;background:#fff;border-radius:12px;padding:10px 13px;
        font-size:13.5px;font-weight:700;color:#334155;cursor:pointer;text-align:left;line-height:1.6}
  .pick:hover{border-color:#6366f1;background:#eef2ff}
  .pick.on{border-color:#6366f1;background:#e0e7ff;color:#3730a3}
  .pick.no{border-color:#fca5a5;background:#fee2e2;color:#991b1b}
  .say{font-size:13.5px;line-height:1.85;padding:10px 13px;border-radius:10px;margin-top:10px;min-height:46px}
  .say.good{background:#dcfce7;color:#166534}
  .say.bad{background:#fee2e2;color:#991b1b}
  .say.info{background:#eef2ff;color:#3730a3}
</style>
</head>

<body class="text-slate-800 min-h-screen pb-24">

<a id="back-to-hub" href="hub.html" title="返回闖關基地"
   class="fixed top-4 left-4 z-50 inline-flex items-center gap-1.5 bg-slate-800 text-white
          font-bold text-sm px-3.5 py-2 rounded-full shadow-lg hover:bg-slate-700 transition">← 返回基地</a>

<main class="max-w-4xl mx-auto px-4 pt-20 sm:pt-8">
  <header class="mb-4">
    <span class="inline-block text-xs font-bold px-2.5 py-1 rounded-full border
                 border-indigo-300 bg-indigo-50 text-indigo-700 mb-3">💡 延伸挑戰</span>
    <h1 class="text-2xl sm:text-3xl font-black">Arduino 智慧專題</h1>
    <p class="text-slate-600 leading-relaxed mt-2">
      五節課，做出<span class="hl">一件解決你自己看到的問題</span>的作品。
      <br>這裡<b>不規定你要用哪個零件</b> —— 先想清楚要解決什麼，再回頭挑工具。
    </p>
  </header>

  <div class="lessons mb-5" id="lessons"></div>

  <section id="app"></section>
</main>

<script>
/* =====================================================================
   Arduino 智慧專題（11502 延伸挑戰）
   ---------------------------------------------------------------------
   ★ 和 11501「智慧家居」的差別
     11501 是五節**照著做**的微課程：每一節給定元件與接法，跟著完成。
     這一份是五節**PBL**：學生自己找問題、自己選元件、最後做出
     一件別人沒有的作品。上學期練的是「做得出來」，這學期是「想得出來」。

   ⚠️ 刻意**不指定硬體**。
      原因有兩個：
        ① 器材數量不一定夠，指定硬體等於先淘汰一部分學生
        ② PBL 的重點是「為了解決這個問題，我需要什麼」——
           先給零件清單，就變成「這些零件可以做什麼」，方向剛好相反
      ⇒ 元件在這裡是**選單**，學生依自己的問題挑；
        接線與型號留到真的要做實體時再查。

   ★ 五節課的骨架（Gold Standard PBL 的縮小版）
       1 找問題　　生活裡什麼東西「該自己動」
       2 拆解　　　感測 → 判斷 → 驅動（就是 Scratch 的如果…那麼）
       3 選元件　　依照你要偵測／要做的事，挑得出對應的元件
       4 做原型　　在模擬器上接起來、設規則、跑測試情境
       5 發表　　　作品卡 ＋ 互評 ＋ 改良
     ⚠️ 前三節都沒有碰硬體 —— 那是刻意的。
        太早進實作，學生會忙著接線，而「要解決什麼」從頭到尾沒想過。

   ★ 作品有兩種交法（老師 2026-08-12 決定）
       模擬器上的作品 ＋ 設計說明　→ 全班都交得出來
       有器材的組再做實體 ＋ 影片　→ 和程式設計那邊同一個上傳流程
     ⇒ 第 5 節的作品卡兩種都收。

   ⚠️ 這一支目前是**單機**的：學生的選擇存在頁面裡，重整就沒了。
      要存進 Firestore 的話，接法和 level.html 的 saveNote／saveStep 一樣
      （modules.arduino），但那要等這五節的內容定稿再做 ——
      現在先把教學結構做對。
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let at = 0;                       // 現在第幾節
const done = {};                  // 哪幾節做完了
const work = {                    // 學生一路累積下來的東西 —— 第 5 節的作品卡要用
  problem: null,                  // 第 1 節：選定的問題
  sense: null, cond: null, act: null,   // 第 2 節：三格拆解
  parts: [],                      // 第 3 節：挑的元件
  rule: { on: 40, dir: 'lt' },    // 第 4 節：規則
  tested: {},                     // 第 4 節：跑過哪些測試情境
  note: ''                        // 第 5 節：設計說明
};

const LESSONS = [
  { n:1, icon:'🔍', name:'找問題' },
  { n:2, icon:'🧩', name:'拆解' },
  { n:3, icon:'🔧', name:'選元件' },
  { n:4, icon:'🛠️', name:'做原型' },
  { n:5, icon:'🏆', name:'發表' }
];

/* ── 第 1 節：問題庫 ────────────────────────────────
   ★ 每一個都是學生真的看得到的場景（教室、走廊、家裡、書包）。
   ⚠️ 三個欄位是關鍵：
        ok    這個問題「感測得到、也做得動」嗎
        why   不行的話，卡在哪一步
      ⇒ 學生要學會的不是「選對」，是**判斷一個問題做不做得出來**。
        所以做不到的那幾個要留著，而且要解釋清楚。 */
const PROBLEMS = [
  { id:'p1', t:'走廊晚上沒人卻整晚亮著', ok:true,
    why:'有沒有人「偵測得到」（紅外線、超音波），燈也「控制得動」。' },
  { id:'p2', t:'教室太悶，沒人記得開窗', ok:true,
    why:'悶不悶可以用溫度或二氧化碳量，開窗可以用馬達推。' },
  { id:'p3', t:'書包忘了帶課本', ok:false,
    why:'⚠️ 卡在**感測**：機器沒辦法知道書包裡那本是不是課本。' +
        '除非每本書都貼標籤 —— 那問題就變成另一個了。' },
  { id:'p4', t:'水壺沒水了不知道', ok:true,
    why:'水位偵測得到（浮球、重量），提醒可以用燈或蜂鳴器。' },
  { id:'p5', t:'同學上課愛講話', ok:false,
    why:'⚠️ 聲音雖然偵測得到，但機器分不出「討論」和「講話」——' +
        '而且這是人的問題，不該用機器管。' },
  { id:'p6', t:'植物忘記澆水枯掉', ok:true,
    why:'土壤濕度偵測得到，澆水可以用小水泵。' }
];

/* ── 第 3 節：元件卡（不綁型號）──────────────────────
   ⚠️ 用「它能感覺到什麼」分類，不是用型號。
      學生要挑的是「我需要偵測什麼」，不是「HC-SR04 是什麼」。
      真的要做實體時再查型號 —— 那是查得到的，判斷不是。 */
const PARTS = {
  sense: [
    { id:'s-light', t:'光線感測器', can:['亮','暗','天黑'] },
    { id:'s-temp',  t:'溫度感測器', can:['熱','冷','溫度'] },
    { id:'s-dist',  t:'距離感測器', can:['靠近','有人','距離'] },
    { id:'s-sound', t:'聲音感測器', can:['吵','聲音','拍手'] },
    { id:'s-water', t:'濕度／水位感測器', can:['乾','濕','沒水','土壤'] },
    { id:'s-btn',   t:'按鈕／開關', can:['按下','手動'] }
  ],
  act: [
    { id:'a-led',   t:'燈（LED／燈條）', can:['亮','照明','提醒'] },
    { id:'a-buzz',  t:'蜂鳴器', can:['響','提醒','警告'] },
    { id:'a-motor', t:'馬達', can:['轉','吹','推','開'] },
    { id:'a-servo', t:'伺服馬達', can:['轉到角度','開門','擺動'] },
    { id:'a-pump',  t:'小水泵', can:['澆水','抽水'] },
    { id:'a-screen',t:'顯示器', can:['顯示','看數字'] }
  ]
};

/* ── 第 4 節：測試情境 ──────────────────────────────
   ★ 原型不是「會動就好」，是「該動的時候動、不該動的時候不動」。
   ⚠️ 所以一定要有 want:false 的情境 ——
      只測「該動的時候動不動」，門檻設 0 也會過。 */
const CASES = [
  { id:'c1', t:'白天、旁邊沒人', v:80, want:false },
  { id:'c2', t:'晚上、有人經過', v:15, want:true  },
  { id:'c3', t:'傍晚、光線剛好在門檻附近', v:40, want:null }   // null＝由學生的門檻決定，不判定
];

/* ===================== 畫面 ===================== */
function drawLessons(){
  $('lessons').innerHTML = LESSONS.map((L,i) =>
    `<button class="lsn ${i===at?'lsn-now':(done[L.n]?'lsn-done':'lsn-todo')}" data-go="${i}">
       <span>${L.icon}</span><span>${L.n}. ${L.name}</span></button>`).join('');
  $('lessons').querySelectorAll('[data-go]').forEach(b => {
    /* ⚠️ 五節都點得進去，不鎖。
       PBL 本來就會來回跑 —— 學生做到第 4 節發現問題不對，
       要回得去第 1 節改。鎖住的話他只能重開一次。 */
    b.onclick = () => { at = Number(b.dataset.go); render(); window.scrollTo({top:0,behavior:'smooth'}); };
  });
}

function say(kind, msg){
  const el = $('say');
  if (!el) return;
  el.className = 'say ' + kind;
  el.innerHTML = msg;
}

function nextBtn(label){
  return `<button id="go-next"
     class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl px-5 py-2.5 transition">
     ${label} →</button>`;
}

function render(){
  drawLessons();
  const n = LESSONS[at].n;
  if (n === 1) return step1();
  if (n === 2) return step2();
  if (n === 3) return step3();
  if (n === 4) return step4();
  return step5();
}

function advance(){
  done[LESSONS[at].n] = true;
  if (at < LESSONS.length - 1) at++;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── 第 1 節　找問題 ──────────────────────────────── */
function step1(){
  $('app').innerHTML = `
    <div class="card pop">
      <h2 class="text-xl font-black mb-1">🔍 第 1 節　生活裡，什麼東西「該自己動」？</h2>
      <p class="text-sm text-slate-600 leading-relaxed mb-4">
        專題不是從零件開始，是從<span class="hl">你覺得麻煩的一件事</span>開始。
        下面六個是別人提過的問題 —— 挑一個你也有同感的。
        <br>⚠️ 但不是每個問題機器都做得到。挑錯了我會告訴你卡在哪。
      </p>
      <div class="grid sm:grid-cols-2 gap-2" id="p-grid">
        ${PROBLEMS.map(p => `<button class="pick" data-p="${p.id}">${esc(p.t)}</button>`).join('')}
      </div>
      <div class="say info" id="say">先挑一個。</div>
      <div id="p-next"></div>
    </div>`;
  $('p-grid').querySelectorAll('[data-p]').forEach(b => {
    b.onclick = () => {
      const p = PROBLEMS.filter(x => x.id === b.dataset.p)[0];
      $('p-grid').querySelectorAll('.pick').forEach(x => x.classList.remove('on','no'));
      b.classList.add(p.ok ? 'on' : 'no');
      if (p.ok){
        work.problem = p;
        say('good', '✔ 這個做得到 —— ' + p.why + '<br>下一節把它拆成機器聽得懂的三步。');
        $('p-next').innerHTML = nextBtn('就選這個，開始拆解');
        $('go-next').onclick = advance;
      } else {
        work.problem = null;
        say('bad', p.why + '<br>換一個 —— 或者把它<b>改寫成做得到的樣子</b>。');
        $('p-next').innerHTML = '';
      }
    };
  });
}

/* ── 第 2 節　拆解 ────────────────────────────────── */
function step2(){
  if (!work.problem){ atNeed(1, '先回第 1 節挑一個問題。'); return; }
  $('app').innerHTML = `
    <div class="card pop">
      <h2 class="text-xl font-black mb-1">🧩 第 2 節　拆成三步</h2>
      <p class="text-sm text-slate-600 leading-relaxed mb-3">
        你選的問題是：<b>${esc(work.problem.t)}</b>
        <br>不管做什麼專題，機器做的事永遠是這三步 ——
        <span class="hl">感測 → 判斷 → 驅動</span>。
        這就是 Scratch 的「如果…那麼」，只是把偵測積木換成真的感測器。
      </p>
      <div class="grid sm:grid-cols-3 gap-3">
        <label class="block"><span class="text-xs font-bold text-slate-500">① 要偵測什麼</span>
          <input id="f-sense" class="w-full mt-1 p-2.5 border-2 border-slate-200 rounded-xl text-sm"
                 placeholder="例：走廊亮不亮、有沒有人" value="${esc(work.sense||'')}"></label>
        <label class="block"><span class="text-xs font-bold text-slate-500">② 條件是什麼</span>
          <input id="f-cond" class="w-full mt-1 p-2.5 border-2 border-slate-200 rounded-xl text-sm"
                 placeholder="例：很暗 而且 有人經過" value="${esc(work.cond||'')}"></label>
        <label class="block"><span class="text-xs font-bold text-slate-500">③ 那麼要做什麼</span>
          <input id="f-act" class="w-full mt-1 p-2.5 border-2 border-slate-200 rounded-xl text-sm"
                 placeholder="例：把燈打開" value="${esc(work.act||'')}"></label>
      </div>
      <div class="console mt-4 p-4 text-sm leading-loose" id="f-preview"></div>
      <div class="say info" id="say">三格都填了才看得出來像不像一句程式。</div>
      <div id="f-next"></div>
    </div>`;
  const upd = () => {
    work.sense = $('f-sense').value.trim();
    work.cond  = $('f-cond').value.trim();
    work.act   = $('f-act').value.trim();
    $('f-preview').innerHTML =
      '<span class="text-indigo-300 font-bold">一直重複</span><br>' +
      '　<span class="text-sky-300 font-bold">量一下</span> ' +
      (esc(work.sense) || '<span class="text-slate-500">（要偵測什麼）</span>') + '<br>' +
      '　<span class="text-indigo-300 font-bold">如果</span> ' +
      (esc(work.cond) || '<span class="text-slate-500">（條件）</span>') +
      ' <span class="text-indigo-300 font-bold">那麼</span><br>' +
      '　　<span class="text-emerald-300">' +
      (esc(work.act) || '<span class="text-slate-500">（要做什麼）</span>') + '</span>';
    /* ⚠️ 只檢查「三格都寫了」，不去判斷寫得好不好 ——
       這一步是把想法變成句子，不是考作文。
       寫得對不對，第 4 節跑測試的時候他自己會發現。 */
    const full = work.sense && work.cond && work.act;
    if (full){
      say('good', '✔ 這就是你的專題的核心。' +
                  '<br>⚠️ 注意②：條件裡如果有「而且」「或」，等一下設規則時要想清楚是哪一個。');
      $('f-next').innerHTML = nextBtn('去挑元件');
      $('go-next').onclick = advance;
    } else {
      say('info', '三格都填了才看得出來像不像一句程式。');
      $('f-next').innerHTML = '';
    }
  };
  ['f-sense','f-cond','f-act'].forEach(id => $(id).addEventListener('input', upd));
  upd();
}

/* ── 第 3 節　選元件 ──────────────────────────────── */
function step3(){
  if (!work.sense){ atNeed(2, '先回第 2 節把三步寫出來。'); return; }
  const box = (list, key) => list.map(p =>
    `<button class="pick" data-part="${p.id}" data-k="${key}">${esc(p.t)}
       <span class="block text-xs font-normal text-slate-400">感覺得到：${p.can.join('、')}</span></button>`).join('');
  $('app').innerHTML = `
    <div class="card pop">
      <h2 class="text-xl font-black mb-1">🔧 第 3 節　挑工具</h2>
      <p class="text-sm text-slate-600 leading-relaxed mb-3">
        你要偵測的是：<b>${esc(work.sense)}</b>，要做的是：<b>${esc(work.act)}</b>
        <br>⚠️ 這裡<b>不給型號</b>。先挑「它能感覺到什麼／能做什麼」——
        真的要接線時再查是哪一顆，那查得到；<span class="hl">判斷不行</span>。
      </p>
      <h3 class="font-black text-sm text-slate-500 mt-3 mb-1">📥 感測器（機器的五官）</h3>
      <div class="grid sm:grid-cols-3 gap-2">${box(PARTS.sense,'sense')}</div>
      <h3 class="font-black text-sm text-slate-500 mt-4 mb-1">📤 致動器（機器的手腳）</h3>
      <div class="grid sm:grid-cols-3 gap-2">${box(PARTS.act,'act')}</div>
      <div class="say info" id="say">感測器和致動器<b>各至少挑一個</b>。</div>
      <div id="k-next"></div>
    </div>`;
  const sel = { sense:[], act:[] };
  $('app').querySelectorAll('[data-part]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k, id = b.dataset.part;
      const i = sel[k].indexOf(id);
      if (i >= 0) { sel[k].splice(i,1); b.classList.remove('on'); }
      else { sel[k].push(id); b.classList.add('on'); }
      const okS = sel.sense.length > 0, okA = sel.act.length > 0;
      if (okS && okA){
        work.parts = sel.sense.concat(sel.act);
        say('good', '✔ 挑好了。<br>⚠️ 想一想：你挑的感測器<b>真的感覺得到</b>你要偵測的東西嗎？' +
                    '感覺不到的話，第 4 節做出來會怪怪的 —— 那時候回來換也可以。');
        $('k-next').innerHTML = nextBtn('去做原型');
        $('go-next').onclick = advance;
      } else {
        say('info', okS ? '還差一個致動器（機器要做什麼）。'
                        : '還差一個感測器（機器要靠什麼知道）。');
        $('k-next').innerHTML = '';
      }
    };
  });
}

/* ── 第 4 節　做原型 ──────────────────────────────── */
function step4(){
  if (!work.parts.length){ atNeed(3, '先回第 3 節挑元件。'); return; }
  $('app').innerHTML = `
    <div class="card pop">
      <h2 class="text-xl font-black mb-1">🛠️ 第 4 節　做出來，然後<b>試著弄壞它</b></h2>
      <p class="text-sm text-slate-600 leading-relaxed mb-3">
        設好門檻，再跑三個情境。
        <span class="hl">「會動」不算成功，「該動的時候動、不該動的時候不動」才算。</span>
      </p>
      <div class="console p-4">
        <div class="flex items-center justify-between mb-3">
          <span class="font-bold text-sm">📥 感測到的數值</span>
          <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300
                       border border-indigo-500/40">自動模式</span>
        </div>
        <input id="v" type="range" min="0" max="100" value="50" class="w-full">
        <div class="flex justify-between text-xs text-slate-400 mt-1">
          <span>0</span><span id="v-val" class="text-lg font-bold text-yellow-300">50</span><span>100</span>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700 text-sm">
          <span class="text-indigo-300 font-bold">如果</span> 數值
          <select id="dir" class="bg-slate-800 border border-slate-600 rounded px-2 py-0.5">
            <option value="lt">小於</option><option value="gt">大於</option>
          </select>
          <input id="on" type="number" value="40" min="0" max="100"
                 class="w-16 bg-slate-800 border border-slate-600 rounded px-2 py-0.5 text-center text-yellow-300">
          <span class="text-indigo-300 font-bold">那麼</span>
          <span class="text-emerald-300">${esc(work.act || '動作')}</span>
        </div>
        <div class="mt-4 flex items-center gap-3">
          <div class="led" id="led"></div>
          <span id="led-txt" class="text-sm font-bold text-slate-400">沒有動作</span>
        </div>
      </div>
      <h3 class="font-black text-sm text-slate-500 mt-4 mb-1">🧪 三個測試情境</h3>
      <div class="grid sm:grid-cols-3 gap-2" id="cases"></div>
      <div class="say info" id="say">把滑桿拉到情境說的數值，看看動作對不對。</div>
      <div id="t-next"></div>
    </div>`;
  const upd = () => {
    const v = Number($('v').value), on = Number($('on').value), dir = $('dir').value;
    work.rule = { on: on, dir: dir };
    $('v-val').textContent = v;
    const fire = dir === 'lt' ? (v < on) : (v > on);
    $('led').classList.toggle('on', fire);
    $('led-txt').textContent = fire ? (work.act || '動作') + '　（動了）' : '沒有動作';
    /* 對照三個情境：只有拉到那個數值附近才算「測過」 */
    CASES.forEach(c => {
      if (Math.abs(v - c.v) > 3) return;
      if (c.want === null){ work.tested[c.id] = 'seen'; return; }
      work.tested[c.id] = (fire === c.want) ? 'pass' : 'fail';
    });
    drawCases();
  };
  const drawCases = () => {
    $('cases').innerHTML = CASES.map(c => {
      const st = work.tested[c.id];
      const cls = st === 'pass' ? 'border-emerald-300 bg-emerald-50'
                : st === 'fail' ? 'border-rose-300 bg-rose-50'
                : st === 'seen' ? 'border-amber-300 bg-amber-50' : 'border-slate-200 bg-white';
      const tag = st === 'pass' ? '✅ 對了' : st === 'fail' ? '❌ 不對' :
                  st === 'seen' ? '🤔 你自己決定' : '尚未測試';
      return `<div class="border-2 rounded-xl p-3 ${cls}">
        <div class="text-sm font-bold">${esc(c.t)}</div>
        <div class="text-xs text-slate-500 mt-1">把滑桿拉到 <b>${c.v}</b> 左右</div>
        <div class="text-xs font-bold mt-2">${tag}</div>
        <div class="text-xs text-slate-500 mt-1">${
          c.want === true ? '這時候<b>應該要</b>動' :
          c.want === false ? '這時候<b>不應該</b>動' :
          '剛好在門檻附近 —— 動或不動都可以，但你要說得出為什麼'}</div>
      </div>`;
    }).join('');
    const pass = CASES.filter(c => c.want !== null).every(c => work.tested[c.id] === 'pass');
    const seen = work.tested['c3'];
    if (pass && seen){
      say('good', '✔ 該動的時候動、不該動的時候不動 —— 這才叫做完成。' +
                  '<br>⚠️ 第三個情境沒有標準答案：門檻設在哪裡是<b>你的設計決定</b>，' +
                  '第 5 節要說得出理由。');
      $('t-next').innerHTML = nextBtn('去寫作品卡');
      $('go-next').onclick = advance;
    } else if (Object.values(work.tested).indexOf('fail') >= 0){
      say('bad', '有一個情境的結果不對 —— 調門檻或換方向（小於／大於），再試一次。');
      $('t-next').innerHTML = '';
    } else {
      say('info', '三個情境都要拉過去看一次。');
      $('t-next').innerHTML = '';
    }
  };
  ['v','on','dir'].forEach(id => $(id).addEventListener('input', upd));
  upd();
}

/* ── 第 5 節　發表 ────────────────────────────────── */
function step5(){
  const nameOf = id => {
    const all = PARTS.sense.concat(PARTS.act);
    for (let i=0;i<all.length;i++) if (all[i].id === id) return all[i].t;
    return id;
  };
  $('app').innerHTML = `
    <div class="card pop">
      <h2 class="text-xl font-black mb-1">🏆 第 5 節　作品卡</h2>
      <p class="text-sm text-slate-600 leading-relaxed mb-3">
        前四節做的東西，在這裡變成一張別人看得懂的卡片。
        <span class="hl">作品要有人看得懂，才算做完。</span>
      </p>
      <div class="border-2 border-indigo-200 bg-indigo-50/40 rounded-2xl p-4 text-sm leading-loose">
        <div><b>我要解決的問題：</b>${esc((work.problem||{}).t || '（還沒選）')}</div>
        <div><b>機器要偵測：</b>${esc(work.sense || '（還沒寫）')}</div>
        <div><b>條件：</b>${esc(work.cond || '（還沒寫）')}</div>
        <div><b>那麼就：</b>${esc(work.act || '（還沒寫）')}</div>
        <div><b>用到的元件：</b>${work.parts.length ? work.parts.map(nameOf).join('、') : '（還沒挑）'}</div>
        <div><b>我設的門檻：</b>${work.rule.dir === 'lt' ? '小於' : '大於'} ${work.rule.on}</div>
      </div>
      <label class="block mt-4"><span class="text-xs font-bold text-slate-500">
        為什麼門檻設在這裡？測試的時候發現了什麼？（100 字以內）</span>
        <textarea id="note" rows="3" maxlength="100"
          class="w-full mt-1 p-2.5 border-2 border-slate-200 rounded-xl text-sm"
          placeholder="例：一開始設 60，結果白天也會亮。改成 30 之後才正常。">${esc(work.note)}</textarea>
      </label>
      <div class="say info" id="say">寫完就完成了。</div>

      <div class="mt-5 border-t border-slate-200 pt-4">
        <h3 class="font-black text-sm mb-2">📦 交作品（兩種都可以）</h3>
        <ul class="text-sm text-slate-600 leading-relaxed list-disc pl-5">
          <li><b>模擬器版</b>：把這張作品卡截圖交出來 —— 每個人都交得出來。</li>
          <li><b>實體版</b>：有器材的組真的接起來、拍一段影片。
            <span class="text-slate-400">（型號和接線這時候才需要查）</span></li>
        </ul>
        <p class="text-xs text-slate-400 mt-2">
          ⚠️ 這一支目前還沒接上傳 —— 作品先截圖或交給老師。</p>
      </div>
    </div>`;
  const t = $('note');
  const upd = () => {
    work.note = t.value.trim();
    if (work.note.length >= 10){
      done[5] = true;
      say('good', '✔ 作品卡完成了。' +
                  '<br>下一步：找兩個同學看你的卡片，問他們「看得懂我要解決什麼嗎」——' +
                  '看不懂的地方就是要改的地方。');
      drawLessons();
    } else {
      say('info', '至少寫十個字 —— 門檻為什麼設在那裡，那是你的設計決定。');
    }
  };
  t.addEventListener('input', upd);
  upd();
}

/* 前面沒做完就跳過來的時候，講清楚要回哪一節 —— 不要留白畫面 */
function atNeed(n, msg){
  $('app').innerHTML = `<div class="card pop text-center">
    <p class="text-slate-600 leading-relaxed">${msg}</p>
    <button id="go-back" class="mt-3 bg-slate-800 text-white font-bold rounded-xl px-5 py-2.5">
      回第 ${n} 節</button></div>`;
  $('go-back').onclick = () => { at = n - 1; render(); };
}

render();
</script>
</body>
</html>
