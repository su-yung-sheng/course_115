<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body, button, input, select, textarea { font-family:'Noto Sans TC', system-ui, sans-serif; }
  body{
    background-color:#e7e5e4 !important;
    background-image:
      linear-gradient(rgba(120,113,108,.06) 1px,transparent 1px),
      linear-gradient(90deg, rgba(120,113,108,.06) 1px,transparent 1px) !important;
    background-size:26px 26px !important;
  }
  .hl{background:linear-gradient(transparent 52%, rgba(250,204,21,.65) 52%);font-weight:800}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop{animation:pop .35s ease-out both}
  /* 步驟列。
     ★ 改成「換行」而不是「橫向捲」：
       捲動的版本在寬度不夠時，最後一個步驟會被切掉一半 ——
       而學生不會知道右邊還有東西（沒有捲軸提示），
       他看到的只是一個壞掉的畫面。
       換行永遠不會切掉，最多就是排成兩列。
     ⚠️ 手機上再縮小一點字和內距，讓一列塞得下更多個。 */
  .steps{display:flex;flex-wrap:wrap;gap:6px}
  .stp{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
       font-size:13px;font-weight:800;border:2px solid transparent;white-space:nowrap;cursor:pointer}
  @media (max-width:520px){
    .stp{padding:6px 9px;font-size:12px;gap:4px}
  }
  .stp-now {background:#4f46e5;color:#fff}
  .stp-done{background:#ecfdf5;color:#047857;border-color:#6ee7b7}
  .stp-todo{background:#fff;color:#94a3b8;border-color:#e2e8f0;cursor:not-allowed}
  .scene-shot{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .scene-shot > div{flex:1 1 200px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px}
</style>

<body class="text-slate-800 min-h-screen pb-24">

<a href="scratch.html"
   class="fixed top-4 left-4 z-50 inline-flex items-center gap-1.5 bg-slate-800 text-white
          font-bold text-sm px-3.5 py-2 rounded-full shadow-lg hover:bg-slate-700 transition">← 闖關地圖</a>

<!-- ★ 寬度和闖關地圖（scratch.html）一樣，都是 4xl。
     ⚠️ 一度改成 5xl 想讓步驟列放得下，結果內容比標題寬一大截，
        而且從地圖點進來會「跳一下」—— 兩頁不同寬，看起來像兩個網站。
     ⇒ 步驟列改成會換行（見上面的 .steps）就不必靠加寬解決，
        寬度回到和地圖一致。**版面一致比多幾十像素重要。** -->
<main class="max-w-4xl mx-auto px-4 pt-20 sm:pt-8">
  <div id="app"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 這一頁在做哪一關 ─────────────────────────────
   ⚠️ 網址帶得進來，就代表學生改得掉 ——
      所以「這一關開了沒」一定要在**這一頁自己再判一次**。
      只靠上一頁不畫連結，等於沒有鎖。 */
const UNITS = (window.CONFIG.UNITS || []).map((u, i) => ({ no: i + 1, id: u[0], name: u[1] }));
const wantId = new URLSearchParams(location.search).get('unit') || '';
const unit = UNITS.filter(u => u.id === wantId)[0] || null;
const lv = unit ? (window.BLOCK_LEVELS || {})[unit.id] : null;

/* ★ 兩組星星，各自算各自的（和 11501 的流程圖／Scratch 一樣）：
     🧩 作品星 unitStars —— Colab 批改寫入，**依序開放只看它**
     🧠 概念星         —— 由 quizDone 的分數現算，是成就不是通行證
   ⚠️ 概念檢測可以一直重寫到過為止，拿它當鑰匙等於沒有鎖。 */
let unitStars = {};      // 作品星（批改給的）
let quizDone = {};       // { '2-1-1': { score: 4 } }
let preDone = {};        // 思考關卡做完了沒
let at = 0;              // 現在第幾步
let ready = { 1:false, 2:false, 3:false };   // 各步驟完成了沒（步驟 0、4 不必判定）

const GATE = (window.GRADING && window.GRADING.GATE) || null;
function unitOpen(no) {
  return GATE ? GATE.isOpen(no, UNITS, true, null, unitStars) : (no === 1);
}

/* ── 五個步驟 ─────────────────────────────────────
   ★ 為什麼是這五個而不是「拆解 → 拼圖 → 上傳」
     原本的三段沒有名字，學生看不出自己在整件事的哪個位置。
     課本的順序本來就是「先看範例 → 問題分析 → 問題拆解 → 組裝 → 執行」，
     照那個順序命名，學生在課本和網站上看到的是同一件事。

   ⚠️ 有些關卡沒有某一步（例如第 5 關沒有拼圖，課本用的是圖解）——
     沒有資料的步驟直接不出現，不要留一個空殼。 */
function steps() {
  const out = [{ key:'scene', icon:'🎬', name:'情境解說' }];
  /* 抽象概念先用生活裡的東西玩一次，再回來看程式。
     ⚠️ 只有宣告 combo 的關卡有 —— 每一關都放的話它就變成點擊過場。 */
  if (lv && lv.combo && window.COMBO) out.push({ key:'combo', icon:'🍔', name:'套餐工廠' });
  /* ⚠️ 「確認理解」不再是獨立的一步。
     圈選題本來就是某一問的判斷，寫作題本來就是整段的收尾 ——
     搬到另一頁等於把同一件事切成兩半，
     學生還要重新想起「剛剛那一題在問什麼」。
     現在問題分析自己一題一題走完，最後一題就是寫作題。 */
  if (lv && lv.analysis) out.push({ key:'analysis', icon:'🔍', name:'問題分析' });
  if (lv && lv.derive) out.push({ key:'derive', icon:'📐', name:'推導' });
  /* 概念檢測排在程式拼圖**之前**：
     先確定他懂了，再讓他動手拼 —— 反過來的話，拼對了就沒有人會回頭讀。
     ⚠️ 題庫不到 5 題的關卡就不辦（AI 出事時要退得回題庫）。 */
  if (lv && (lv.quiz || []).length >= (window.QUIZ ? window.QUIZ.N_TOTAL : 5)) {
    out.push({ key:'quiz', icon:'🧠', name:'概念檢測' });
  }
  if (lv && lv.goal)   out.push({ key:'blocks', icon:'🧩', name:'程式拼圖' });
  out.push({ key:'test', icon:'🚀', name:'實作測試' });
  return out;
}

/* 這一步做完了沒。沒有判定條件的步驟（情境、推導）看過就算。 */
function stepDone(i) {
  const S = steps();
  if (i >= S.length - 1) return false;             // 最後一步不標完成
  return ready[i] === true || i < at;
}
function canGo(i) { return i <= at || stepDone(i - 1); }

function render() {
  stopHold();               // ⚠️ 見 nextBtn：不清的話計時器會愈疊愈多
  if (!unit) {
    $('app').innerHTML = card('❓ 找不到這一關',
      '網址裡的 <code>unit</code> 不在課程清單裡。回<a class="underline font-bold" href="scratch.html">闖關地圖</a>重選一關。');
    return;
  }
  if (!unitOpen(unit.no)) {
    /* ★ 這一段是拆成兩頁之後最容易破的地方。
       上一頁不畫連結只是「不方便」，這裡才是真的擋。 */
    $('app').innerHTML = card('🔒 這一關還沒開',
      `要先完成<b>第 ${unit.no - 1} 關</b>才會開啟第 ${unit.no} 關。` +
      '<br>回<a class="underline font-bold" href="scratch.html">闖關地圖</a>看看目前該做哪一關。');
    return;
  }

  const S = steps();
  const s = S[at];
  $('app').innerHTML = `
    <header class="mb-4">
      <span class="text-xs font-bold px-2.5 py-1 rounded-full border border-orange-300 bg-orange-50 text-orange-700">
        🐱 第 ${String(unit.no).padStart(2,'0')} 關
      </span>
      <h1 class="text-2xl sm:text-3xl font-black mt-2">${esc(unit.name)}</h1>
    </header>
    <div class="steps mb-5">${S.map((x, i) => `
      <button class="stp ${i === at ? 'stp-now' : stepDone(i) ? 'stp-done' : canGo(i) ? 'stp-done' : 'stp-todo'}"
              data-step="${i}" ${canGo(i) ? '' : 'disabled'}>
        <span>${x.icon}</span><span>${i + 1}. ${x.name}</span>
      </button>`).join('')}</div>
    <section id="body" class="bg-white rounded-2xl border border-slate-200 shadow-md p-5 sm:p-7 pop"></section>
    <div id="foot" class="mt-4"></div>`;

  document.querySelectorAll('[data-step]').forEach(b => {
    b.onclick = () => { if (canGo(+b.dataset.step)) { at = +b.dataset.step; render(); window.scrollTo({top:0,behavior:'smooth'}); } };
  });
  draw(s);
}

function card(title, html) {
  return `<div class="bg-white rounded-2xl border border-slate-200 shadow-md p-7 text-center">
    <h1 class="text-xl font-black mb-2">${title}</h1>
    <p class="text-slate-600 leading-relaxed">${html}</p></div>`;
}

/* ── 純閱讀的步驟要停留久一點 ─────────────────────
   ★ 為什麼要有
     情境解說和問題分析沒有任何判定條件 —— 按一下就過去了。
     結果是：最需要讀的那幾個學生，兩秒就滑到程式拼圖，
     然後在那裡卡住，再回頭問「這題到底要幹嘛」。
     這 30 秒不是懲罰，是**把「讀完」變成一件真的發生過的事**。

   ★ 離開頁面就暫停，不是重來
     學生會被老師叫、會切去看投影、會不小心按到別的視窗。
     重來一次的話，他學到的是「不要離開」，而不是「要讀」——
     而且被罰第二次的通常是最乖的那一個。
     ⇒ 時間只在「這一頁在眼前」的時候才走。想早點過關，就專心讀完。

   ⚠️ 計時器一定要在 render() 裡清掉。
      不清的話，每重畫一次就多一個計時器在跑，
      倒數會愈跳愈快 —— 而且畫面上看不出原因。 */
const HOLD_SEC = 30;
let held = {};          // 這一步的停留時間已經滿了沒
let holdTimer = null;

function stopHold() { if (holdTimer) { clearInterval(holdTimer); holdTimer = null; } }

function nextBtn(label, hold) {
  const step = at;
  const needHold = hold && !held[step];
  $('foot').innerHTML = `<button id="go" ${needHold ? 'disabled' : ''}
    class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white
    font-black text-lg rounded-2xl px-6 py-4 shadow-md transition">${label} →</button>`;

  const btn = $('go');
  btn.onclick = () => {
    if (btn.disabled) return;
    stopHold();
    ready[at] = true; at++; render(); window.scrollTo({top:0,behavior:'smooth'});
  };
  if (!needHold) return;

  let left = HOLD_SEC;
  /* 保險絲：不管發生什麼事，最久 HOLD_SEC × 3 一定解鎖。
     ★ 為什麼需要
       這個倒數是靠 visibilityState 決定要不要扣秒的。
       只要有任何一個瀏覽器（或內嵌瀏覽器、或某個外掛）
       把狀態一直報成非 visible，學生就會**永遠卡在這一步**，
       而且畫面上只會看到「還要 30 秒」停著不動 —— 沒有任何錯誤訊息。
       ⚠️ 實際踩過：jsdom 預設的 visibilityState 是 'prerender'，
          用 document.hidden 判斷的話一秒都不會走。
          瀏覽器不會這樣，但「我以為不會」正是這種 bug 的形狀。
     ⇒ 擋錯人的代價遠大於少讀 30 秒，所以一定要有出口。 */
  const deadline = Date.now() + HOLD_SEC * 3000;
  paint();
  stopHold();
  holdTimer = setInterval(() => {
    /* ★ 分頁不在前面就不扣秒 —— 這就是「不能離開頁面」那條規則的實作。
       ⚠️ 判 visibilityState === 'hidden'，不要判 document.hidden。
          後者是「只要不是 visible 就算躲起來」，包含 prerender 這種
          我們沒預期的狀態；判斷要「明確說躲起來了才停」，
          不是「沒說看得到就停」。 */
    const hidden = document.visibilityState === 'hidden';
    if (hidden && Date.now() < deadline) { paint(true); return; }
    left--;
    if (left > 0) { paint(); return; }
    done();
  }, 1000);

  function done() {
    stopHold();
    held[step] = true;
    btn.disabled = false;
    btn.textContent = label + ' →';
  }

  /* ★ 只顯示秒數，不解釋規則。
     「這一段沒有題目所以請讀 30 秒」那種話，讀起來像在說
     「我知道你不會讀」—— 而且它本身就佔掉了要讀的注意力。
     暫停時只換一個字，學生看得出來狀態變了就夠。 */
  function paint(paused) {
    btn.textContent = paused ? `${label}（暫停）` : `${label}（${left}）`;
  }
}

function draw(s) {
  const body = $('body');
  $('foot').innerHTML = '';

  if (s.key === 'scene') {
    /* 情境解說：先看懂「要做出什麼」，才有東西可以分析。
       ★ 課本的順序就是「先執行範例、看畫面，再進問題分析」——
         少了這一步，學生是在對一段不知道要幹嘛的程式做拆解。 */
    const sc = (lv && lv.scene) || null;
    body.innerHTML = `
      <h2 class="text-xl font-black mb-3">🎬 這一關要做出什麼</h2>
      <p class="text-slate-700 leading-relaxed">${(lv && lv.task) || '（尚未撰寫）'}</p>
      ${sc && sc.why ? `<div class="mt-4 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
        <div class="font-black text-amber-900 text-sm mb-1">💡 為什麼要學這個</div>
        <div class="text-sm text-amber-900 leading-relaxed">${sc.why}</div></div>` : ''}
      ${sc && sc.shots ? `<div class="mt-4">
        <div class="font-black text-sm text-slate-700">按下綠旗之後會看到：</div>
        <div class="scene-shot">${sc.shots.map((t, i) =>
          `<div><div class="text-xs font-black text-slate-400 mb-1">${i + 1}</div>
                <div class="text-sm leading-relaxed">${t}</div></div>`).join('')}</div></div>` : ''}
      ${sc && sc.pre ? `<p class="mt-4 text-xs text-slate-500 leading-relaxed">📚 ${sc.pre}</p>` : ''}`;
    nextBtn('看懂了，開始分析', true);
    return;
  }

  if (s.key === 'combo') {
    /* 速食店的套餐：主餐 ＋ 配餐 ＋ 飲料，主餐裡面還能再拆開。
       ★ 為什麼放在情境和分析中間
         「把重複的那一段包起來」對還沒寫過幾行程式的學生太抽象，
         但套餐他每個人都點過 —— 這一段是把他已經有的直覺搬過來，
         不是教他新東西。 */
    body.innerHTML = '<h2 class="text-xl font-black mb-1">🍔 先玩一個東西：套餐工廠</h2>' +
      '<p class="text-sm text-slate-600 leading-relaxed mb-4">' +
      '等一下要把「畫正方形」包成一塊積木。在那之前，先看看速食店怎麼組套餐。</p>' +
      '<div id="combo-host"></div>';
    window.COMBO.mount($('combo-host'), {
      onDone: () => { ready[at] = true; at++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    /* ⚠️ 這裡不設時間也不給跳過 —— 三關本來就要動手才過得去，
       再加倒數是雙重處罰。 */
    return;
  }

  if (s.key === 'analysis') {
    DERIVE.renderAnalysis(body, lv.analysis, {
      unit: unit.id,
      student: sid(),
      onAsked: (q, a) => { if (window.saveAsk) window.saveAsk(unit.id, q, a); },
      onWrite: t => { if (window.saveNote) window.saveNote(unit.id, t); },
      onDone: () => { ready[at] = true; at++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    /* ⚠️ 這裡**不要**再補一顆按鈕。
       renderAnalysis 自己會畫「想清楚了，開始動手 →」，
       兩邊各畫一顆的話，畫面上會同時出現兩個功能一樣的按鈕，
       學生只會想「這兩個有什麼不同」。 */
    return;
  }

  if (s.key === 'derive') {
    DERIVE.mount(body, lv.derive, {
      onDone: () => { ready[at] = true; at++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    return;
  }

  if (s.key === 'quiz') {
    const prev = quizDone[unit.id];
    /* 考過了就不必再考一次 —— 但要讓他看得到「上限幾星」，
       而且要留一顆重考鍵：拿 2 星上限的人應該有機會回頭拿 3 星。 */
    if (prev && prev.score >= window.GRADING.QUIZ_PASS) {
      const cap = window.GRADING.quizStars(quizDone, unit.id);
      body.innerHTML = `
        <h2 class="text-xl font-black mb-2">🧠 概念檢測</h2>
        <div class="bg-emerald-50 border-2 border-emerald-200 rounded-xl px-4 py-3 text-emerald-900">
          <div class="font-black text-lg">上次答對 ${prev.score} / ${window.QUIZ.N_TOTAL}</div>
          這一關拿到 <b>🧠 ${cap} 顆概念星</b>${cap < 3
            ? '（五題全講到就是 3 顆，可以再寫一次）' : ''}
        </div>
        <button id="again" class="mt-3 w-full border-2 border-indigo-200 text-indigo-700 font-black
          rounded-xl px-4 py-3">🔁 再考一次</button>`;
      $('again').onclick = () => { quizDone = Object.assign({}, quizDone); delete quizDone[unit.id]; render(); };
      nextBtn('往下做');
      return;
    }
    window.QUIZ.mount(body, lv, {
      unit: unit.id,
      student: sid(),
      /* 沒有題庫就整步跳過 —— 不要讓學生看到一個空的檢測。 */
      onNone: () => { ready[at] = true; at++; render(); },
      onPass: (score) => {
        quizDone = Object.assign({}, quizDone, { [unit.id]: { score: score } });
        if (window.saveQuiz) window.saveQuiz(unit.id, score);
        ready[at] = true; at++; render(); window.scrollTo({top:0,behavior:'smooth'});
      },
      /* ★ 不到門檻就送回情境解說，不是把他丟在原地。
         「回去重讀」要真的帶他回去 —— 不然他只會一直按重考、亂猜到過為止。 */
      onFail: (score) => {
        if (window.saveQuiz) window.saveQuiz(unit.id, score);
        /* ★ 停留時間要重新算一次。
           「回去重讀」如果按一下就滑過去，那和沒有退回是一樣的。 */
        held = {};
        at = 0; render(); window.scrollTo({top:0,behavior:'smooth'});
      }
    });
    return;
  }

  if (s.key === 'blocks') {
    /* ⚠️ BLOCKS.mount 收的是「攤平的選項」，不是整個關卡物件。
       傳 lv 進去的話 palette／goal 都讀不到，畫面會是一個空的拼圖區 ——
       而且不會報錯，只會安靜地沒東西可拼。 */
    BLOCKS.mount(body, {
      palette: lv.palette, goal: lv.goal, alts: lv.alts, loose: lv.loose, hint: lv.task,
      onPass: () => { markPre(); ready[at] = true; at++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    return;
  }

  // 實作測試：共用的自評站
  markPre();
  body.innerHTML = `
    <h2 class="text-xl font-black mb-2">🚀 動手做，然後上傳</h2>
    <p class="text-sm text-slate-600 leading-relaxed mb-4">
      在 Scratch 做出來，「檔案 → 儲存到你的電腦」會得到 <code class="bg-slate-100 px-1 rounded">.sb3</code>，
      上傳給 AI 助教批改。<span class="hl">75 分以上才算通關</span>。
    </p>
    <iframe id="gf" class="w-full block bg-white rounded-xl border border-slate-200"
            style="height:560px;border:0;overflow:hidden" scrolling="no" title="Scratch 作品評分"></iframe>`;
  const f = $('gf');
  const want = '../shared/grader.html?term=' + encodeURIComponent(window.CONFIG.TERM) +
               '&unit=' + encodeURIComponent(unit.id);
  if (f.getAttribute('src') !== want) f.setAttribute('src', want);
}

/* ★ 讀進度之後把星數套進來，並重畫。
   ⚠️ 這個函式一度只有「被呼叫」沒有「被定義」——
      module 那一段照樣跑，只是靜靜地丟一個 ReferenceError 到主控台，
      而畫面上的結果是：**每一關都停在「只開第 1 關」**。
      沒有紅字、沒有錯誤頁，只是永遠開不了第 2 關。
   ⚠️ 重畫時要保留學生走到第幾步（at），不然讀進度回來會把他踢回第 1 步。 */
window.applyProgress = function (stars, pre, quiz) {
  quizDone = quiz || {};
  unitStars = stars || {};
  preDone = pre || {};
  render();
};

function sid() {
  try { return sessionStorage.getItem('sid' + window.CONFIG.TERM) || ''; } catch (e) { return ''; }
}
/* 思考關卡做完 → 記起來，下次不必重做（存失敗不擋人） */
let preSaved = false;
function markPre() {
  if (preSaved) return;
  preSaved = true;
  if (window.savePre) window.savePre(unit.id);
}

render();
</script>

<!-- 讀進度：星數決定「這一關開了沒」 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const app  = initializeApp(window.CONFIG.FIREBASE);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const sid  = sessionStorage.getItem('sid' + window.CONFIG.TERM);

  onAuthStateChanged(auth, async user => {
    if (!user || !sid) return;
    try {
      const snap = await getDoc(doc(db, window.CONFIG.COLLECTIONS.PROGRESS, sid));
      const mods = (snap.exists() && snap.data().modules) || {};
      window.applyProgress((mods.scratch && mods.scratch.unitStars) || {},
                           (mods.scratch && mods.scratch.pre) || {},
                           (mods.scratch && mods.scratch.quiz) || {});
    } catch (e) {
      /* 讀不到就維持「只開第 1 關」。寧可少開，也不要因為連線問題整批放行。 */
      console.error('讀進度失敗', e);
    }
  });

  window.savePre = async function (unitId) {
    if (!sid || !unitId) return;
    try {
      await setDoc(doc(db, window.CONFIG.COLLECTIONS.PROGRESS, sid),
        { modules: { scratch: { pre: { [unitId]: true } } } }, { merge: true });
    } catch (e) { console.warn('思考關卡紀錄沒存成功（不影響闖關）', e); }
  };
  /* 概念檢測的成績。
     ⚠️ 只寫 modules.scratch.quiz，不碰 unitStars ——
        星數只有一個寫入者（Colab 的批改），這裡寫的是「上限的依據」。
        兩個地方都能改星數的話，之後沒有人說得出「到底是誰給的」。 */
  window.saveQuiz = async function (unitId, score) {
    if (!sid || !unitId) return;
    try {
      await setDoc(doc(db, window.CONFIG.COLLECTIONS.PROGRESS, sid),
        { modules: { scratch: { quiz: { [unitId]:
          { score: Number(score) || 0, at: new Date().toISOString().slice(0, 16) } } } } },
        { merge: true });
    } catch (e) { console.warn('概念檢測成績沒存成功（不影響闖關）', e); }
  };
  window.saveNote = async function (unitId, text) {
    if (!sid || !unitId) return;
    try {
      await setDoc(doc(db, window.CONFIG.COLLECTIONS.PROGRESS, sid),
        { modules: { scratch: { notes: { [unitId]: String(text || '').slice(0, 500) } } } }, { merge: true });
    } catch (e) { console.warn('想法沒存成功（不影響闖關）', e); }
  };
  window.saveAsk = async function (unitId, q, a) {
    if (!sid || !unitId) return;
    try {
      const ref = doc(db, window.CONFIG.COLLECTIONS.PROGRESS, sid);
      const snap = await getDoc(ref);
      const cur = (((snap.exists() && snap.data().modules) || {}).scratch || {}).asks || {};
      const list = (cur[unitId] || []).slice(-4);
      list.push({ q: String(q || '').slice(0, 300), a: String(a || '').slice(0, 300),
                  t: new Date().toISOString().slice(0, 16) });
      await setDoc(ref, { modules: { scratch: { asks: { [unitId]: list } } } }, { merge: true });
    } catch (e) { console.warn('對話沒存成功（不影響闖關）', e); }
  };

  AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
</script>
</body>
