        .glass-panel{

            border-radius:1rem;
            box-shadow:0 1px 2px rgba(0,0,0,.05);

        .game-btn{
            border:2px solid #a21caf;
            border-bottom-width:4px;
            transition:all .1s ease-in-out;
        }
        .game-btn:active:not(:disabled){ border-bottom-width:2px; transform:translateY(2px); }
        .game-btn:disabled{ filter:grayscale(100%); opacity:.5; cursor:not-allowed; }

        /* 選項卡（技能／藥水） */
        input[type="radio"]{ display:none; }
        input[type="radio"] + div{
            border:2px solid #e2e8f0;
            background:#f8fafc;
            color:#334155;
            transition:all .2s;
        }
        input[type="radio"]:checked + div{
            background:#fdf4ff;                 /* fuchsia-50 */
            border-color:#e879f9;               /* fuchsia-400 */
            color:#86198f;                      /* fuchsia-800 */
            box-shadow:0 0 0 3px rgba(232,121,249,.25);
            transform:scale(1.03);
        }
        input[type="radio"]:disabled + div{ opacity:.5; cursor:not-allowed; }

        /* 滑桿 */
        input[type=range]{
            -webkit-appearance:none; background:#e2e8f0;
            border:1px solid #cbd5e1; height:10px; border-radius:6px; outline:none;
        }
        input[type=range]::-webkit-slider-thumb{
            -webkit-appearance:none; width:20px; height:20px;
            background:#d946ef; border:2px solid #fff; border-radius:50%;
            cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.25);

        /* 長條圖：資料視覺化主體 */
        .bar{

            border:1px solid rgba(0,0,0,.08);
            border-bottom:none; border-radius:4px 4px 0 0;

        /* 舞台地板 */

        /* 手動排序方塊 */

                       0 2px 4px rgba(0,0,0,.12);
            border:2px solid #cbd5e1;
        }
    </style>

    <script>
        // DOM 元素選取
        const container = document.getElementById('bars-container');
        const arraySizeSlider = document.getElementById('arraySize');
        const speedSlider = document.getElementById('speed');
        const sizeValue = document.getElementById('sizeValue');
        const speedValue = document.getElementById('speedValue');
        const generateBtn = document.getElementById('generateBtn');
        const sortBtn = document.getElementById('sortBtn');
        const stopBtn = document.getElementById('stopBtn');
        const radioBtns = document.getElementsByName('algorithm');
        const orderBtns = document.getElementsByName('order');

        // 手動區變數與 DOM 元素
        let manualArray = [];
        let selectedManualIndex = null;
        const manualContainer = document.getElementById('manual-container');
        const manualGenerateBtn = document.getElementById('manualGenerateBtn');
        const manualMessage = document.getElementById('manualMessage');
        
        // 手動區狀態追蹤
        let manualMode = 'bubble';
        let manualOrder = 'asc';
        let selectionBoundary = 0; 
        let insertionTarget = 1;   
        let insertionCurrent = 1;  

        // 計時器變數
        let timerInterval = null;
        let startTime = 0;
        const timeValue = document.getElementById('timeValue');

        // 全域變數
        let array = [];
        let isSorting = false;
        let delay = 100;

        // 遊戲風格色彩定義
        const COLOR_DEFAULT = '#60a5fa'; // 柔和藍 (未淨化)
        const COLOR_COMPARE = '#ef4444'; // 鮮豔紅 (戰鬥/比較)
        const COLOR_MIN = '#facc15';     // 閃亮黃 (目標)
        const COLOR_SORTED = '#4ade80';  // 治癒綠 (已淨化)

        // 計時器功能
        function updateTimer() {
            const currentTime = Date.now();
            const elapsed = (currentTime - startTime) / 1000;
            if(timeValue) timeValue.textContent = elapsed.toFixed(2);
        }

        function startTimer() {
            if(timeValue) timeValue.textContent = "0.00";
            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 50);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function resetTimer() {
            stopTimer();
            if(timeValue) timeValue.textContent = "0.00";
        }

        // 初始化
        function init() {
            generateArray();
            initManual();
            
            arraySizeSlider.addEventListener('input', () => {
                sizeValue.textContent = arraySizeSlider.value;
                generateArray();
            });

            speedSlider.addEventListener('input', () => {
                delay = speedSlider.value;
                let text = "普通";
                if(delay < 50) text = "疾風";
                else if(delay < 150) text = "敏捷";
                else if(delay > 350) text = "緩慢";
                else if(delay > 250) text = "遲鈍";
                speedValue.textContent = text;
            });

            generateBtn.addEventListener('click', generateArray);
            sortBtn.addEventListener('click', startSorting);
            stopBtn.addEventListener('click', () => {
                isSorting = false;
                stopTimer(); // 撤退時停止計時
                resetUI();
            });
        }

        // 產生隨機陣列
        function generateArray() {
            if (isSorting) return;
            resetTimer(); // 產生新陣列時歸零計時器
            array = [];
            container.innerHTML = '';
            const size = parseInt(arraySizeSlider.value);
            
            for (let i = 0; i < size; i++) {
                const value = Math.floor(Math.random() * 90) + 10; // 10 到 100
                array.push(value);
                const bar = document.createElement('div');
                bar.classList.add('bar', 'w-full');
                bar.style.height = `${value}%`;
                bar.style.backgroundColor = COLOR_DEFAULT;
                container.appendChild(bar);
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function toggleUI(sorting) {
            isSorting = sorting;
            generateBtn.disabled = sorting;
            arraySizeSlider.disabled = sorting;
            sortBtn.disabled = sorting;
            
            radioBtns.forEach(btn => btn.disabled = sorting);
            orderBtns.forEach(btn => btn.disabled = sorting);

            if (sorting) {
                sortBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
            } else {
                sortBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
            }
        }

        function resetUI() {
            toggleUI(false);
            let bars = document.getElementsByClassName('bar');
            for(let bar of bars) {
                if (bar.style.backgroundColor !== getRGB(COLOR_SORTED)) {
                    bar.style.backgroundColor = COLOR_DEFAULT;
                }
            }
        }

        function getRGB(hex) {
            let r = parseInt(hex.slice(1, 3), 16),
                g = parseInt(hex.slice(3, 5), 16),
                b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }

        async function startSorting() {
            toggleUI(true);
            let selectedAlgorithm = document.querySelector('input[name="algorithm"]:checked').value;
            let sortOrder = document.querySelector('input[name="order"]:checked').value;

            let bars = document.getElementsByClassName('bar');
            for(let bar of bars) {
                bar.style.backgroundColor = COLOR_DEFAULT;
            }

            startTimer(); // 開始戰鬥計時

            try {
                if (selectedAlgorithm === 'bubble') await bubbleSort(sortOrder);
                else if (selectedAlgorithm === 'selection') await selectionSort(sortOrder);
                else if (selectedAlgorithm === 'insertion') await insertionSort(sortOrder);
                
                if (isSorting) {
                    for(let bar of bars) {
                        bar.style.backgroundColor = COLOR_SORTED;
                    }
                }
            } catch (e) {
                console.error("Sorting interrupted or error", e);
            } finally {
                stopTimer(); // 戰鬥結束或中斷時停止計時
            }

            toggleUI(false);
        }

        /* -----------------------------------------------------
           演算法實作區塊 (上方面板用)
        ----------------------------------------------------- */
        async function bubbleSort(order) {
            let bars = document.getElementsByClassName('bar');
            let len = array.length;
            for (let i = 0; i < len - 1; i++) {
                for (let j = 0; j < len - i - 1; j++) {
                    if (!isSorting) return; 
                    bars[j].style.backgroundColor = COLOR_COMPARE;
                    bars[j+1].style.backgroundColor = COLOR_COMPARE;
                    await sleep(delay);
                    let condition = order === 'asc' ? array[j] > array[j + 1] : array[j] < array[j + 1];
                    if (condition) {
                        let temp = array[j];
                        array[j] = array[j + 1];
                        array[j + 1] = temp;
                        bars[j].style.height = `${array[j]}%`;
                        bars[j+1].style.height = `${array[j+1]}%`;
                    }
                    bars[j].style.backgroundColor = COLOR_DEFAULT;
                    bars[j+1].style.backgroundColor = COLOR_DEFAULT;
                }
                bars[len - 1 - i].style.backgroundColor = COLOR_SORTED;
            }
            bars[0].style.backgroundColor = COLOR_SORTED;
        }

        async function selectionSort(order) {
            let bars = document.getElementsByClassName('bar');
            let len = array.length;
            for (let i = 0; i < len; i++) {
                if (!isSorting) return;

                // 根據原理設定：目標位置與搜尋範圍
                let target_pos = order === 'asc' ? i : len - 1 - i;
                let search_start = order === 'asc' ? i : 0;
                let search_end = order === 'asc' ? len : len - i;

                let min_idx = search_start;
                bars[target_pos].style.backgroundColor = COLOR_MIN;

                // 在未排序數列中找出最小值
                for (let j = search_start; j < search_end; j++) {
                    if (!isSorting) return;
                    
                    if (j !== target_pos) bars[j].style.backgroundColor = COLOR_COMPARE;
                    await sleep(delay);

                    if (array[j] < array[min_idx]) {
                        if (min_idx !== target_pos && min_idx !== j) bars[min_idx].style.backgroundColor = COLOR_DEFAULT;
                        min_idx = j;
                        if (min_idx !== target_pos) bars[min_idx].style.backgroundColor = COLOR_MIN;
                    } else {
                        if (j !== target_pos && j !== min_idx) bars[j].style.backgroundColor = COLOR_DEFAULT;
                    }
                }

                // 交換目標位置與最小值
                if (min_idx !== target_pos) {
                    let temp = array[target_pos];
                    array[target_pos] = array[min_idx];
                    array[min_idx] = temp;
                    bars[target_pos].style.height = `${array[target_pos]}%`;
                    bars[min_idx].style.height = `${array[min_idx]}%`;
                    bars[min_idx].style.backgroundColor = COLOR_DEFAULT;
                }
                bars[target_pos].style.backgroundColor = COLOR_SORTED;
            }
        }

        async function insertionSort(order) {
            let bars = document.getElementsByClassName('bar');
            let len = array.length;
            bars[0].style.backgroundColor = COLOR_SORTED;
            for (let i = 1; i < len; i++) {
                let key = array[i];
                let j = i - 1;
                bars[i].style.backgroundColor = COLOR_COMPARE;
                await sleep(delay);
                while (j >= 0 && (order === 'asc' ? array[j] > key : array[j] < key)) {
                    if (!isSorting) return;
                    bars[j].style.backgroundColor = COLOR_MIN;
                    await sleep(delay);
                    array[j + 1] = array[j];
                    bars[j + 1].style.height = `${array[j + 1]}%`;
                    bars[j].style.backgroundColor = COLOR_SORTED;
                    j = j - 1;
                }
                array[j + 1] = key;
                bars[j + 1].style.height = `${array[j + 1]}%`;
                for(let k = 0; k <= i; k++){
                    bars[k].style.backgroundColor = COLOR_SORTED;
                }
            }
        }

        /* -----------------------------------------------------
           手動體驗區邏輯
        ----------------------------------------------------- */
        function initManual() {
            radioBtns.forEach(btn => btn.addEventListener('change', generateManualArray));
            orderBtns.forEach(btn => btn.addEventListener('change', generateManualArray));
            manualGenerateBtn.addEventListener('click', generateManualArray);
            generateManualArray();
        }

        function updateManualTips() {
            const titleEl = document.getElementById('manualTipTitle');
            const descEl = document.getElementById('manualTipDesc');
            const orderText = manualOrder === 'asc' ? '由小排到大' : '由大排到小';

            if (manualMode === 'bubble') {
                titleEl.innerHTML = '🫧 技能：氣泡連擊 (Bubble Sort) 的試煉';
                descEl.innerHTML = `<strong>【施法限制】</strong> 只能點擊交換<strong class="text-amber-600">「相鄰」</strong>的兩個方塊。<br>
                【任務目標】 請將魔物數字 <strong class="text-amber-600">${orderText}</strong> 淨化。
                <div class="mt-3 p-3 bg-fuchsia-900/40 rounded border border-fuchsia-500/50 text-sm shadow-inner leading-relaxed">
                    <span class="block text-fuchsia-700">📖 奧義：較極端的數字會像氣泡一樣，透過不斷相鄰交換「浮」到邊緣。</span>
                    <span class="block text-amber-700 mt-2">📝 原理：氣泡排序法(Bubble Sort)又稱交換排序法，原理是從第一筆資料開始，逐一比較相鄰兩筆資料，如果兩筆大小順序有誤則做交換，反之則不動，接著再進行下一筆資料比較，所有資料比較完第1回合後，可以確保最後一筆資料是正確的位置。</span>
                    <span class="block text-fuchsia-700 mt-2">🎒 日常：體育課排隊，老師說「看旁邊的同學，比較高的往後站」，大家兩兩互換。</span>
                </div>`;
            } else if (manualMode === 'selection') {
                titleEl.innerHTML = '🎯 技能：精準選擇 (Selection Sort) 的試煉';
                let targetLoc = manualOrder === 'asc' ? '前端' : '末端';
                descEl.innerHTML = `<strong>【施法限制】</strong> 找出未淨化區的<strong class="text-amber-600">「最小值」</strong>，並將它與未淨化區的<strong class="text-violet-600">「${targetLoc} (紫框標示處)」</strong>交換。<br>
                【任務目標】 每次挑出最小值放好，將陣列 <strong class="text-amber-600">${orderText}</strong> 淨化。
                <div class="mt-3 p-3 bg-fuchsia-900/40 rounded border border-fuchsia-500/50 text-sm shadow-inner leading-relaxed">
                    <span class="block text-fuchsia-700">📖 奧義：用眼睛掃描剩餘區域，鎖定目標後，直接「瞬移」交換一次到位。</span>
                    <span class="block text-amber-700 mt-2">📝 原理：反覆從未排序數列中找出「最小值」，將它與特定的邊界做交換。由大到小排序時，將最小值放到末端；若由小到大排序時，則將最小值放到前端。</span>
                    <span class="block text-fuchsia-700 mt-2">🎒 日常：整理很重的書箱，先找出最輕的搬到目標位置，每次只搬對的書。</span>
                </div>`;
            } else if (manualMode === 'insertion') {
                titleEl.innerHTML = '🃏 技能：卡牌插入 (Insertion Sort) 的試煉';
                descEl.innerHTML = `<strong>【施法限制】</strong> 點選<strong class="text-orange-600">「橘框標示的新卡牌」</strong>，並直接點選左側結界中<strong class="text-amber-600">「正確的插入位置」</strong>。<br>
                【任務目標】 評估左側已排好的數字，將新數字精準安插，將陣列 <strong class="text-amber-600">${orderText}</strong> 淨化。
                <div class="mt-3 p-3 bg-fuchsia-900/40 rounded border border-fuchsia-500/50 text-sm shadow-inner leading-relaxed">
                    <span class="block text-fuchsia-700">📖 奧義：將未排序的新元素，逐一「安插」到左側已經排好順序的結界中。</span>
                    <span class="block text-amber-700 mt-2">📝 原理：逐一將原始資料加入已排序好的資料中，並逐一與已排序好的資料作比較，找到對的位置插入。例如：已有2筆排序好資料，將第3筆資料與前面已排序好的2筆作比較插入，再將第4筆與前面已排序好的3筆作比較插入，以此類推。</span>
                    <span class="block text-fuchsia-700 mt-2">🎒 日常：玩撲克牌，抽一張新牌後，直接把它插進手中已排好順序的牌堆裡。</span>
                </div>`;
            }
        }

        function generateManualArray() {
            manualArray = [];
            manualMessage.classList.add('hidden');
            selectedManualIndex = null;
            
            manualMode = document.querySelector('input[name="algorithm"]:checked').value;
            manualOrder = document.querySelector('input[name="order"]:checked').value;
            
            selectionBoundary = 0;
            insertionTarget = 1;
            insertionCurrent = 1;

            const size = 5 + Math.floor(Math.random() * 3); 
            for (let i = 0; i < size; i++) {
                manualArray.push(Math.floor(Math.random() * 90) + 10);
            }
            
            updateManualTips();
            updateManualStates(); 
            renderManualArray();
        }

        function updateManualStates() {
            if (manualMode === 'selection') {
                while (selectionBoundary < manualArray.length - 1) {
                    let targetPos = manualOrder === 'asc' ? selectionBoundary : manualArray.length - 1 - selectionBoundary;
                    let searchStart = manualOrder === 'asc' ? selectionBoundary : 0;
                    let searchEnd = manualOrder === 'asc' ? manualArray.length : manualArray.length - selectionBoundary;
                    
                    let minIdx = searchStart;
                    for (let i = searchStart + 1; i < searchEnd; i++) {
                        if (manualArray[i] < manualArray[minIdx]) minIdx = i;
                    }
                    
                    if (minIdx === targetPos) {
                        selectionBoundary++;
                    } else {
                        break;
                    }
                }
            } else if (manualMode === 'insertion') {
                while (insertionTarget < manualArray.length) {
                    let needsToMoveLeft = false;
                    if (insertionCurrent > 0) {
                        needsToMoveLeft = manualOrder === 'asc' ?
                            manualArray[insertionCurrent] < manualArray[insertionCurrent - 1] :
                            manualArray[insertionCurrent] > manualArray[insertionCurrent - 1];
                    }

                    if (!needsToMoveLeft) {
                        insertionTarget++;
                        insertionCurrent = insertionTarget;
                    } else {
                        break;
                    }
                }
            }
        }

        function renderManualArray() {
            manualContainer.innerHTML = '';
            manualArray.forEach((value, index) => {
                const block = document.createElement('div');
                let baseClasses = 'manual-block flex items-center justify-center w-14 h-14 md:w-16 md:h-16 lg:w-20 lg:h-20 text-xl md:text-3xl font-bold text-slate-800 rounded-xl cursor-pointer transition-all duration-200 select-none relative ';
                
                let colorClasses = '';
                let ringClasses = '';
                let transformClasses = '';

                if (selectedManualIndex === index) {
                    colorClasses = 'bg-yellow-500 ';
                    transformClasses = 'scale-110 -translate-y-2 z-10 ';
                } else {
                    transformClasses = 'hover:-translate-y-1 ';
                    
                    let isSorted = false;
                    if (manualMode === 'selection') {
                        // 判斷是否為已淨化區域
                        if (manualOrder === 'asc' && index < selectionBoundary) isSorted = true;
                        if (manualOrder === 'desc' && index >= manualArray.length - selectionBoundary) isSorted = true;
                    } else if (manualMode === 'insertion') {
                        if (index < insertionTarget && index !== insertionCurrent) isSorted = true;
                    }

                    if (isSorted && manualMode === 'selection') {
                        colorClasses = 'bg-fuchsia-600 hover:bg-fuchsia-500 ';
                    } else if (isSorted && manualMode === 'insertion') {
                        colorClasses = 'bg-teal-600 hover:bg-teal-500 ';
                    } else {
                        colorClasses = 'bg-fuchsia-600 hover:bg-fuchsia-500 ';
                    }
                }

                let targetPos = -1;
                if (manualMode === 'selection') {
                    targetPos = manualOrder === 'asc' ? selectionBoundary : manualArray.length - 1 - selectionBoundary;
                }

                if (manualMode === 'selection' && index === targetPos && selectedManualIndex !== index) {
                    ringClasses = 'ring-4 ring-purple-400 ring-offset-2 ring-offset-fuchsia-900 ';
                } else if (manualMode === 'insertion' && index === insertionCurrent && selectedManualIndex !== index) {
                    ringClasses = 'ring-4 ring-orange-400 ring-offset-2 ring-offset-fuchsia-900 ';
                }

                block.className = baseClasses + colorClasses + ringClasses + transformClasses;
                block.textContent = value;
                block.addEventListener('click', () => handleManualClick(index));
                manualContainer.appendChild(block);
            });
        }

        function showManualError(msg) {
            manualMessage.innerHTML = msg;
            manualMessage.className = 'text-center font-bold text-sm md:text-lg mb-4 rounded-lg p-3 bg-red-900/80 text-red-100 border-2 border-red-400 block shadow-[0_0_15px_rgba(239,68,68,0.5)]';
            manualMessage.classList.remove('hidden');
        }

        function handleManualClick(index) {
            manualMessage.classList.add('hidden'); 
            
            if (selectedManualIndex === null) {
                selectedManualIndex = index;
                renderManualArray();
                return;
            } 
            if (selectedManualIndex === index) {
                selectedManualIndex = null;
                renderManualArray();
                return;
            }

            let idx1 = selectedManualIndex;
            let idx2 = index;

            /* ===== 嚴格規則判定 ===== */
            if (manualMode === 'bubble') {
                if (Math.abs(idx1 - idx2) !== 1) {
                    showManualError('❌ 施法失敗！氣泡術只能交換「相鄰」的兩顆方塊！');
                    selectedManualIndex = null;
                    renderManualArray();
                    return;
                }
            } 
            else if (manualMode === 'selection') {
                // 原理：反覆尋找「最小值」，並根據方向放到前端或末端
                let targetPos = manualOrder === 'asc' ? selectionBoundary : manualArray.length - 1 - selectionBoundary;
                let searchStart = manualOrder === 'asc' ? selectionBoundary : 0;
                let searchEnd = manualOrder === 'asc' ? manualArray.length : manualArray.length - selectionBoundary;

                let minIdx = searchStart;
                for (let i = searchStart + 1; i < searchEnd; i++) {
                    if (manualArray[i] < manualArray[minIdx]) minIdx = i;
                }

                let isValidSwap = (idx1 === targetPos && idx2 === minIdx) || 
                                  (idx1 === minIdx && idx2 === targetPos);

                if (!isValidSwap) {
                    let dirText = manualOrder === 'asc' ? '前端' : '末端';
                    showManualError(`❌ 鎖定錯誤！請將未淨化區的「最小值」與未排序區的「${dirText} (紫框處)」對調！`);
                    selectedManualIndex = null;
                    renderManualArray();
                    return;
                }
            }
            else if (manualMode === 'insertion') {
                // 依據原理：找出橘框卡牌在左側已排序區域中「正確的落點」
                let expectedDestIdx = insertionCurrent;
                for (let i = 0; i < insertionCurrent; i++) {
                    if (manualOrder === 'asc' ? manualArray[insertionCurrent] < manualArray[i] : manualArray[insertionCurrent] > manualArray[i]) {
                        expectedDestIdx = i;
                        break;
                    }
                }

                let isValidInsertion = (idx1 === insertionCurrent && idx2 === expectedDestIdx) ||
                                       (idx1 === expectedDestIdx && idx2 === insertionCurrent);

                if (!isValidInsertion) {
                    showManualError(`❌ 插入失敗！請比較左側已排序卡牌，將橘框卡牌放入正確的順序位置！`);
                    selectedManualIndex = null;
                    renderManualArray();
                    return;
                }
            }

            // 執行陣列操作
            if (manualMode === 'insertion') {
                // 插入排序：使用陣列裁切(splice)將元素移出，並安插到新位置
                let destIdx = (idx1 === insertionCurrent) ? idx2 : idx1;
                let targetCard = manualArray.splice(insertionCurrent, 1)[0];
                manualArray.splice(destIdx, 0, targetCard);
                
                // 完成一張牌的插入，推進到下一張
                insertionTarget++;
                insertionCurrent = insertionTarget;
            } else {
                // 氣泡與選擇排序：傳統的位置互換
                let temp = manualArray[idx1];
                manualArray[idx1] = manualArray[idx2];
                manualArray[idx2] = temp;
                
                if (manualMode === 'selection') {
                    selectionBoundary++;
                }
            }

            selectedManualIndex = null;

            updateManualStates();
            renderManualArray(); 
            checkManualSort(); 
        }

        function checkManualSort() {
            let isSorted = true;
            for (let i = 0; i < manualArray.length - 1; i++) {
                if (manualOrder === 'asc' ? manualArray[i] > manualArray[i+1] : manualArray[i] < manualArray[i+1]) {
                    isSorted = false;
                    break;
                }
            }

            if (isSorted) {
                manualMessage.classList.remove('hidden');
                manualMessage.innerHTML = '✨ 任務完成！您已成功淨化所有魔物！ ✨';
                manualMessage.className = 'text-center font-bold text-lg mb-4 rounded-lg p-3 bg-fuchsia-900/80 text-fuchsia-600 border-2 border-fuchsia-400 block shadow-[0_0_15px_rgba(74,222,128,0.5)] animate-pulse';
                
                const blocks = manualContainer.children;
                for(let i = 0; i < blocks.length; i++){
                    blocks[i].className = 'manual-block flex items-center justify-center w-14 h-14 md:w-16 md:h-16 lg:w-20 lg:h-20 text-xl md:text-3xl font-bold text-slate-800 rounded-xl shadow-md select-none bg-fuchsia-500 transition-colors duration-300 z-0';
                }
            }
        }

        init();
    </script>
