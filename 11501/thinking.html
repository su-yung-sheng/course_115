<body class="bg-slate-100 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <!-- 加入 data-type="module" 解決 Babel 解析 import 問題 -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // --- Icon 組件 (SVG) ---
        const Icon = ({ path, className }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const Icons = {
            User: (props) => <Icon {...props} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            LogOut: (props) => <Icon {...props} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>} />,
            Play: (props) => <Icon {...props} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Monitor: (props) => <Icon {...props} path={<><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>} />,
            Award: (props) => <Icon {...props} path={<><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>} />,
            Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
            Calendar: (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>} />,
            Timer: (props) => <Icon {...props} path={<><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></>} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />
        };

        // --- 全域時間與日期格式化工具 ---
        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        const formatDate = (date) => {
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 星期${days[date.getDay()]}`;
        };

        // --- Firebase 資料庫設定與初始化 ---
        const fbStore = {
            db: null, doc: null, getDoc: null, setDoc: null, arrayUnion: null, collection: null, getDocs: null,
            query: null, where: null
        };


        /* ── 班級進度：整批下載只做一次 ─────────────────────────
           ⚠️⚠️ 2026-08-19 老師問：「一個一個測，不確定同時 30 個會怎樣。」
              這一頁就是那個地方。本來有兩處直接 getDocs 整個
              artifacts/comp-think-app/public/data/progress 集合，
              而且其中一處的 useEffect 相依陣列是
                  [selectedChallenge, user, completedChallenges]
              ——「換一題」「完成一題」都會再整批下載一次。

              一個人測：10 題 ≈ 20 次 × 全班文件數 ≈ 兩千次讀取，毫無感覺。
              30 個人同時上課：600 次 × 文件數 ——
              那個集合是**跨班級、跨學年累積**的（路徑寫死 comp-think-app），
              文件一多就直接吃掉 Firebase 免費額度的一天份（50,000 次讀取）。
              ⚠️ 額度用完的症狀不是錯誤訊息，是「讀不到進度」——
                 全班同時看起來像系統壞了，而且要等到隔天才會自己好。

           ⇒ 三件事一起做：
              ① 只抓自己班（where classRoom == 我的班），不要整包
              ② 抓一次就快取，換題不重抓
              ③ 自己完成一題時在本機更新那一筆，不重抓
           ★ 這裡刻意**不設定時間過期**：同一堂課裡「本班已通關幾人」
             晚幾分鐘更新沒有任何影響，而每一次重抓都是全班 ×30 的代價。 */
        const classCache = { room: '', rows: null };

        async function loadClassRows(classRoom, force) {
            if (!classRoom) return [];
            if (!force && classCache.room === classRoom && classCache.rows) return classCache.rows;
            const ok = await initFB();
            if (!ok) throw new Error("Firebase 未就緒");
            const col = fbStore.collection(fbStore.db, 'artifacts', 'comp-think-app', 'public', 'data', 'progress');
            /* where 是單一欄位相等比較，不需要另外建索引。
               ⚠️ 舊資料若沒有 classRoom 欄位就抓不到 —— 那些本來也不該出現在別班的畫面上。 */
            const q = (fbStore.query && fbStore.where)
              ? fbStore.query(col, fbStore.where('classRoom', '==', classRoom)) : col;
            const snap = await fbStore.getDocs(q);
            const rows = [];
            snap.forEach(d => { const v = d.data(); if (v.classRoom === classRoom) rows.push(v); });
            classCache.room = classRoom; classCache.rows = rows;
            return rows;
        }

        /** 自己剛通過一關：更新快取裡自己那一筆，不要再抓一次全班 */
        function noteMyPass(classRoom, seatNo, challengeId) {
            if (classCache.room !== classRoom || !classCache.rows) return;
            let me = classCache.rows.find(r => String(r.seatNo) === String(seatNo));
            if (!me) { me = { classRoom, seatNo, completed: [] }; classCache.rows.push(me); }
            me.completed = me.completed || [];
            if (!me.completed.includes(challengeId)) me.completed.push(challengeId);
        }

        const initFB = async () => {
            if (fbStore.db) return true;
            try {
                // 使用 new Function 包裝 import，防止 Babel 將 import() 編譯為 require()
                const { initializeApp, getApps, getApp } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js')")();
                const { getFirestore, doc, getDoc, setDoc, arrayUnion, collection, getDocs, query, where } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')")();
                const { getAuth, signInAnonymously, onAuthStateChanged } = await new Function("return import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js')")();

                const firebaseConfig = window.CONFIG.FIREBASE;

                const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
                const auth = getAuth(app);
                
                try {
                    // AUTH.attachSession()：已經有身分（例如剛在闖關基地用學校 Google 帳號登入）
                    //    就不要再匿名登入，否則會把 Google 身分蓋掉，安全規則的 isOwner() 失效。
                    await AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
                } catch (authErr) {
                    console.warn("匿名登入失敗 (可能未於 Firebase Console 啟用)，將嘗試直接讀寫資料庫:", authErr);
                }
                
                fbStore.db = getFirestore(app);
                fbStore.doc = doc;
                fbStore.getDoc = getDoc;
                fbStore.setDoc = setDoc;
                fbStore.arrayUnion = arrayUnion;
                fbStore.collection = collection;
                fbStore.getDocs = getDocs;
                fbStore.query = query;
                fbStore.where = where;
                return true;
            } catch (err) {
                console.error("Firebase 初始化失敗:", err);
                return false;
            }
        };

        // --- 班級過關紀錄查詢 Modal 組件 ---
        const QueryModal = ({ onClose, userClass }) => {
            const [studentsData, setStudentsData] = useState([]);
            const [loadingData, setLoadingData] = useState(true);
            const [errorMsg, setErrorMsg] = useState("");

            useEffect(() => {
                const fetchClassData = async () => {
                    setLoadingData(true);
                    setErrorMsg("");
                    try {
                        const ok = await initFB();
                        if (!ok) throw new Error("資料庫連線失敗");

                        /* 只抓自己班、而且走同一份快取（見 loadClassRows）。
                           這是使用者按開的視窗，重新整理一次是合理的，
                           所以 force = true；換題那一支就不重抓。 */
                        const data = (await loadClassRows(userClass, true)).slice();
                        
                        data.sort((a, b) => parseInt(a.seatNo) - parseInt(b.seatNo));
                        setStudentsData(data);
                        
                        if(data.length === 0) setErrorMsg(`目前 ${userClass} 班尚無任何通關紀錄。`);
                    } catch (err) {
                        setErrorMsg("查詢失敗，請確認 Firebase 資料庫規則已設為允許讀取。" + err.message);
                    } finally {
                        setLoadingData(false);
                    }
                };
                fetchClassData();
            }, [userClass]);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-4xl w-full mx-auto overflow-hidden relative flex flex-col max-h-[90vh]">
                        <div className="bg-indigo-600 px-6 py-4 flex justify-between items-center shrink-0">
                            <h3 className="text-xl font-bold text-white"><i className="fa-solid fa-users mr-2"></i>{userClass} 班過關紀錄查詢</h3>
                            <button onClick={onClose} className="text-indigo-200 hover:text-white transition-colors">
                                <i className="fa-solid fa-xmark text-2xl"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-50">
                            {loadingData ? (
                                <div className="text-center text-slate-500 py-16 flex flex-col items-center">
                                    <i className="fa-solid fa-spinner animate-spin text-5xl mb-4 text-indigo-500"></i>
                                    <p className="font-medium">正在載入 {userClass} 班的資料...</p>
                                </div>
                            ) : errorMsg ? (
                                <div className="text-center text-slate-500 py-10 font-medium bg-white rounded-xl border border-dashed border-slate-300">
                                    {errorMsg}
                                </div>
                            ) : (
                                <div className="overflow-hidden rounded-xl border border-slate-200 shadow-sm bg-white">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-700 text-sm">
                                                <th className="p-4 border-b border-slate-200 font-bold w-20">座號</th>
                                                <th className="p-4 border-b border-slate-200 font-bold w-32">姓名</th>
                                                <th className="p-4 border-b border-slate-200 font-bold w-24 text-center">過關數</th>
                                                <th className="p-4 border-b border-slate-200 font-bold">已通關關卡 (游標懸停顯示獨立通關日期)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            {studentsData.map((student, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
                                                    <td className="p-4 text-slate-600 font-mono font-bold">{student.seatNo}</td>
                                                    <td className="p-4 font-bold text-slate-800">{student.name}</td>
                                                    <td className="p-4 text-center">
                                                        <span className="bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full">
                                                            {student.completed ? student.completed.length : 0}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-slate-500 font-medium">
                                                        {student.completed && student.completed.length > 0 ? (
                                                            <div className="flex flex-wrap gap-2">
                                                                {student.completed.sort((a,b)=>a-b).map(id => (
                                                                    <div key={id} className="group relative inline-block cursor-help">
                                                                        <span className="bg-indigo-50 text-indigo-700 px-2.5 py-1.5 rounded-lg text-xs font-bold border border-indigo-100 shadow-sm transition-colors group-hover:bg-indigo-600 group-hover:text-white">
                                                                            #{id}
                                                                        </span>
                                                                        <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block bg-slate-800 text-white text-xs px-3 py-2 rounded-lg whitespace-nowrap z-10 shadow-lg">
                                                                            <i className="fa-regular fa-calendar-check mr-1 text-emerald-400"></i>
                                                                            通關日期: {student.completionDates?.[id] || student[`completionDates.${id}`] || '未知 (舊紀錄)'}
                                                                            <div className="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        ) : '無'}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 個人通關證書檢視 Modal 組件 ---
        const MyCertificatesModal = ({ onClose, user, completedChallenges, completedDates, certificateUrls, challenges }) => {
            const [selectedId, setSelectedId] = useState(
                completedChallenges.length > 0 ? [...completedChallenges].sort((a,b) => a-b)[0] : null
            );

            const currentChallenge = challenges.find(c => c.id === selectedId);
            const todayStr = formatDate(new Date()); 
            
            // 抓取雲端紀錄中該獨立關卡的過關日期，如果舊資料尚未記錄，則預設顯示今天
            const passDate = completedDates[selectedId] || todayStr;
            // 取出雲端圖片連結 (若為舊紀錄相容則抓帶點的路徑)
            const driveUrl = certificateUrls ? (certificateUrls[selectedId] || certificateUrls[`certificateUrls.${selectedId}`]) : null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl shadow-2xl max-w-5xl w-full mx-auto overflow-hidden flex flex-col md:flex-row min-h-[550px] animate-[fadeIn_0.3s_ease-out]">
                        
                        <div className="w-full md:w-1/3 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 max-h-[50vh] md:max-h-none">
                            <div className="p-6 bg-indigo-600 text-white flex justify-between items-center shrink-0">
                                <h3 className="text-lg font-bold"><i className="fa-solid fa-trophy mr-2 text-amber-400"></i>我的成就庫</h3>
                                <button onClick={onClose} className="md:hidden text-indigo-200 hover:text-white transition-colors">
                                    <i className="fa-solid fa-xmark text-2xl"></i>
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {completedChallenges.length === 0 ? (
                                    <div className="text-center text-slate-400 mt-10">
                                        <i className="fa-solid fa-folder-open text-5xl mb-4 opacity-50"></i>
                                        <p className="font-bold">尚未獲得任何證書</p>
                                        <p className="text-sm mt-1">請先去挑戰關卡吧！</p>
                                    </div>
                                ) : (
                                    [...completedChallenges].sort((a,b) => a-b).map(id => {
                                        const c = challenges.find(ch => ch.id === id);
                                        return (
                                            <button 
                                                key={id}
                                                onClick={() => setSelectedId(id)}
                                                className={`w-full text-left p-4 rounded-xl font-bold flex items-center justify-between transition-all ${
                                                    selectedId === id 
                                                        ? 'bg-indigo-100 text-indigo-800 border-2 border-indigo-400 shadow-sm' 
                                                        : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${selectedId === id ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                        {c?.id}
                                                    </div>
                                                    <span>{c?.title}</span>
                                                </div>
                                                {selectedId === id && <i className="fa-solid fa-chevron-right text-indigo-500"></i>}
                                            </button>
                                        )
                                    })
                                )}
                            </div>
                        </div>

                        <div className="w-full md:w-2/3 p-6 sm:p-10 bg-slate-100 flex flex-col items-center justify-center relative">
                            <button onClick={onClose} className="hidden md:flex absolute top-6 right-6 text-slate-400 hover:text-slate-600 bg-white hover:bg-slate-200 rounded-full w-10 h-10 items-center justify-center shadow-sm transition-colors z-10">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>

                            {currentChallenge ? (
                                <div className="w-full max-w-lg bg-white border-[8px] border-double border-indigo-100 p-8 sm:p-12 shadow-xl relative text-center animate-[fadeIn_0.4s_ease-out]">
                                    <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                        <div className="bg-gradient-to-br from-amber-400 to-amber-600 text-white w-16 h-16 flex items-center justify-center rounded-full shadow-lg border-4 border-white">
                                            <i className="fa-solid fa-award text-3xl"></i>
                                        </div>
                                    </div>
                                    <h2 className="text-2xl sm:text-3xl font-black text-indigo-900 mt-6 mb-8 tracking-[0.2em] relative inline-block">
                                        通關證明
                                        <span className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-12 h-1 bg-amber-400 rounded-full"></span>
                                    </h2>
                                    
                                    <div className="text-lg text-slate-700 mb-6 leading-relaxed">
                                        茲證明 <br/>
                                        <span className="text-2xl font-bold text-indigo-700 mx-2">{user.classRoom}</span> 班 
                                        <span className="text-2xl font-bold text-indigo-700 mx-2">{user.seatNo}</span> 號 <br/>
                                        <span className="text-3xl font-black text-slate-900 mt-3 inline-block">{user.name}</span>
                                    </div>

                                    <div className="text-slate-500 font-bold mb-3">已成功完成運算思維挑戰關卡：</div>

                                        <div className="text-left">
                                            <div className="font-bold text-slate-800">運算思維挑戰平台</div>
                                            <div className="text-[10px] text-slate-400 mt-1 uppercase tracking-wider font-bold"><i className="fa-solid fa-check-circle text-emerald-500 mr-1"></i>System Verified</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-xs font-bold text-slate-500 mb-1">通關日期</div>
                                            <div className="text-sm font-bold text-slate-700">{passDate}</div>
                                        </div>
                                    </div>

                                    {/* 📌 新增：顯示您的雲端截圖 */}
                                    <div className="mt-6 flex-1 border-2 border-dashed border-indigo-100 rounded-xl overflow-hidden relative flex items-center justify-center bg-slate-50 group min-h-[140px]">
                                        {driveUrl ? (
                                            <>
                                                <img src={driveUrl} className="max-h-[160px] max-w-full object-contain p-2" alt="通關截圖" />
                                                <div className="absolute bottom-2 right-2 bg-indigo-900/70 text-white text-[10px] px-2.5 py-1 rounded-md backdrop-blur-sm font-bold tracking-wider">
                                                    <i className="fa-solid fa-cloud text-emerald-400 mr-1"></i>雲端備份
                                                </div>
                                            </>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center text-slate-400 py-6">
                                                <i className="fa-solid fa-image text-3xl mb-2 opacity-30"></i>
                                                <span className="text-xs font-bold">無雲端截圖紀錄</span>

                                </div>
                            ) : (
                                <div className="text-slate-400 text-center flex flex-col items-center">
                                    <i className="fa-solid fa-medal text-7xl mb-4 opacity-30"></i>
                                    <p className="text-lg font-bold">選擇左側列表檢視通關證書</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 證書製作/通關確認 Modal 組件 ---
        /* ══════════════════════════════════════════════════════════
           通關確認：學生把截圖傳到**雲端**，Colab 有空再取來辨識
           ══════════════════════════════════════════════════════════
           ⚠️⚠️ 2026-09-03 老師：「圖片都上傳到雲端了，為什麼還會滿載
              讓使用者無法上傳？」—— 因為上傳這個動作原本**還是打在 Colab 上**。
              Colab 一忙（兩顆 CPU 被 OCR 佔滿），/health 就回得慢、
              學生端判離線、鎖住按鈕 —— 學生連傳都傳不出去。
              那次「全班變成等待連線中」就是這樣來的。
           ★ 改成：上傳打 GAS（雲端硬碟），Colab 掛掉、滿載都不影響學生上傳。
             進度和結果才問 Colab —— 問不到只是看不到進度，圖已經安全。

           ⚠️⚠️ 所以這個元件有一條**不可以再破掉的規則**：
              上傳按鈕**不准**因為「連不上 Colab」而變灰。
              （health-poll.test.js 盯著這一條。）

           ★ 不再需要選關卡：關卡由檔名判定（和後端同一套規則，
             見 shared/ocrclient.js 的 levelFromFilename）。
           ⚠️ 檔名認不出關卡時**在選檔當下就擋**，不要讓學生傳出去
              白排 20 分鐘的隊才發現沒人知道那是哪一關。 */
        const CertVerificationModal = ({ onClose, user, challenges, studyTime, onComplete, onOpenCerts }) => {
            /* ⚠️ 運算思維走 OCR_SERVER_URL（沒設就退回 SERVER_URL）。
               OCR 會把 CPU 吃滿，和 Scratch 批改擠在同一台時，
               批改那邊的 /health 會回得慢、學生端誤判離線。
               ⇒ 兩門課同一節一起上時，把 OCR 拆到第二台 Colab。
               ⚠️ 留空一定要退回 SERVER_URL —— 只開一台時才不會
                  連到一台沒開的機器。 */
            const API_BASE = (window.CONFIG.OCR_SERVER_URL || '').trim()
                             || window.CONFIG.SERVER_URL;
            // ⚠️ 班級密碼：需與後端 Colab Secrets 的 CLASS_PASSCODE 一致（僅擋外部亂打，非機密）
            const CLASS_PASS = window.CONFIG.CLASS_PASS;
            /* ★ 上傳的目的地：GAS（雲端硬碟的暫存區），不是 Colab。
               ⚠️ 沒設定的話這一頁等於不能交作業 —— 要講出來，
                  不可以只在 console 印一行然後讓按鈕默默沒反應。 */
            const GAS_URL = (window.CONFIG.GAS_UPLOAD_URL || '').trim();
            const GAS_KEY = window.CONFIG.GAS_UPLOAD_KEY;
            const TERM = (window.CONFIG && window.CONFIG.TERM) || '11501';
            const SID = (() => {
                try { return (sessionStorage.getItem('sid' + TERM) || '').trim(); }
                catch (e) { return ''; }
            })();

            /* ⚠️ 以前「還在連」和「連不上」顯示的是同一句「伺服器連線中...」——
               老師因此分不出後端是還沒連上、還是根本掛了。分成兩句。
               ⚠️⚠️ 2026-09-03 之後「連不上」的**意思變了**：
                  上傳打的是 GAS，Colab 連不上並不影響交作業，
                  只是看不到排隊清單而已。⇒ 話要跟著改，
                  不可以再讓學生以為自己傳不出去。 */
            const OFFLINE_NOTE = "看不到排隊清單（後端可能還沒開）—— 截圖照樣傳得出去，之後會自動處理";
            const [isOnline, setIsOnline] = useState(false);
            const [netNote, setNetNote] = useState("連線中...");
            /* ⚠️ 「伺服器活著」不等於「可以辨識」：剛重啟時 Flask 已經在服務，
               但 PaddleOCR 模型要等第一次辨識才載入，第一位上傳的人會多等幾十秒。
               引擎載入失敗時更要講出來 —— 那時排隊清單會一直不動。 */
            const [ocrState, setOcrState] = useState("");
            /* ⚠️⚠️ 暫存區工作者沒起來（後端沒設 GAS Secrets）時，
               圖會一直留在雲端沒有人取 —— 清單只增不減。
               這種狀況要講出來，不然它看起來只是「今天特別慢」。 */
            const [worker, setWorker] = useState(true);
            const [isProcessing, setIsProcessing] = useState(false);
            /* 排隊清單：後端把暫存區的檔案列出來就是它（檔名帶學號和關卡）。
               ★ 「還在清單裡」＝「還沒處理完」，不必另外做狀態機。 */
            const [queue, setQueue] = useState([]);
            const [myUpName, setMyUpName] = useState("");
            /* 後端最近一次掃暫存區成功了沒。⚠️ 失敗時**不可以**顯示成
               「目前沒有人在排隊」—— 那會讓學生以為系統好好的。 */
            const [scanOk, setScanOk] = useState(true);
            const [scanErr, setScanErr] = useState("");

            /* 一列排隊資料 -> 「1410700 滑梯公園」。
               ⚠️ 認不出關卡就只顯示學號，不要編一個關卡名出來。 */
            const queueLabel = (row) => {
                const lv = window.levelFromFilename(row.name || '', challenges);
                return (row.student_id || '') + (lv ? ' ' + lv.title : '');
            };

            const [selectedFile, setSelectedFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null); // 這邊會存放 Base64
            const [result, setResult] = useState(null); 
            
            const fileInputRef = useRef(null);
            
            const [certDate] = useState(formatDate(new Date()));
            const [certTime] = useState(formatTime(studyTime));

            /* ══════════════════════════════════════════════════════
               背景輪詢：排隊清單 ＝ 連線指示燈（同一支請求兼兩件事）
               ══════════════════════════════════════════════════════
               ⚠️⚠️ 2026-08-26 老師回報：多人連線之後卡在「伺服器連線中...」。
                  原因是這個輪詢本身：每 5 秒一次 × 30 人 = 每分鐘 360 次、
                  一次失敗就判離線（上傳按鈕跟著鎖死）、請求沒有逾時。
               ⇒ 頻率降下來、失敗要容忍、背景分頁不打、請求要有逾時。
               ⚠️⚠️ 2026-09-03 起再改一件更根本的事：**離線不再鎖按鈕**。
                  上傳打的是 GAS，Colab 活不活著跟「能不能交作業」無關；
                  以前那個連動正是「全班變成等待連線中」的最後一哩。
               ★ 順便把 /health 併掉：這一支已經要問排隊清單，
                 清單回得來就代表後端活著，不必再多打一種請求。
                 （引擎狀態和工作者狀態現在也由 /api/queue-list 帶回來。） */
            useEffect(() => {
                let interval;
                const MISS_LIMIT = 3;        // 連續失敗這麼多次才算真的離線
                const BASE_MS = 25000, MAX_MS = 300000;
                let misses = 0, alive = true;
                /* ⚠️⚠️ 2026-08-26 老師：「有一次後端當機，無法重啟，前端還一直
                   送要求進來。」—— 判離線之後照樣每 25 秒敲一次，30 台瀏覽器
                   一起敲，網域一恢復就被打爆，反而更難重啟。⇒ 指數退避。 */
                const nextDelay = () => (misses < MISS_LIMIT ? BASE_MS
                    : Math.min(MAX_MS, BASE_MS * Math.pow(2, misses - MISS_LIMIT + 1)));
                const goOffline = () => {
                    /* ⚠️ 只改文字，**不動上傳按鈕**。
                       這是 2026-09-03 那次故障的核心教訓。 */
                    setIsOnline(false);
                    setNetNote(OFFLINE_NOTE);
                };
                const checkQueue = async () => {
                    // 自己正在等結果時，waitViaCloud 已經在問同一支了，不重複打
                    if (isProcessing) return;
                    if (document.hidden) return;      // 分頁在背景，不要浪費配額
                    const ctl = new AbortController();
                    /* ⚠️ 逾時放寬到 15 秒：後端忙的時候本來就該多等一下
                       （這一支只讀記憶體，慢的是排不到 CPU）。 */
                    const timer = setTimeout(() => ctl.abort(), 15000);
                    try {
                        const res = await fetch(API_BASE + "/api/queue-list", {
                            headers: { 'ngrok-skip-browser-warning': '1' },
                            cache: 'no-store', signal: ctl.signal
                        });
                        if (!alive) return;
                        if (res.ok) {
                            misses = 0; setIsOnline(true); setNetNote("連線中...");
                            try {
                                const j = await res.json();
                                setQueue(Array.isArray(j.queue) ? j.queue : []);
                                /* ⚠️⚠️ 「掃到 0 筆」和「根本掃不到」在 queue 上
                                   長得一模一樣。後端現在會回 scan.ok —— 沒有它的話
                                   畫面會顯示「目前沒有人在排隊」，學生就對著一個
                                   壞掉的系統一直等（2026-09-03 實際發生過）。
                                   ⚠️ 舊後端沒有 scan 欄位（undefined）→ 當成正常。 */
                                /* ⚠️⚠️ 要**連續**失敗才算壞掉。第一版只看 ok，
                                   結果 GAS 偶爾抖一下（下一輪 8 秒後就好了）
                                   學生螢幕上就跳紅字 —— 全班一起被嚇到。
                                   ★ 和健康檢查的 MISS_LIMIT 同一個原則。 */
                                setScanOk(!(j.scan && (j.scan.fails || 0) >= 3));
                                setScanErr((j.scan && j.scan.error) || "");
                                setOcrState(j.ocr_state || "");
                                /* ⚠️ 舊後端沒有 worker 這個欄位（undefined）——
                                   那時不要顯示警告，不然每次都在喊狼來了。 */
                                setWorker(j.worker !== false);
                            } catch (e) { /* 回的不是 JSON：當成這一輪沒問到 */ }
                        }
                        else if (++misses >= MISS_LIMIT) { goOffline(); }
                    } catch (e) {
                        if (!alive) return;
                        if (++misses >= MISS_LIMIT) { goOffline(); }
                    } finally {
                        clearTimeout(timer);
                    }
                };
                /* 用 setTimeout 遞迴而不是 setInterval —— 間隔要能隨失敗次數變長。 */
                const loop = async () => {
                    await checkQueue();
                    if (alive) interval = setTimeout(loop, nextDelay());
                };
                loop();
                /* 「立刻再試一次」：離線時給學生／老師一個不用等退避的出口。 */
                window.__retryHealth = () => { misses = 0; setNetNote("重新檢查中..."); loop(); };
                return () => { alive = false; clearTimeout(interval); window.__retryHealth = null; };
            }, [isProcessing]);

            /* 這次選到的關卡（由檔名判定）與看不懂檔名時要說的話 */
            const [matched, setMatched] = useState(null);
            const [nameNote, setNameNote] = useState("");

            const handleFileChange = (e) => {
                if(e.target.files.length > 0) {
                    const file = e.target.files[0];
                    setSelectedFile(file);

                    /* ══════════════════════════════════════════════
                       關卡由檔名判定 —— 認不出來就當場擋下
                       ══════════════════════════════════════════════
                       ⚠️⚠️ 2026-09-03 起不用選關卡了。好處是學生不會
                          「選 A 傳 B」，代價是檔名變成唯一的線索。
                       ★ Windows 的「視窗擷取」會存成
                         「滑梯公園 - Google Chrome 2026_8_31 下午 03_47_38.png」，
                         關卡名就在裡面 —— 正常流程一定認得出來。
                       ⚠️ 但 Win+Shift+S（剪取工具的自由框選）存出來的是
                          「螢幕擷取畫面 2026-09-03 103015.png」，
                          裡面沒有任何關卡資訊。這種**一定要在這裡擋**：
                          放它出去的話，學生要排完 20 分鐘的隊，
                          才會被告知「不知道你傳的是哪一關」。 */
                    const lv = window.levelFromFilename(file.name, challenges);
                    setMatched(lv);
                    setNameNote(lv ? "" : file.name);

                    // 📌 使用 FileReader 將圖片轉為 Base64，以利後續上傳給 GAS
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setPreviewUrl(event.target.result);
                    };
                    /* ⚠️⚠️ 換了圖就要清掉上一次的結果。
                       2026-08-26 加了「驗證成功後禁用按鈕」之後，這一行變成必要的 ——
                       沒有它，學生想換一張重驗會發現按鈕永遠是暗的，等於被鎖死。 */
                    setResult(null);
                    setMyUpName("");
                    reader.readAsDataURL(file);
                }
            };

            /* ══════════════════════════════════════════════════════
               送出：圖上雲端，然後等「從排隊清單消失」
               ══════════════════════════════════════════════════════
               ⚠️⚠️ 這裡**不打 Colab**。以前是 POST /analyze-async 拿號碼牌，
                  Colab 一忙就送不出去 —— 那正是要修掉的東西。
               ★ 判斷「我好了沒」＝「我的檔案從暫存區的清單裡消失了」，
                 因為後端處理完就刪檔。不必另外做一套狀態機，
                 也就不會有「清單和實際狀態對不上」的問題。 */
            const startAnalysis = async () => {
                if(!selectedFile || !matched) return;
                if(!GAS_URL) {
                    setResult({ status: 'error',
                        msg: "這一頁還沒設定截圖上傳位置（GAS_UPLOAD_URL）—— 請告訴老師，不是你的問題。" });
                    return;
                }
                setIsProcessing(true);
                setResult(null);

                const upCtl = new AbortController();
                /* ★ 最後防線，放得很寬：真正的放棄邏輯在 ocrclient.js
                     的 GIVE_UP_MS（20 分鐘）。 */
                const upTimer = setTimeout(() => upCtl.abort(), 25 * 60 * 1000);
                try {
                    /* ① 上傳到雲端暫存區。⚠️ 這是唯一會讓學生白做的一步，
                          失敗訊息要具體（ocrclient.js 已經處理）。 */
                    const up = await window.submitViaCloud({
                        gasUrl: GAS_URL, gasKey: GAS_KEY, term: TERM,
                        sid: SID, file: selectedFile, signal: upCtl.signal
                    });
                    if (!up.ok) {
                        throw new Error((up.data && up.data.message) || '截圖沒有上傳成功');
                    }
                    setMyUpName(up.upName || "");

                    /* ② 等結果。中途 Colab 掛掉也繼續等 —— 圖已經在雲端了。 */
                    const out = await window.waitViaCloud({
                        base: API_BASE, sid: SID, term: TERM,
                        challengeId: matched.id, level: matched.title,
                        onQueue: (list) => setQueue(Array.isArray(list) ? list : []),
                        signal: upCtl.signal
                    }, up.upName);

                    const data = out.data || {};
                    if (out.status !== 'done') {
                        throw new Error(data.message || '等不到結果');
                    }
                    // 🔒 判定由後端裁決（成績寫在後端的通關紀錄裡），前端只負責顯示
                    if (data.pass === true) {
                        setResult({ status: 'pass', msg: "驗證成功！正在存檔..." });
                        /* ⚠️ 雲端這條路後端拿不到班級和座號（檔名裡只有學號），
                           所以它不會上傳截圖備份 —— 第三個參數（手上這張圖）
                           就是備份的來源，handleChallengeComplete 會自己傳。 */
                        await onComplete(matched.id, certDate, previewUrl, "", null);
                        setResult({ status: 'pass',
                            msg: (SID ? SID + ' ' : '') + matched.title
                                 + ' 證書完成　請到證書區查看' });
                    } else {
                        const errors = (data.reasons && data.reasons.length) ? data.reasons : ["截圖未通過驗證"];
                        setResult({ status: 'fail', msg: "截圖驗證失敗，請確認圖片內容：", errors: errors });
                    }
                } catch(err) {
                    /* ⚠️⚠️ 這裡原本一律顯示「請確認伺服器正在執行，且 API 網址正確」——
                       那是講給老師聽的，學生看了只會不知所措。
                       ⇒ 上傳／後端說得清楚的就照原話，其餘才用通則。 */
                    const raw = (err && err.message) || '';
                    const isOwn = raw && raw !== 'Failed to fetch'
                                  && !/aborted|NetworkError|Load failed/i.test(raw);
                    setResult({
                        status: 'error',
                        msg: isOwn ? raw
                             : "截圖沒有送出去 —— ⚠️ 這不是你的截圖有問題，"
                               + "請檢查網路，等一下再試一次；還是不行就告訴老師。"
                    });
                } finally {
                    clearTimeout(upTimer);
                    setIsProcessing(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 overflow-y-auto">
                    <div className="bg-white/95 backdrop-blur-xl rounded-[32px] p-6 sm:p-10 shadow-2xl max-w-5xl w-full mx-auto relative border border-white/60 my-auto">
                        <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full w-10 h-10 flex items-center justify-center transition-colors z-10">
                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>

                        <div className="text-center mb-8">
                            <div className="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-full text-sm font-semibold text-slate-500 mb-6 shadow-sm transition-colors">
                                <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse shadow-[0_0_0_4px_rgba(16,185,129,0.2)]' : 'bg-slate-300'}`}></span>
                                {/* ⚠️ 老師 2026-09-03：「上方只顯示連線中，下面列排隊清單。」
                                    ★ 這一列**只是狀態**，不再暗示「能不能上傳」——
                                      上傳打的是雲端，跟這一列無關。 */}
                                <span>{!isOnline ? netNote

        // --- 主應用程式 ---
        const App = () => {

            const [classPassCount, setClassPassCount] = useState(null);

            const classes = Array.from({ length: 12 }, (_, i) => `8${String(i + 1).padStart(2, '0')}`);
            const seatNumbers = Array.from({ length: 30 }, (_, i) => String(i + 1).padStart(2, '0'));

            const challenges = [
                { id: 1, title: "跳格子", url: "https://reurl.cc/mpY8EY", difficulty: "★★" },
                { id: 2, title: "任意門", url: "https://reurl.cc/ovYkWl", difficulty: "★★" },

            useEffect(() => {

            // 📌 修改：接收第三個參數 Base64 截圖，並觸發上傳
            const handleChallengeComplete = async (challengeId, passDate, base64Image, ocrText, backendUrl) => {
                if (!completedChallenges.includes(challengeId)) {
                    
                    /* ⚠️⚠️ 2026-09-02：截圖改由**後端**上傳（它本來就握著那張圖）。

                    let driveUrl = backendUrl || null;

                    // 後端沒傳成功、而且前端還有圖，才自己傳

                        try {
                            const formattedChallengeId = String(challengeId).padStart(2, '0');
                            const payload = {
                                // 共用 GAS 靠 term 決定寫進哪個學期資料夾，不可省略
                                term: window.CONFIG.TERM,
                                key: window.CONFIG.GAS_UPLOAD_KEY,
                                classRoom: user.classRoom,
                                seatNo: user.seatNo,
                                challengeId: formattedChallengeId,
                                mimeType: base64Image.split(';')[0].split(':')[1],
                                base64: base64Image.split(',')[1]
                            };

                            const res = await fetch(GAS_UPLOAD_URL, {
                                method: "POST",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                body: JSON.stringify(payload)
                            });
                            const data = await res.json();
                            if (data.success) {
                                driveUrl = data.url;
                            }
                        } catch (e) {
                            console.error("雲端上傳截圖失敗:", e);
                        }
                    }

                    const newCompleted = [...completedChallenges, challengeId];
                    setCompletedChallenges(newCompleted);
                    setCompletedDates(prev => ({...prev, [challengeId]: passDate}));
                    if (driveUrl) {
                        setCertificateUrls(prev => ({...prev, [challengeId]: driveUrl}));
                    }
                    
                    if (fbStore.db && user) {
                        try {
                            const progressRef = fbStore.doc(fbStore.db, 'artifacts', 'comp-think-app', 'public', 'data', 'progress', user.docId);

                            await fbStore.setDoc(progressRef, {
                                completed: fbStore.arrayUnion(challengeId),
                                completionDates: {
                                    [challengeId]: passDate
                                },
                                ...(driveUrl && { certificateUrls: { [challengeId]: driveUrl } }),
                                ...(ocrText && { ocrTexts: { [challengeId]: ocrText } }),
                                lastUpdated: new Date().toISOString(),
                                name: user.name,
                                classRoom: user.classRoom,
                                seatNo: user.seatNo
                            }, { merge: true });
                        } catch (err) {
                            console.error("寫入進度失敗:", err);
                        }
                        /* 自己剛過的這一關要反映在「本班已通關 N 人」上，
                           但**不要**為此再整批下載一次全班（那正是 30 人同時
                           上課會爆額度的原因）—— 在快取裡更新自己那一筆就好。 */
                        noteMyPass(user.classRoom, user.seatNo, challengeId);
                    }

                    // 🌟 回報到統一進度（11501-progress，供 hub 儀表板與每週成績使用）
                    if (fbStore.db && user && user.sid) {
                        try {
                            const count = newCompleted.length;
                            const stars = window.GRADING.thinkingStars(count);   // 規則定義在 shared/grading.js（單一來源）
                            const status = count >= 10 ? 'pass' : 'in-progress';
                            const now = Date.now();
                            await fbStore.setDoc(fbStore.doc(fbStore.db, '11501-progress', user.sid), {
                                studentId: user.sid,
                                modules: { thinking: { status, level: count, stars, source: 'auto', updatedAt: now } },
                                history: fbStore.arrayUnion({ module: 'thinking', challenge: challengeId, at: now, stars: 2, ocr: ocrText || '' }),
                                updatedAt: now
                            }, { merge: true });
                        } catch (err) { console.error("回報統一進度失敗:", err); }
                    }
                }
            };

            // 以學號＋驗證碼登入（trusted=true 為 SSO 自動登入，跳過驗證碼比對）
            const doSidLogin = async (sid, inName, code, trusted) => {
                const ok = await initFB();
                if (!ok || !fbStore.db) return '雲端連線失敗，請稍後再試';
                // 向名冊查學號
                let info = null;
                try {
                    const rsnap = await fbStore.getDoc(fbStore.doc(fbStore.db, window.CONFIG.COLLECTIONS.ROSTER, sid));
                    if (rsnap.exists()) info = rsnap.data();
                } catch (err) { console.error("名冊查詢失敗", err); return '驗證失敗，請稍後再試'; }
                if (!info) return `名冊中查無學號 ${sid}，請找老師確認名冊`;
                // ★ 本頁不再自己驗證身分。
                //   全站規則：登入與登出只在闖關基地做（見 shared/docs/02_設計規範.md）。
                //   驗證碼已搬到學生讀不到的 secret 集合，這裡本來就讀不到也不該讀。
                if (!trusted) return '請從闖關基地登入後再進入本頁。';

                const classRoom = info.cls, seatNo = String(info.no), name = info.name;
                const docId = `${classRoom}_${seatNo}_${name}`;

                // 載入先前進度
                let loadedProgress = [], loadedDates = {}, loadedUrls = {};
                try {
                    const progressRef = fbStore.doc(fbStore.db, 'artifacts', 'comp-think-app', 'public', 'data', 'progress', docId);
                    const snap = await fbStore.getDoc(progressRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        loadedProgress = data.completed || [];
                        loadedDates = data.completionDates || {};
                        loadedUrls = data.certificateUrls || {};
                        Object.keys(data).forEach(key => {
                            if (key.startsWith('completionDates.')) loadedDates[key.split('.')[1]] = data[key];
                            if (key.startsWith('certificateUrls.')) loadedUrls[key.split('.')[1]] = data[key];
                        });
                    }
                } catch (err) { console.error("讀取進度失敗:", err); }

                // 依目前完成數同步統一進度的星數（每小關 3 星），讓舊資料也套用新規則
                if (loadedProgress.length > 0) {
                    const cnt = loadedProgress.length;
                    fbStore.setDoc(fbStore.doc(fbStore.db, '11501-progress', sid), {
                        studentId: sid,
                        modules: { thinking: { status: cnt >= 10 ? 'pass' : 'in-progress', level: cnt, stars: window.GRADING.thinkingStars(cnt), source: 'auto', updatedAt: Date.now() } },
                        updatedAt: Date.now()
                    }, { merge: true }).catch(e => console.error('同步統一進度失敗', e));
                }

                sessionStorage.setItem('sid11501', sid);
                setUser({ classRoom, seatNo, name, docId, sid });
                setCompletedChallenges(loadedProgress);
                setCompletedDates(loadedDates);
                setCertificateUrls(loadedUrls);
                setStudyTime(0);
                return null;
            };


            /* ══════════════════════════════════════════════════════
               「關機也不白跑」的最後一哩
               ══════════════════════════════════════════════════════
               ⚠️⚠️ 2026-09-02：後端判定通過之後，**成績是這一頁寫進 Firestore 的**。
                  學生一關機（或關掉分頁、換一台電腦），辨識白跑、
                  截圖存了、成績卻沒記 —— 他回來只能重傳、再排一次隊。
                  ★ 號碼牌制讓「中途離開」從意外變成常態，所以非補不可。
               ⇒ 登入完成後問後端「我過了哪幾關」，把本地沒記的補回來。
               ★★ 補記走的是既有的 handleChallengeComplete，**不另寫一套**：
                  星星怎麼算、要寫哪幾份文件，全部只有那一份邏輯。
                  另寫一套的話，兩邊遲早會給出不一樣的成績。
               ⚠️ 不依賴 localStorage —— 教室電腦有還原卡，關機就重置。
                  這條路只認學號，換一台電腦登入照樣補得回來。
               ⚠️ 後端沒開就安靜跳過（下次登入再補），不可以擋住上課。 */
            useEffect(() => {
                if (!user || !user.sid || !fbStore.db) return;
                let alive = true;
                (async () => {
                    try {
                        const base = (window.CONFIG && window.CONFIG.SERVER_URL) || '';
                        if (!base) return;
                        const term = (window.CONFIG && window.CONFIG.TERM) || '11501';
                        const ctl = new AbortController();
                        const t = setTimeout(() => ctl.abort(), 8000);
                        let list = [], urls = {};
                        try {
                            const r = await fetch(base + '/api/my-passed?student_id='
                                + encodeURIComponent(user.sid) + '&term=' + encodeURIComponent(term),
                                { headers: { 'ngrok-skip-browser-warning': '1' },
                                  cache: 'no-store', signal: ctl.signal });
                            const j = await r.json();
                            list = (j && Array.isArray(j.passed)) ? j.passed : [];
                            urls = (j && j.urls && typeof j.urls === 'object') ? j.urls : {};
                        } finally { clearTimeout(t); }
                        if (!alive || !list.length) return;

                        /* 後端說過了、本地卻沒記的，才要補 */
                        const mine = new Set(completedChallenges.map(String));
                        const missing = list.filter(id => !mine.has(String(id)));

                        /* ══════════════════════════════════════════════
                           自我修復：已經記了通關、但證書少一張圖的那些
                           ══════════════════════════════════════════════
                           ⚠️⚠️ 2026-09-03 老師問：「為什麼有些學生的通關證書
                              沒有截圖？」★ 上面那行 missing 只挑「本地沒記過」
                              的關卡 —— 一旦某一關被記成「通關但沒有圖」
                              （例如當初後端還拿不到班級座號、圖沒傳成功，
                              或補記時後端手上還沒有網址），它就永遠落在
                              missing 之外，**再也沒有人回頭補那張圖**。
                           ⇒ 後端有網址、而這裡沒有的，就把網址補回去。
                           ⚠️ 只補網址，**不動**通關清單和完成日期
                              （那兩個維持「保留第一次」）。
                           ⚠️ 後端也沒有網址的**不代表圖不在** —— 2026-09-03 老師實測：
                              某位學生第 4 關的圖確實在雲端硬碟裡，只是兩邊都沒記到
                              那個 fileId。⇒ 那種要靠下面第三段（直接問 GAS）。 */
                        const needUrl = list.filter(id =>
                            mine.has(String(id)) && urls[String(id)] && !(certificateUrls && certificateUrls[String(id)]));

                        /* ⚠️⚠️ 這裡**不可以**寫成
                             if (!missing.length && !needUrl.length) return;
                           那樣會讓下面「去雲端硬碟找回網址」永遠跑不到 ——
                           而老師 2026-09-03 遇到的正是那種：五關都已經記在本地、
                           後端的 urls 又是空的 ⇒ missing 和 needUrl 都是 0，
                           直接就 return 了，可是圖明明在雲端硬碟裡。
                           ⇒ 三件事各自判斷，缺哪個補哪個。
                           ★ have：這一輪之內已經補上的也要算進去，
                             不然同一批網址會被查兩次（setState 是非同步的，
                             這個閉包裡的 certificateUrls 不會即時更新）。 */
                        const have = Object.assign({}, certificateUrls || {});

                        for (const id of missing) {
                            if (!alive) return;
                            /* ⚠️ 關卡編號要還原成和本地同型別，不然
                               completedChallenges.includes() 會判不出來、重複補。 */
                            const cid = Number(id);
                            if (!Number.isFinite(cid)) continue;
                            /* ⚠️ 截圖不在手上（那正是「中途離開」的定義），
                               所以 base64 傳 null —— 後端已經把圖傳到雲端硬碟了，
                               這裡缺的只是 Firestore 裡的那個網址。 */
                            /* ★ 截圖網址：後端在上傳成功時記下來的。
                               沒有它，證書上那一塊只會是一個虛線空框 ——
                               圖其實在雲端硬碟裡，只是 Firestore 沒有那個連結。 */
                            await handleChallengeComplete(
                                cid, new Date().toISOString().slice(0, 10), null,
                                '（上次未完成的驗證，系統自動補記）',
                                urls[String(id)] || null);
                        }
                        if (alive) {
                            console.log('[補記] 補上 ' + missing.length + ' 關');
                        }

                        /* ★ 把後端記得、這裡缺的那幾張網址補回 Firestore。
                           冪等：值一樣就等於沒改，重複跑不會有副作用。 */
                        if (needUrl.length && fbStore.db && user) {
                            try {
                                const patch = {};
                                needUrl.forEach(id => { patch[String(id)] = urls[String(id)]; });
                                await fbStore.setDoc(
                                    fbStore.doc(fbStore.db, 'artifacts', 'comp-think-app',
                                                'public', 'data', 'progress', user.docId),
                                    { certificateUrls: patch,
                                      lastUpdated: new Date().toISOString() },
                                    { merge: true });
                                setCertificateUrls(prev => ({ ...prev, ...patch }));
                                Object.assign(have, patch);      // ★ 這一輪已補的也要算
                                console.log('[證書] 補回', needUrl.length, '張截圖網址');
                            } catch (e) {
                                /* 補不了就算了 —— 這是修補，不可以擋住上課 */
                            }
                        }

                        /* ══════════════════════════════════════════════
                           最後一道：直接去雲端硬碟把網址找回來
                           ══════════════════════════════════════════════
                           ⚠️⚠️ 2026-09-03 老師實測：某位學生 passed 有
                              2,3,4,5,6 五關，urls 卻只有第 6 關 ——
                              而那幾關的圖**確實在雲端硬碟裡**。
                           ★ 後端的 urls 是 record_ocr_pass 在 2026-09-02
                             之後才開始寫的，更早通關的、或當初後端拿不到
                             班級座號沒上傳成功的，那份紀錄裡都沒有網址。
                             ⇒ 拿後端的紀錄去補，救不了舊資料。
                           ★ 但路徑是固定的（<根>/學期/thinking/班級/座號/關卡.png），
                             缺的只是 Drive 隨機給的 fileId ⇒ 問 GAS 就有。
                           ⚠️ **一次查整格**，一位學生只花一次 GAS 額度
                              （Apps Script 每天只有約 90 分鐘）。
                           ⚠️ 而且只在「真的還缺」的時候才查 —— 不缺就一次都不打。 */
                        const stillMissing = completedChallenges.filter(
                            cid => !have[String(cid)]);
                        if (stillMissing.length && window.CONFIG.GAS_UPLOAD_URL
                            && user.classRoom && user.seatNo) {
                            try {
                                const fr = await fetch(window.CONFIG.GAS_UPLOAD_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify({
                                        kind: 'find', key: window.CONFIG.GAS_UPLOAD_KEY,
                                        term: term, unit: 'screenshot',
                                        classRoom: user.classRoom, seatNo: user.seatNo
                                    })
                                });
                                const fj = await fr.json();
                                const found = (fj && fj.success && fj.urls) ? fj.urls : {};
                                const patch2 = {};
                                stillMissing.forEach(cid => {
                                    if (found[String(cid)]) patch2[String(cid)] = found[String(cid)];
                                });
                                if (Object.keys(patch2).length) {
                                    await fbStore.setDoc(
                                        fbStore.doc(fbStore.db, 'artifacts', 'comp-think-app',
                                                    'public', 'data', 'progress', user.docId),
                                        { certificateUrls: patch2,
                                          lastUpdated: new Date().toISOString() },
                                        { merge: true });
                                    setCertificateUrls(prev => ({ ...prev, ...patch2 }));
                                    console.log('[證書] 從雲端硬碟找回', Object.keys(patch2).length, '張');
                                }
                                /* ★ 查完還是沒有的，就是**雲端上真的沒有那張圖** ——
                                   只能請學生重傳。印出來讓老師查得到是哪幾關。 */
                                const reallyGone = stillMissing.filter(cid => !found[String(cid)]);
                                if (reallyGone.length) {
                                    console.warn('[證書] 雲端硬碟也沒有這幾關的圖，需要重傳：', reallyGone);
                                }
                            } catch (e) {
                                /* 查不到就算了 —— 這是修補，不可以擋住上課 */
                            }
                        }
                    } catch (e) {
                        /* 後端沒開、連不上、回傳格式怪 —— 都安靜跳過。
                           ⚠️ 這是附加保障，絕對不可以擋住學生上課。 */
                    }
                })();
                return () => { alive = false; };
            }, [user && user.sid]);

            // 本頁的登入表單已停用：一律導回闖關基地，登入後自動跳回來。
            const handleLogin = async (e) => {
                e.preventDefault();
                if (window.SSO) SSO.toHub('thinking 不自行登入');
                else location.href = (window.CONFIG && CONFIG.HUB_PAGE) || 'hub.html';
            };

            // SSO：掛載時若 hub 已存學號則自動登入（信任 localStorage）
            useEffect(() => {
                const saved = sessionStorage.getItem('sid11501');
                if (saved && /^14\d{5}$/.test(saved)) {
                    setLoading(true);
                    doSidLogin(saved, '', '', true).then(err => { if (err) setLoading(false); });
                }
            }, []);


            const handleOpenChallenge = (challenge) => {
                setSelectedChallenge(challenge);
                const width = 1024;
                const height = 768;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                
                window.open(
                    challenge.url,
                    `Challenge_${challenge.id}`,
                    `width=${width},height=${height},top=${top},left=${left},toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes`
                );
            };

            if (!user && loading) {
                return (
                    <div className="min-h-full bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center p-4 font-sans">
                        <div className="bg-white rounded-2xl shadow-xl p-10 text-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-4 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-indigo-600 font-bold">登入中…</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-full bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center p-4 font-sans relative">
                        {showQueryModal && <QueryModal onClose={() => setShowQueryModal(false)} classes={classes} />}
                        
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden z-10">
                            <div className="bg-indigo-600 p-6 text-center">
                                <Icons.Monitor className="w-12 h-12 text-white mx-auto mb-2" />
                                <h1 className="text-2xl font-bold text-white"><span className="underline-doodle">運算思維挑戰平台</span></h1>
                                <p className="text-indigo-200 text-sm mt-1">學生登入系統</p>
                            </div>
                            
                            <form onSubmit={handleLogin} className="p-8 space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">學號 (Student ID)</label>
                                    <input type="text" name="sid" inputMode="numeric" maxLength="7" required placeholder="14XXXXX" className="w-full border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-3 border bg-slate-50 outline-none font-mono tracking-widest"/>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">姓名 <span className="text-slate-400 font-normal">（首次登入才需要）</span></label>
                                    <input type="text" name="sname" placeholder="首次登入請輸入姓名" className="w-full border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-3 border bg-slate-50 outline-none"/>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">驗證碼 (Code)</label>
                                    <div className="relative">
                                        <input type="password" name="code" inputMode="numeric" maxLength="6" placeholder="6 位數字（首次登入請自訂）" className="w-full border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-3 pr-12 border bg-slate-50 outline-none font-mono tracking-widest"/>
                                        <button type="button" tabIndex={-1} onClick={(e) => { const i = e.currentTarget.parentNode.querySelector('input'); const s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.currentTarget.textContent = s ? '🙈' : '👁'; }} className="absolute right-3 top-1/2 -translate-y-1/2 text-xl text-slate-400 hover:text-slate-600" aria-label="顯示或隱藏驗證碼">👁</button>
                                    </div>
                                </div>

                                {loginError && <p className="text-red-500 text-sm font-medium">{loginError}</p>}

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className={`w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors ${loading ? 'opacity-70 cursor-wait' : ''}`}
                                >
                                    {loading ? '載入雲端進度中...' : '開始挑戰'}
                                </button>
                            </form>
                        </div>
                        <div className="absolute bottom-6 w-full text-center text-sm text-indigo-800/60 font-medium tracking-widest">
                            一一五學年度上學期八年級
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-full bg-slate-100 flex flex-col font-sans relative">
                    {/* ⚠️ 2026-09-03 起**不傳 challenge**：關卡由截圖檔名判定。
                        傳整份 challenges 是給它兩件事用的：認關卡、把排隊清單
                        裡的檔名翻成關卡名。⇒ 對照表仍然只有這一份。 */}
                    {showCertModal && <CertVerificationModal onClose={() => setShowCertModal(false)} user={user} challenges={challenges} studyTime={studyTime} onComplete={handleChallengeComplete} onOpenCerts={() => setShowMyCertsModal(true)} />}
                    
                    {showMyCertsModal && <MyCertificatesModal onClose={() => setShowMyCertsModal(false)} user={user} completedChallenges={completedChallenges} completedDates={completedDates} certificateUrls={certificateUrls} challenges={challenges} />}
                    
                    {showQueryModal && <QueryModal onClose={() => setShowQueryModal(false)} userClass={user.classRoom} />}

                    {/* 登出彈窗已移除：登入／登出統一由闖關基地處理 */}

                    <header className="bg-white shadow-sm z-10 shrink-0">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                                <div className="bg-indigo-600 p-2 rounded-lg"><Icons.Award className="w-6 h-6 text-white" /></div>
                                <span className="text-xl font-bold text-slate-800 hidden sm:block"><span className="underline-doodle px-1">運算思維挑戰</span></span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowQueryModal(true)} className="text-indigo-600 hover:text-indigo-800 transition-colors flex items-center text-sm font-medium px-4 py-2 rounded-md hover:bg-indigo-50">
                                    <i className="fa-solid fa-users mr-2"></i>班級進度
                                </button>
                                {/* 返回基地由左上角的共用浮動按鈕提供，這裡不再重複；登出統一在闖關基地處理 */}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col lg:flex-row gap-6 overflow-hidden">
                        <aside className="w-full lg:w-1/3 xl:w-1/4 flex flex-col gap-4 h-full">
                            <div className="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col h-full border border-slate-200">
                                <div className="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
                                    <h2 className="font-bold text-slate-700 flex items-center">
                                        <Icons.BookOpen className="w-5 h-5 mr-2 text-indigo-500" />挑戰清單
                                    </h2>
                                    <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-medium">共 {challenges.length} 題</span>
                                </div>
                                <div className="overflow-y-auto p-2 space-y-2 flex-1">
                                    {challenges.map((challenge) => (
                                        <button
                                            key={challenge.id}
                                            onClick={() => handleOpenChallenge(challenge)}
                                            className={`w-full text-left p-4 rounded-lg transition-all duration-200 flex items-center justify-between group ${selectedChallenge?.id === challenge.id ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-indigo-50 text-slate-700'}`}
                                        >
                                            <div>
                                                <div className={`font-bold text-lg sm:text-xl ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-slate-800'}`}>
                                                    {challenge.id}. {challenge.title}
                                                    {completedChallenges.includes(challenge.id) && (
                                                        <i className={`fa-solid fa-circle-check ml-2 ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-emerald-500'}`} title="已通關"></i>
                                                    )}
                                                </div>
                                                <div className="text-sm mt-1 flex items-center">
                                                    <span className={`${selectedChallenge?.id === challenge.id ? 'text-indigo-200' : 'text-slate-400'} mr-1`}>難度:</span>
                                                    <span className={`font-bold text-lg ${selectedChallenge?.id === challenge.id ? 'text-yellow-300' : getDifficultyColor(challenge.difficulty)}`}>{challenge.difficulty}</span>
                                                </div>
                                            </div>
                                            <Icons.Play className={`w-6 h-6 ${selectedChallenge?.id === challenge.id ? 'text-white' : 'text-slate-300 group-hover:text-indigo-400'}`} />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        <section className="flex-1 flex flex-col gap-4 h-full">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 shrink-0">
                                <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div className="flex items-center space-x-4">
                                        <div className="bg-indigo-100 p-3 rounded-full"><Icons.User className="w-8 h-8 text-indigo-600" /></div>
                                        <div>
                                            <h2 className="text-2xl font-bold text-slate-800">{user.name}</h2>
                                            <div className="text-slate-500 flex items-center mt-1">
                                                <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-sm font-medium mr-2">{user.classRoom} 班</span>
                                                <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-sm font-medium mr-2">{user.seatNo} 號</span>
                                                <span className="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-sm font-medium">進度: {completedChallenges.length}/{challenges.length}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                                        <button 
                                            onClick={() => setShowMyCertsModal(true)}
                                            className="w-full sm:w-auto px-5 py-3 rounded-xl font-bold flex items-center justify-center shadow-md transition-all bg-amber-500 hover:bg-amber-600 text-white transform hover:scale-105"
                                        >
                                            <i className="fa-solid fa-trophy text-xl mr-2"></i> 我的證書
                                        </button>
                                        {/* ⚠️⚠️ 2026-09-03：這顆按鈕以前要「先選關卡」才會亮。
                                            現在關卡由截圖檔名判定，**不必先選** ——
                                            學生打完一關直接來傳圖就好。
                                            ★ 順手修掉一個舊坑：學生常在別的分頁打完關卡回來，
                                              左邊其實沒選任何東西，於是被 alert 擋住，
                                              而那句話（「請先選擇關卡」）跟他要做的事無關。 */}
                                        <button 
                                            onClick={() => setShowCertModal(true)} 
                                            className="w-full sm:w-auto px-5 py-3 rounded-xl font-bold flex items-center justify-center shadow-md transition-all bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white transform hover:scale-105"
                                        >
                                            <i className="fa-solid fa-award text-xl mr-2"></i> 證書製作
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 relative overflow-hidden flex items-center justify-center min-h-[200px]">
                                {selectedChallenge ? (
                                    <div className="text-center text-slate-500 p-8">
                                        <div className="bg-indigo-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6"><Icons.Monitor className="w-12 h-12 text-indigo-400" /></div>
                                        <p className="text-lg mb-4">挑戰 <span className="font-bold text-indigo-600">「{selectedChallenge.title}」</span> 正在執行...</p>
                                        
                                        {/* 統計人數顯示區塊 */}
                                        {classPassCount !== null && (
                                            <div className="inline-flex items-center justify-center space-x-2 bg-emerald-50 text-emerald-700 px-5 py-2 rounded-full text-sm font-medium border border-emerald-200 mb-6 animate-[fadeIn_0.3s_ease-out] shadow-sm">
                                                <i className="fa-solid fa-fire text-emerald-500"></i>
                                                <span>本班已通關：<span className="font-bold text-xl mx-1">{classPassCount}</span> 人</span>
                                            </div>
                                        )}
                                        
                                        <div className="block">
                                            <button onClick={() => handleOpenChallenge(selectedChallenge)} className="px-6 py-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-full font-medium transition-colors text-sm">點此重新開啟視窗</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center text-slate-400">
                                        <Icons.BookOpen className="w-16 h-16 mx-auto mb-4 text-slate-200" />
                                        <div className="text-lg font-medium text-slate-500">請選擇左側挑戰開始學習</div>
                                    </div>
                                )}
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0">
                                <div className="flex items-center space-x-3">
                                    <Icons.Calendar className="w-6 h-6 text-indigo-500" />
                                    <div>
                                        <div className="text-sm text-slate-500">今天是</div>
                                        <div className="text-lg font-bold text-slate-800">{formatDate(currentDate)}</div>
                                    </div>
                                </div>
                                <div className="h-px w-full sm:h-10 sm:w-px bg-slate-200"></div>
                                <div className="flex items-center space-x-3">
                                    <Icons.Timer className="w-6 h-6 text-orange-500" />
                                    <div className="text-right">
                                        <div className="text-sm text-slate-500 text-left sm:text-right">本次學習時間</div>
                                        <div className="text-2xl font-mono font-bold text-indigo-600">{formatTime(studyTime)}</div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="bg-white py-3 border-t border-slate-200 shrink-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500 font-medium tracking-widest">
                            一一五學年度上學期八年級
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

<!-- 返回基地按鈕（自動加入） -->
<a id="back-to-hub" href="hub.html" title="返回闖關基地"
   style="position:fixed;top:14px;left:14px;z-index:99999;display:inline-flex;align-items:center;gap:6px;background:#1e293b;color:#fff;font-family:'Noto Sans TC',system-ui,sans-serif;font-weight:700;font-size:14px;padding:8px 14px;border-radius:9999px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .15s;" onmouseover="this.style.transform='translateX(-2px)'" onmouseout="this.style.transform=''">← 返回基地</a>
</body>
