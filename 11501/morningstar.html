<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>晨星勇者｜115學年上學期</title>
<!-- =====================================================================
     晨星勇者（11501 程式設計：完成十關之後開放的獎勵遊戲）
     ---------------------------------------------------------------------
     ★ 老師 2026-10-09 整合進 course_115。遊戲本體照原作，只改了「存在哪裡」：
       ‧ 存檔、新手訓練完成、觀念卡收集、通關紀錄 → 學生自己的
         {學期}-progress/{學號} 的 games.morningstar（shared/gamesave.js）。
       ‧ 只用雲端（老師的決定）：不再用 localStorage 存進度。
         ⚠️ 唯一還留在 localStorage 的是「程式觀念提示：開／關」——
            那是這台電腦的顯示偏好，不是學生的紀錄。
       ‧ 不算星、不進成績（games 不在 modules 底下，report.js 的 totalStars 加不到它）。
       ‧ 開放條件：10 個單元都通關（GRADING.GATE.cleared，和依序開放同一套），
         直接貼網址進來也一樣擋（這一頁自己再查一次）。
     ★ 刻意的設計，不要改回去（老師交代）：
       背包是真正的清單（bagDel 刪除後面往前補、「插到第 1 格」＝插入）；
       倒下時三件裝備掉在原地可撿回、金幣少一半撿不回來；
       掉落的裝備沒撿就走向出口會先確認；觀念卡在玩法「發生之後」才出現，
       單元 3 演奏小星星、單元 6 撲克發牌刻意沒做；用語照 whatislist.html
       和 content/flowchart.js；升級經驗一級比一級多、打怪經驗倍率 3/(Lv+2)。
     ⚠️ 原作的 window.__game 測試掛鉤、編輯器熱重載（window.claude.hot）已拿掉。
     ===================================================================== -->
<!-- 全站共用設定（要在 guard 之前載入）-->
<script src="config.js"></script>
<script src="../shared/semester.js"></script>
<!-- 登入邏輯單一來源（不要蓋掉 Google 身分）-->
<script src="../shared/auth.js"></script>
<!-- 身分守門：未從闖關基地登入者導回入口 -->
<script src="../shared/guard.js"></script>
<!-- 開放條件要用的：依序開放的規則、十個單元 -->
<script src="../shared/grading.js"></script>
<script src="content/flowchart.js"></script>
<!-- 存檔（雲端） -->
<script src="../shared/gamesave.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script>
/* 遊戲（一般 script）先跑、雲端連線（module）後跑 —— 中間用這個接起來。 */
window.MS_BRIDGE = (function () { var r; var p = new Promise(function (x) { r = x; }); return { ready: p, resolve: r }; })();
</script>
<script type="module">
  import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  const CFG = window.CONFIG || {};
  const COL = (CFG.COLLECTIONS && CFG.COLLECTIONS.PROGRESS) || '11501-progress';
  const TERM = CFG.TERM || '11501';
  let sid = '';
  try { sid = sessionStorage.getItem('sid' + TERM) || ''; } catch (e) {}
  (async () => {
    try {
      if (!CFG.FIREBASE) throw new Error('這一頁沒有 Firebase 設定');
      if (!/^14\d{5}$/.test(sid)) throw new Error('讀不到學號');
      if (!window.AUTH || !window.AUTH.attachSession) throw new Error('沒有載入 shared/auth.js');
      const app = getApps().length ? getApp() : initializeApp(CFG.FIREBASE);
      const auth = getAuth(app);
      /* ⚠️ 不在這裡登入 —— 學生已經在闖關基地登入過了，這裡只把身分接過來。 */
      await window.AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
      if (!auth.currentUser) throw new Error('還沒登入');
      const ref = doc(getFirestore(app), COL, sid);
      window.MS_BRIDGE.resolve({
        sid,
        readDoc: async () => { const snap = await getDoc(ref); return snap.exists() ? (snap.data() || {}) : {}; },
        /* ⚠️ mergeFields：整欄覆寫 games.morningstar（見 shared/gamesave.js 開頭）。
           只動這一欄 —— 不碰 modules，安全規則的「作品星不可以自己改」那幾條自然照過。 */
        writeGame: rec => setDoc(ref, { studentId: sid, games: { morningstar: rec } },
                                 { mergeFields: ['studentId', 'games.morningstar'] })
      });
    } catch (e) {
      window.MS_BRIDGE.resolve({ error: (e && e.message) || String(e) });
    }
  })();
</script>
</head>
<body>
<style>
/* 版面：整頁就是遊戲畫面；HUD 浮在畫布上，所有面板是「墨綠檀木＋黃銅框」，像一本冒險手札 */
:root{
  color-scheme: dark;
  --ink:#0d1211;
  --panel:#16201d;
  --panel-2:#1e2b27;
  --brass:#c39a57;
  --brass-dim:#5e5137;
  --text:#efe5cc;
  --muted:#a69e88;
  --hp:#d4544a;
  --hp-bg:#3a1d1a;
  --gold:#f0c35a;
  --good:#86c98f;
  --rune:#a184f2;
  --display:"LXGW WenKai TC","Microsoft JhengHei","PingFang TC","Noto Sans TC",serif;
  --ui:"LXGW WenKai TC","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --num:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px;pointer-events:none;z-index:2}
.hud-left{display:grid;gap:6px;min-width:0}
.hprow{display:flex;align-items:center;gap:8px}
.lv{font:700 13px var(--num);color:var(--gold);text-shadow:0 1px 2px #000;white-space:nowrap}
.xpbar{width:min(220px,46vw);height:4px;margin:-3px 0 0 auto;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:#7fb8f0;transition:width .3s}
.hpbar{position:relative;width:min(220px,46vw);height:20px;background:var(--hp-bg);border:1px solid var(--brass);border-radius:3px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.hpfill{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(var(--hp),#a63b33);transition:width .2s}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font:700 12px/1 var(--num);text-shadow:0 1px 0 #000;letter-spacing:.04em}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;text-shadow:0 1px 2px #000}
.stats b{font:700 14px var(--num);font-variant-numeric:tabular-nums}
.stats .g b{color:var(--gold)}
.stats .k b{color:#cfd6e0}
.hud-mid{align-self:center;font-family:var(--display);font-size:15px;color:var(--muted);text-shadow:0 1px 2px #000;white-space:nowrap}
.hud-right{display:flex;gap:6px;pointer-events:auto}
.hud-right button{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px;background:rgba(22,32,29,.85);border:1px solid var(--brass-dim);border-radius:4px;font-size:15px}
.hud-right button:hover{border-color:var(--brass)}
.hud-right .lbl{font-size:13px}
#mini{position:absolute;right:16px;top:56px;z-index:2;border:1px solid var(--brass-dim);background:rgba(0,0,0,.55);border-radius:3px;pointer-events:none;image-rendering:pixelated}
@media (max-width:640px){ .hud-mid{display:none} .hud-right .lbl{display:none} #mini{width:96px!important;height:auto!important} }

#arenaTag,#bossBar{position:absolute;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none}
#arenaTag{top:58px;padding:5px 14px;background:rgba(40,25,70,.85);border:1px solid var(--rune);border-radius:3px;font-size:14px;white-space:nowrap}
#arenaTag b{font-family:var(--num);color:#fff}
#bossBar{top:58px;width:min(420px,calc(100% - 32px));display:grid;gap:4px;text-align:center;font-family:var(--display);font-size:15px;text-shadow:0 1px 2px #000}
#bossBar div{height:12px;background:var(--hp-bg);border:1px solid var(--brass);border-radius:2px;overflow:hidden}
#bossBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8e2a6a,#e0543f);transition:width .15s}

#prompt{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;padding:6px 14px;background:rgba(22,32,29,.92);border:1px solid var(--brass);border-radius:3px;font-size:15px;white-space:nowrap;pointer-events:none}
#prompt kbd{font:700 12px var(--num);padding:1px 6px;border:1px solid var(--brass);border-radius:3px;margin-right:6px;color:var(--gold)}
#toasts{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:grid;justify-items:center;gap:6px;pointer-events:none;width:calc(100% - 32px)}
.toast{padding:6px 14px;background:rgba(10,14,13,.88);border-left:3px solid var(--brass);font-size:15px;max-width:100%;animation:tin .2s ease-out,tout .4s ease-in 2.2s forwards}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
@keyframes tout{to{opacity:0;transform:translateY(-4px)}}

#banner{position:absolute;left:0;right:0;top:30%;z-index:5;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 3.4s ease forwards}
#banner small{display:block;font-size:14px;letter-spacing:.4em;color:var(--brass)}
#banner h2{margin:6px 0;font-family:var(--display);font-size:clamp(30px,7vw,52px);font-weight:700;text-shadow:0 3px 12px #000}
#banner p{margin:0;color:var(--muted);font-size:16px;text-shadow:0 1px 4px #000}
@keyframes ban{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

/* ---------- 觸控 ---------- */
#touch{position:absolute;inset:0;z-index:3;pointer-events:none}
#joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(239,229,204,.25);background:rgba(0,0,0,.18)}
#joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(239,229,204,.35);border:2px solid rgba(239,229,204,.5)}
.tbtns{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;pointer-events:auto}
.tbtns button{border-radius:50%;border:2px solid var(--brass);background:rgba(22,32,29,.8);display:grid;place-items:center;position:relative;touch-action:none}
#tAtk{width:78px;height:78px;font-size:32px;grid-column:2;grid-row:1/3}
#tAct{width:58px;height:58px;font-size:24px;grid-column:1;grid-row:2}
#tPot{width:50px;height:50px;font-size:20px;grid-column:1;grid-row:1;justify-self:end}
#tPot b{position:absolute;right:-4px;bottom:-4px;font:700 11px var(--num);background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:0 4px}
#tAct.ready{border-color:var(--gold);box-shadow:0 0 12px rgba(240,195,90,.5)}
#tAct:not(.ready){opacity:.45}
.touching #prompt{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.touching #toasts{bottom:calc(166px + env(safe-area-inset-bottom,0px))}

/* ---------- 面板 ---------- */
.modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,8,7,.62);padding:16px}
.panel{width:min(430px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--brass);border-radius:4px;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.6);padding:18px 18px 16px}
.panel header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--brass-dim);padding-bottom:10px;margin-bottom:14px}
.panel h3{margin:0;font-family:var(--display);font-size:22px;font-weight:700}
.panel header small{color:var(--muted);font-size:13px}
.x{background:none;border:1px solid var(--brass-dim);border-radius:3px;padding:2px 10px;font-size:14px}
.label{font-size:12px;letter-spacing:.2em;color:var(--brass);margin:0 0 6px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots.eq{margin-bottom:14px}
.slot{position:relative;aspect-ratio:1;max-width:100%;background:var(--panel-2);border:1px solid var(--brass-dim);border-radius:3px;display:grid;place-items:center;font-size:clamp(22px,6vw,30px);padding:0}
.slot[data-r="1"]{box-shadow:inset 0 0 0 2px #4f86b4}
.slot[data-r="2"]{box-shadow:inset 0 0 0 2px #c9a043}
.slot.sel{border-color:var(--gold);background:#2a3a34}
.slot .cap{position:absolute;left:0;right:0;bottom:3px;font-size:11px;color:var(--muted);text-align:center}
.slot.empty{color:var(--brass-dim);font-size:13px}
.slot .no{position:absolute;left:5px;top:3px;font:11px var(--num);color:var(--muted)}
.touching .slot .no{display:none}
.detail{margin-top:14px;min-height:96px;padding:12px;background:rgba(0,0,0,.22);border-radius:3px}
.detail h4{margin:0 0 4px;font-family:var(--display);font-size:18px}
.detail p{margin:4px 0 10px;color:var(--muted);font-size:14px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:12px var(--num);padding:2px 7px;border:1px solid var(--brass-dim);border-radius:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:7px 16px;background:var(--panel-2);border:1px solid var(--brass);border-radius:3px;font-size:15px}
.btn:hover:not(:disabled){background:#2b3b35}
.btn.primary{background:#6b5323;border-color:var(--gold)}
.btn.primary:hover:not(:disabled){background:#806328}
.btn:disabled{opacity:.4;cursor:default}
.sum{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.sum b{color:var(--text);font-family:var(--num)}
.shoprow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(195,154,87,.18)}
.shoprow .ic{font-size:28px;text-align:center}
.shoprow h4{margin:0;font-size:16px}
.shoprow p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.price{font:700 14px var(--num);color:var(--gold)}
.tabs{display:flex;gap:6px;margin:-4px 0 6px}
.tabs button{flex:1;padding:7px 0;background:transparent;border:1px solid var(--brass-dim);border-radius:3px;font-size:15px;color:var(--muted)}
.tabs button.on{background:var(--panel-2);border-color:var(--brass);color:var(--text)}
.cmp{margin:6px 0 10px;font-size:14px;color:var(--muted)}
.cmp b{font-family:var(--num)}
.up{color:var(--good)} .down{color:var(--hp)}
.gear{display:flex;gap:4px;pointer-events:auto}
.gear button{width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:17px;background:rgba(22,32,29,.85);border:1px solid var(--brass-dim);border-radius:3px}
.gear button.none{font-size:11px;color:var(--brass-dim)}
.gear button:hover{border-color:var(--brass)}
/* 程式觀念卡 */
.ccard .eyebrow{margin:0;font-size:12px;letter-spacing:.2em;color:var(--rune)}
.ccard h3{margin:4px 0 2px;font-family:var(--display);font-size:26px}
.ccard .topic{margin:0 0 12px;color:var(--muted);font-size:14px}
.ccard .what{margin:0 0 14px;font-size:16px;line-height:1.75}
.blocks{display:grid;gap:5px;padding:12px;background:#f4f1ea;border-radius:4px;margin-bottom:16px;overflow-x:auto}
.blocks .cap{font-size:12px;color:#6b6457;letter-spacing:.1em;margin-bottom:2px}
.blk{justify-self:start;padding:6px 12px;border-radius:6px;color:#fff;font-size:15px;line-height:1.4;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.blk.in{margin-left:22px}
.blk.list{background:#e35b12}.blk.var{background:#e07b0e}.blk.ctrl{background:#c98a0b}.blk.sense{background:#3a93bf}.blk.op{background:#3e9a3e}
.codex{display:grid;gap:10px;text-align:left;margin:16px 0 20px}
.codex .unit{padding:10px 12px;border:1px solid var(--brass-dim);border-radius:3px;background:rgba(0,0,0,.25)}
.codex h4{margin:0 0 8px;font-size:15px}
.codex h4 small{color:var(--muted);font-weight:400;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 12px;border:1px solid var(--rune);border-radius:12px;background:rgba(161,132,242,.15);font-size:14px}
.chip:disabled{border-color:var(--brass-dim);background:none;color:var(--brass-dim);cursor:default}
.muted{color:var(--muted);font-size:13px;margin:0}
.toggle{background:none;border:1px solid var(--brass-dim);border-radius:3px;padding:5px 12px;font-size:13px;color:var(--muted)}

/* 對話框 */
#dialog{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(640px,calc(100% - 32px));z-index:9;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;padding:16px 18px;background:var(--panel);border:1px solid var(--brass);border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.6);cursor:pointer}
#dialog .face{font-size:42px;line-height:56px;text-align:center;background:var(--panel-2);border-radius:3px}
#dialog .who{font-family:var(--display);color:var(--brass);font-size:15px;margin-bottom:4px}
#dialog .say{font-size:17px;line-height:1.7;min-height:3.4em;text-wrap:pretty}
#dialog .next{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}

/* 標題與結算畫面 */
#screen{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 35%,rgba(48,40,72,.55),rgba(8,10,10,.94) 70%);overflow:auto}
.card{width:min(560px,100%);text-align:center}
.card .eyebrow{font-size:13px;letter-spacing:.35em;color:var(--brass);margin:0}
.card h1{margin:8px 0 6px;font-family:var(--display);font-weight:700;font-size:clamp(46px,12vw,84px);line-height:1;text-shadow:0 0 30px rgba(240,195,90,.35),0 4px 0 #000;letter-spacing:.06em}
.card h1 .star{color:var(--gold)}
.card h2{margin:6px 0;font-family:var(--display);font-size:clamp(30px,7vw,44px)}
.card .lead{margin:12px auto 20px;max-width:30em;font-size:16px;line-height:1.8;color:var(--text);text-wrap:pretty}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 auto 22px;max-width:440px;font-size:13px;color:var(--muted)}
.keys div{padding:8px 4px;border:1px solid var(--brass-dim);border-radius:3px;background:rgba(0,0,0,.25)}
.keys kbd{display:block;font:700 13px var(--num);color:var(--text);margin-bottom:2px}
.card .acts{justify-content:center}
.card .btn{padding:10px 24px;font-size:17px}
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px auto 22px;max-width:360px}
.result div{padding:10px;border:1px solid var(--brass-dim);border-radius:3px;background:rgba(0,0,0,.25);font-size:13px;color:var(--muted)}
.result b{display:block;font:700 22px var(--num);color:var(--text);font-variant-numeric:tabular-nums}

function solidAt(tx, ty, mode) {

}

    const ox = sy ? off : 0, oy = sx ? off : 0;

/* ================= 更新 ================= */
function update(dt) {
  P.time += dt;
  G.shake = Math.max(0, G.shake - dt);
  updatePlayer(dt);
  updateEnemies(dt);
  updateProjs(dt);
  updateDrops(dt);
  for (const f of G.fx) { f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .92; f.vy *= .92; }
  G.fx = G.fx.filter(f => f.life > 0);
  for (const x of G.texts) { x.life -= dt; x.y -= 28 * dt; }
  G.texts = G.texts.filter(x => x.life > 0);
  for (const o of G.objs) if (o.open && o.fade > 0) o.fade -= dt * 2;
  G.enemies = G.enemies.filter(e => !e.dead);
  checkArenas();
  checkExit();
  const t = camTarget();
  G.cam.x += (t.x - G.cam.x) * Math.min(1, dt * 8);
  G.cam.y += (t.y - G.cam.y) * Math.min(1, dt * 8);
  reveal();
}

function updatePlayer(dt) {
  let mx = 0, my = 0;
  const k = input.keys;
  if (k.has('ArrowLeft') || k.has('KeyA')) mx -= 1;
  if (k.has('ArrowRight') || k.has('KeyD')) mx += 1;
  if (k.has('ArrowUp') || k.has('KeyW')) my -= 1;
  if (k.has('ArrowDown') || k.has('KeyS')) my += 1;
  mx += input.joy.x; my += input.joy.y;
  let len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; len = 1; }
  if (len > .2) { P.dir = {x:mx / len, y:my / len}; P.walk += dt * 11; } else P.walk = 0;
  const sp = 132;
  move(P, (mx * sp + P.kbx) * dt, (my * sp + P.kby) * dt, 'walk', true);
  P.kbx -= P.kbx * Math.min(1, dt * 10); P.kby -= P.kby * Math.min(1, dt * 10);
  P.atkCd -= dt; P.inv -= dt;
  if (P.swing > 0) { P.swing -= dt; meleeHits(); }

    const kb = e.F.boss ? 60 : e.type === 'n' ? 110 : 230;
    e.kbx = dir.x * kb; e.kby = dir.y * kb; e.stun = e.F.boss ? 0 : .18;
    if (e.state === 1 && !e.F.boss) e.state = 0;
  }
  text(e.x, e.y - e.r - 6, '-' + d, '#fff');
  burst(e.x, e.y, 4, '#fff6d8');
  sfx('hit');
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true; P.kills++; G.kills++;
  const col = e.type === 's' ? G.A.pal.slime : e.F.nest ? '#b9a0ff' : '#d8d2c4';
  burst(e.x, e.y, e.F.boss ? 60 : 14, col);
  if (e.parent) e.parent.kids--;
  gainXp(e.parent ? 0 : (e.F.xp || 0) * (e.F.fixed ? 1 : 1 + .5 * G.lvl), e.x, e.y, !!e.parent);
  const [g0, g1] = e.F.gold;
  let g = randi(g0, g1) + (e.F.fixed ? 0 : G.lvl);
  const coins = Math.min(g, 6);
  for (let i = 0; i < coins; i++) dropCoin(e.x, e.y, Math.ceil(g / coins));
  if (!e.F.nest && !e.F.dummy && Math.random() < .12) G.drops.push({kind:'heart', x:e.x, y:e.y, vx:rand(-40,40), vy:rand(-40,40), z:0, vz:120, t:0});
  if (e.F.nest) { toast('召喚陣被打壞了！'); sfx('gate'); }
  else sfx('pop');
  if (e.F.boss) win();
}
// 升級：每升一級最大生命 +2，並且補滿
// 升級越來越難：需要的經驗一級比一級多，等級越高打怪拿到的經驗也越少
const needXp = lv => 6 + 4 * lv;
const xpRate = lv => 3 / (lv + 2);          // Lv1 100%、Lv2 75%、Lv3 60%、Lv4 50%……
function gainXp(base, x, y, minion) {
  if (!base && !minion) return;
  const n = minion ? 1 : Math.max(1, Math.round(base * xpRate(P.lv)));
  P.xp += n;
  text(x, y - 26, `+${n} 經驗`, '#9fd0ff');
  let up = 0;
  while (P.xp >= needXp(P.lv)) { P.xp -= needXp(P.lv); P.lv++; P.maxHp += 2; up++; }
  if (up) {
    P.hp = P.maxHp;
    burst(P.x, P.y, 26, '#f0c35a'); text(P.x, P.y - 34, `升級！Lv ${P.lv}`, '#f0c35a', true);
    toast(`升到 Lv ${P.lv}！最大生命 +${up * 2}，生命回滿。`); sfx('level'); learn('judge');
  }
}
function dropCoin(x, y, v, still) {
  G.drops.push({kind:'coin', x, y, v, vx:still ? 0 : rand(-60, 60), vy:still ? 0 : rand(-60, 60), z:0, vz:still ? 0 : rand(90, 150), t:0});
}

function updateEnemies(dt) {
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (d > 20 * T && !e.F.boss) continue;
    e.flash -= dt; e.anim += dt; e.cd -= dt; e.t -= dt;
    const aggro = d < e.F.aggro * T && P.hp > 0 && !G.won;
    let vx = 0, vy = 0;
    if (e.stun > 0) e.stun -= dt;
    else switch (e.type) {
      case 's': {
        if (e.t <= 0) {
          e.t = rand(.7, 1.1);
          const a = aggro ? Math.atan2(dy, dx) + rand(-.3, .3) : rand(0, 6.28);
          const m = aggro ? 2.4 : 1.1;
          e.hx = Math.cos(a) * e.spd * m; e.hy = Math.sin(a) * e.spd * m;
        }
        e.hx -= e.hx * Math.min(1, dt * 3.2); e.hy -= e.hy * Math.min(1, dt * 3.2);
        vx = e.hx; vy = e.hy; break;
      }
      case 'b':
        if (aggro) { const a = Math.atan2(dy, dx) + Math.sin(e.anim * 5) * .9; vx = Math.cos(a) * e.spd; vy = Math.sin(a) * e.spd; }
        else { vx = Math.cos(e.anim * 1.3 + e.sx) * 26; vy = Math.sin(e.anim * 1.7) * 26; }
        break;
      case 'p': case 'n': {
        const range = e.type === 'p' ? 3.2 : 3, dash = e.type === 'p' ? 270 : 230, wind = e.type === 'p' ? .38 : .6;
        if (e.state === 0) {
          if (aggro) { vx = dx / d * e.spd; vy = dy / d * e.spd; }
          if (aggro && d < range * T && e.cd <= 0) { e.state = 1; e.t = wind; e.dx = dx / d; e.dy = dy / d; }
        } else if (e.state === 1) { if (e.t <= 0) { e.state = 2; e.t = .32; } }
        else { vx = e.dx * dash; vy = e.dy * dash; if (e.t <= 0) { e.state = 0; e.cd = rand(1.6, 2.4); } }
        break;
      }
      case 'k':
        if (aggro) {
          const m = d < 3.2 * T ? -1 : d > 5 * T ? 1 : 0, sw = Math.sin(e.anim * 1.2) * .6;
          vx = (dx / d * m - dy / d * sw) * e.spd; vy = (dy / d * m + dx / d * sw) * e.spd;
          if (e.cd <= 0) { e.cd = rand(1.8, 2.6); const sp = 170; G.projs.push({kind:'bone', owner:'e', x:e.x, y:e.y, vx:dx / d * sp, vy:dy / d * sp, r:6, dmg:e.atk, life:3}); }
        }
        break;
      case 'g':
        if (aggro) { vx = dx / d * e.spd; vy = dy / d * e.spd; }
        else { vx = Math.cos(e.anim * .7 + e.sy) * 15; vy = Math.sin(e.anim * .9) * 15; }
        break;
      case 'O':
        if (aggro && e.cd <= 0 && e.kids < G.A.kidCap) {
          e.cd = 3.2;
          const a = rand(0, 6.28), nx = e.x + Math.cos(a) * 26, ny = e.y + Math.sin(a) * 26;
          const kid = makeEnemy(G.A.nestKid, nx, ny);
          if (!blocked(nx, ny, kid.r, 'walk')) { kid.arena = e.arena; kid.parent = e; e.kids++; G.enemies.push(kid); burst(nx, ny, 8, '#b9a0ff'); if (seesClone(e, d)) learn('clone'); }
        }
        break;
      case 'B': bossAI(e, dt, dx, dy, d, aggro); vx = e.vx || 0; vy = e.vy || 0; break;
    }
    const mode = e.F.ghost ? 'ghost' : e.F.fly ? 'fly' : 'walk';
    move(e, (vx + e.kbx) * dt, (vy + e.kby) * dt, mode);
    e.kbx -= e.kbx * Math.min(1, dt * 9); e.kby -= e.kby * Math.min(1, dt * 9);
    if (Math.abs(vx) > 2) e.face = vx < 0 ? -1 : 1;
    if (!e.F.nest && e.atk > 0 && d < e.r + P.r - 3) hurtPlayer(e.atk, e);
  }
  // 讓怪物不要疊在一起
  const L = G.enemies;
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i], b = L[j];
    if (a.F.nest || b.F.nest) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r - 4;
    if (d > 0 && d < m) {
      const push = (m - d) / 2, ux = dx / d, uy = dy / d;
      const ma = a.F.ghost ? 'ghost' : a.F.fly ? 'fly' : 'walk', mb = b.F.ghost ? 'ghost' : b.F.fly ? 'fly' : 'walk';
      if (!a.F.boss) move(a, -ux * push, -uy * push, ma);
      if (!b.F.boss) move(b, ux * push, uy * push, mb);
    }
  }
}
// 分身要在勇者看得到的地方生出來，才跳觀念卡（隔著牆生的不算）
function seesClone(e, d) {
  if (!e.arena) return d < 6 * T;
  const tx = Math.floor(P.x / T), ty = Math.floor(P.y / T), r = e.arena.rect;
  return tx >= r[0] && tx <= r[2] && ty >= r[1] && ty <= r[3];
}
function bossAI(e, dt, dx, dy, d, aggro) {
  e.vx = 0; e.vy = 0;
  if (!aggro) return;
  const rage = e.hp < e.max / 2;
  if (rage && !G.bossRage) { G.bossRage = true; toast('魔王發狂了！'); G.shake = .5; sfx('roar'); }
  const spd = e.spd * (rage ? 1.35 : 1);
  if (e.state === 0) {
    e.vx = dx / d * spd; e.vy = dy / d * spd;
    e.fire -= dt; e.sum -= dt;
    if (e.fire <= 0) {
      e.fire = rage ? 2.3 : 3.3;
      const n = rage ? 14 : 9, off = rand(0, 1);
      for (let i = 0; i < n; i++) { const a = (i + off) / n * Math.PI * 2; G.projs.push({kind:'fire', owner:'e', x:e.x, y:e.y, vx:Math.cos(a) * 140, vy:Math.sin(a) * 140, r:8, dmg:e.atk - 1, life:3.5, fly:1}); }
      sfx('fire');
    }
    if (e.sum <= 0) {
      e.sum = 7;
      for (let i = 0; i < 2 && e.kids < 4; i++) {
        const a = rand(0, 6.28), kid = makeEnemy('b', e.x + Math.cos(a) * 40, e.y + Math.sin(a) * 40);
        kid.parent = e; e.kids++; G.enemies.push(kid); burst(kid.x, kid.y, 8, '#b9a0ff');
      }
    }
    if (rage && e.cd <= 0 && d < 4.5 * T) { e.state = 1; e.t = .55; e.dx = dx / d; e.dy = dy / d; }
  } else if (e.state === 1) { if (e.t <= 0) { e.state = 2; e.t = .42; } }
  else { e.vx = e.dx * 320; e.vy = e.dy * 320; if (e.t <= 0) { e.state = 0; e.cd = 3; } }
}

function hurtPlayer(dmg, src) {
  if (P.inv > 0 || G.won || P.hp <= 0) return;
  const def = stats().def, d = Math.max(1, dmg - def), saved = dmg - d;
  P.hp -= d; P.inv = 1;
  // 防具擋掉的傷害要看得到
  if (saved > 0) {
    text(P.x + 22, P.y - 4, `🛡️ 擋 ${saved}`, '#a9d3ff');
    burst(P.x - P.dir.x * 10, P.y - P.dir.y * 10, 6, '#cfe6ff');
    sfx('block');
  }
  const dx = P.x - src.x, dy = P.y - src.y, l = Math.hypot(dx, dy) || 1;
  P.kbx = dx / l * 260; P.kby = dy / l * 260;
  G.shake = .25;
  text(P.x, P.y - 18, '-' + d, '#ff7a6a', true);
  sfx('hurt');
  if (P.hp <= 0) {
    P.hp = 0; burst(P.x, P.y, 20, '#ff7a6a');
    const lost = Math.ceil(P.gold / 2); P.gold -= lost;
    const gear = dropGear();
    setTimeout(() => showDeath(lost, gear), 700);
  }
}

function updateProjs(dt) {
  for (const p of G.projs) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
    if (solidAt(tx, ty, 'fly')) { p.life = 0; burst(p.x, p.y, 3, '#bbb'); continue; }
    if (p.owner === 'p') {
      for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) {
        const l = Math.hypot(p.vx, p.vy); hitEnemy(e, p.dmg, {x:p.vx / l, y:p.vy / l}); p.life = 0; break;
      }
    } else if (Math.hypot(P.x - p.x, P.y - p.y) < P.r + p.r - 2) { hurtPlayer(p.dmg, p); p.life = 0; }
  }
  G.projs = G.projs.filter(p => p.life > 0);
}
function updateDrops(dt) {
  for (const d of G.drops) {
    d.t += dt;
    d.vz -= 420 * dt; d.z = Math.max(0, d.z + d.vz * dt); if (d.z === 0) { d.vz = 0; d.vx *= .85; d.vy *= .85; }
    const dist = Math.hypot(P.x - d.x, P.y - d.y);
    if (d.t > .35 && dist < 70 && P.hp > 0) { d.x += (P.x - d.x) / dist * 260 * dt; d.y += (P.y - d.y) / dist * 260 * dt; }
    else { d.x += d.vx * dt; d.y += d.vy * dt; }
    if (d.t > .35 && dist < 14) {
      d.gone = true;
      if (d.kind === 'heart') { heal(2); }
      else { P.gold += d.v; G.goldIn += d.v; sfx('coin'); learn('scope'); }
    }
  }
  G.drops = G.drops.filter(d => !d.gone);
  for (const it of G.items) {
    const dist = Math.hypot(P.x - it.x, P.y - it.y);
    if (it.cool) { if (dist > 34) it.cool = false; continue; }
    if (dist < 18 && P.hp > 0) pickup(it);
  }
}
function heal(n) {
  const before = P.hp; P.hp = Math.min(P.maxHp, P.hp + n);
  if (P.hp > before) { text(P.x, P.y - 20, '+' + (P.hp - before), '#86e08f', true); sfx('heal'); }
}

/* ================= 背包與道具 ================= */
// 背包就是一份清單：刪除時後面的往前補，空格永遠在最後面
function bagDel(i, quiet) { P.bag.splice(i, 1); P.bag.push(null); if (!quiet) learn('del'); }
function pickup(it) {
  const i = P.bag.indexOf(null);
  if (i >= 0) {
    P.bag[i] = it.id; G.items.splice(G.items.indexOf(it), 1);
    toast(`撿到了 ${ITEMS[it.id].i} ${ITEMS[it.id].n}`); sfx('pick');
    learn('add');

}
// 拿到裝備時：那一格空著就直接穿上；比身上的好就提醒去換
function afterGain(i) {

}
function dropItem(id, x, y) { G.items.push({x, y, id, cool:true, t:rand(0,6)}); }
function useItem(i) {

function digit(c) { const m = /^(?:Digit|Numpad)([1-8])$/.exec(c); return m ? +m[1] - 1 : -1; }

/* ================= 互動 ================= */
function nearest() {
  let best = null, bd = 50;
  for (const o of G.objs) {
    if ((o.kind === 'door' || o.kind === 'gate') && o.open) continue;
    const d = Math.hypot((o.tx + .5) * T - P.x, (o.ty + .5) * T - P.y);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}
function promptText(o) {
  switch (o.kind) {
    case 'chest': case 'keychest': return o.open ? null : '打開寶箱';
    case 'door': return has('key') ? '用鑰匙開門' : '上鎖的門';
    case 'gate': return '封印門';
    case 'fountain': return '泉水';
    case 'shop': return '商店';
    case 'npc': return '和' + NPCS[o.npc].n + '說話';
  }
}
function interact() {
  const o = nearest(); if (!o) return;
  const cx = (o.tx + .5) * T, cy = (o.ty + .5) * T;
  switch (o.kind) {
    case 'chest': case 'keychest': {
      if (o.open) return;
      o.open = true; G.solid[o.ty][o.tx] = 1; sfx('open');
      let id;
      if (o.kind === 'keychest') id = 'key';
      else if (G.pool.length) { id = G.pool.splice(Math.floor(Math.random() * G.pool.length), 1)[0]; learn('random'); }
      burst(cx, cy - 6, 12, '#f0c35a');
      if (!id) { for (let i = 0; i < 5; i++) dropCoin(cx, cy, 3); toast('寶箱裡只剩一些金幣。'); return; }
      const dx = P.x - cx, dy = P.y - cy, l = Math.hypot(dx, dy) || 1;
      G.items.push({x:cx + dx / l * 24, y:cy + dy / l * 24, id, cool:false, t:0});
      toast(`寶箱裡有 ${ITEMS[id].i} ${ITEMS[id].n}！`);
      return;
    }
    case 'door': {
      const i = P.bag.indexOf('key');
      learn('has');
      if (i < 0) { toast('門鎖著。背包裡沒有鑰匙。'); sfx('deny'); return; }
      bagDel(i); o.open = true; G.solid[o.ty][o.tx] = 0; sfx('door');
      toast('用掉一把鑰匙，門打開了。'); burst(cx, cy, 10, '#c58b4a'); return;
    }
    case 'gate': {
      const ar = G.arenas.find(a => a.gates.includes(o));
      toast(`封印門：試煉場裡還有 ${ar ? ar.left : '?'} 隻怪物，全部打倒才會打開。`); sfx('deny'); return;
    }
    case 'fountain':
      P.hp = P.maxHp; G.checkpoint = {x:cx, y:cy + T}; sfx('heal');
      burst(cx, cy, 16, '#8fd3ff');
      toast('生命回滿了。泉水記住了你的位置。'); return;
    case 'shop': openShop(); return;
    case 'npc': {
      const N = NPCS[o.npc];
      const lines = N.lines(P);
      const turnIn = N.quest && !P.quests[o.npc] && has(N.quest);
      P.talked[o.npc] = true;
      talk(N, lines, turnIn ? () => {
        bagDel(P.bag.indexOf(N.quest)); P.quests[o.npc] = 1; learn('has');
        G.items.push({x:P.x, y:P.y + 2, id:N.reward, cool:false, t:0});
        toast(`得到 ${ITEMS[N.reward].i} ${ITEMS[N.reward].n}！`); sfx('gate');
      } : null);
    }
  }
}

function checkArenas() {
  const ptx = Math.floor(P.x / T), pty = Math.floor(P.y / T);
  let inside = null;
  for (const a of G.arenas) {
    if (a.cleared) continue;
    a.left = G.enemies.filter(e => e.arena === a && !e.dead).length;
    if (a.left === 0) {
      a.cleared = true;
      for (const g of a.gates) { g.open = true; G.solid[g.ty][g.tx] = 0; burst((g.tx + .5) * T, (g.ty + .5) * T, 14, '#b9a0ff'); }
      toast('封印解除了！門打開了。'); sfx('gate'); G.shake = .2; learn('sync');
      continue;
    }
    if (ptx >= a.rect[0] && ptx <= a.rect[2] && pty >= a.rect[1] && pty <= a.rect[3]) inside = a;
  }
  const tag = $('#arenaTag');
  if (inside) { tag.hidden = false; tag.innerHTML = `封印試煉　剩下 <b>${inside.left}</b> 隻`; } else tag.hidden = true;
}
function checkExit() {
  if (!G.exit || G.leaving) return;
  if (Math.floor(P.x / T) === G.exit.tx && Math.floor(P.y / T) === G.exit.ty) {
    const lost = G.items.filter(i => i.lost);
    if (lost.length) { openExitAsk(lost); return; }
    leaveArea();
  }
}
function leaveArea() { G.leaving = true; sfx('gate'); showSummary(); }
function showSummary() {
  if (G.idx === 0) setTrained();

  syncCards();
  showScreen(`<div class="card">

    <div class="result">
      <div><b>${k}</b>打倒的怪物</div><div><b>${g}</b>撿到的金幣</div>
      <div><b>${k ? avg : '—'}</b>平均每隻掉幾枚</div><div><b>${fmtTime(P.time - G.t0)}</b>這一章花的時間</div>
    </div>
    ${k ? `<p class="muted" style="margin:-10px 0 18px">${g} ÷ ${k} ≈ ${avg}</p>` : ''}
    ${teach ? `<div class="panel ccard" style="margin:0 auto 20px;text-align:left">${cardBody('avg')}</div>` : ''}
    <div class="acts"><button class="btn primary" data-go="next">前往${next.ch}：${next.name}</button></div>
  </div>`);
}

function cloudState(st, why) {
  if (st === 'error' && !cloudBad && G) toast('⚠️ 存檔沒有存進雲端（網路不穩），下次存檔會再試一次。');
  if (st === 'ok') cloudBad = false; else if (st === 'error') cloudBad = true;
}
function startGame(save, from) {
  P = newPlayer(save);
  cardQ.length = 0;
  hideScreen();
  loadArea(save ? save.area : (from || 0));
}
// 倒下時：身上的裝備散落在原地，可以回去撿；金幣少一半，找不回來
function dropGear() {
  const ids = ['weapon', 'armor', 'acc'].map(s => P.equip[s]).filter(Boolean);
  P.equip = {weapon:null, armor:null, acc:null};
  ids.forEach((id, k) => {
    const a = k / ids.length * Math.PI * 2 + .5, r = ids.length > 1 ? 14 : 0;
    let x = P.x + Math.cos(a) * r, y = P.y + Math.sin(a) * r;
    if (blocked(x, y, 6, 'walk')) { x = P.x; y = P.y; }
    G.items.push({x, y, id, cool:false, t:rand(0, 6), lost:true});
  });
  return ids;
}
function showDeath(lost, gear) {
  if (G.won) return;
  P.deaths++;
  const g = gear.length ? `身上的 ${gear.map(id => ITEMS[id].i + ' ' + ITEMS[id].n).join('、')}掉在倒下的地方，回去撿起來吧，小地圖上的紫色 ✕ 就是那裡。` : '';
  showScreen(`<div class="card">
    <p class="eyebrow">${G.A.ch} · ${G.A.name}</p>
    <h2>你倒下了</h2>
    <p class="lead">${lost ? `金幣少了一半，${lost} 枚找不回來了。` : ''}${g}泉水會把你帶回最後去過的地方，打倒的怪物不會再出現。</p>
    <div class="acts"><button class="btn primary" data-go="respawn">從泉水重新出發</button></div>
  </div>`);
}
function respawn() {
  P.hp = P.maxHp; P.inv = 1.5; P.kbx = P.kby = 0;
  P.x = G.checkpoint.x; P.y = G.checkpoint.y;
  G.projs = [];
  for (const e of G.enemies) { e.hp = e.max; e.x = e.sx; e.y = e.sy; e.state = 0; e.kbx = e.kby = 0; if (e.F.boss) { e.fire = 2.5; e.sum = 5; } }
  G.bossRage = false;
  hideScreen(); snapCamera();
  if (G.items.some(i => i.lost)) setTimeout(() => toast(weapon().atk ? '裝備掉在倒下的地方，跟著小地圖的紫色 ✕ 走。' : '現在是空手！先回倒下的地方撿回武器，或從背包換一把。'), 400);
}
function win() {
  G.won = true;
  for (const e of G.enemies) if (!e.dead && !e.F.boss) { e.dead = true; burst(e.x, e.y, 10, '#b9a0ff'); }
  G.projs = [];
  G.shake = .8; sfx('win');
  // 通關：清掉存檔、記一筆通關紀錄（時間、等級、打倒數、倒下次數…），馬上寫回雲端
  if (STORE) { STORE.update(r => { r.save = null; GAMESAVE.addCards(r, P.cards); GAMESAVE.addClear(r, P); }); STORE.flush(); }
  setTimeout(() => {
    showScreen(`<div class="card">
      <p class="eyebrow">終章</p>
      <h1 style="font-size:clamp(40px,10vw,68px)"><span class="star">晨星</span>回來了</h1>
      <p class="lead">魔王倒下的那一刻，晨星從王座上升起，飛回村莊的天空。很久很久沒有天亮的世界，終於迎來了早晨。</p>
      <div class="result">
        <div><b>${fmtTime(P.time)}</b>冒險時間</div><div><b>${P.kills}</b>打倒的怪物</div>
        <div><b>${P.gold}</b>剩下的金幣</div><div><b>${P.deaths}</b>倒下次數</div>
        <div><b>Lv ${P.lv}</b>最後的等級</div><div><b>${P.maxHp}</b>最大生命</div>
      </div>
      <div class="acts"><button class="btn primary" data-go="title">回到標題</button></div>
    </div>`);
  }, 2200);
}
function togglePause(on) {
  if (on && blockedUI()) return;
  UI.pause = on;
  if (on) showPause();
  else hideScreen();
}
function showPause() {
  const got = CARD_ORDER.filter(k => P.cards[k]).length;
  showScreen(`<div class="card"><p class="eyebrow">${G.A.ch} · ${G.A.name}</p><h2>暫停</h2>
    <div class="result"><div><b>${fmtTime(P.time)}</b>冒險時間</div><div><b>${P.kills}</b>打倒的怪物</div></div>
    <div class="acts"><button class="btn primary" data-go="resume">繼續</button><button class="btn" data-go="codex">程式觀念（${got}/${CARD_ORDER.length}）</button><button class="btn" data-go="title">回到標題</button></div>
    <p style="margin-top:16px"><button class="toggle" data-go="hints">程式觀念提示：${hintsOn ? '開' : '關'}</button></p></div>`);
}
function showCodex() {
  showScreen(`<div class="card" style="width:min(620px,100%)"><p class="eyebrow">遊戲裡藏了哪些程式觀念</p><h2>程式觀念</h2>
    <div class="codex">${UNITS.map(([u, name, topic]) => {
      const ks = CARD_ORDER.filter(k => CARDS[k].u === u);
      return `<div class="unit"><h4>單元 ${u}　${name}<small>${topic}</small></h4>${ks.length
        ? `<div class="chips">${ks.map(k => P.cards[k] ? `<button class="chip" data-go="card" data-k="${k}">${CARDS[k].n}</button>` : `<button class="chip" disabled>？？？</button>`).join('')}</div>`
        : '<p class="muted">這款遊戲沒有用到這個單元。</p>'}</div>`; }).join('')}</div>
    <div class="acts"><button class="btn primary" data-go="back">返回</button></div></div>`);
}
$('#screen').addEventListener('click', ev => {
  const b = ev.target.closest('[data-go]'); if (!b) return;
  unlockAudio();
  const go = b.dataset.go;
  if (go === 'new') { clearSave(); startGame(null, 0); }
  else if (go === 'skip') { if (!isTrained()) return; clearSave(); startGame(null, 1); }
  else if (go === 'hints') { setHints(!hintsOn); b.textContent = `程式觀念提示：${hintsOn ? '開' : '關'}`; }
  else if (go === 'codex') showCodex();
  else if (go === 'card') showScreen(`<div class="card" style="width:min(520px,100%)"><div class="panel ccard" style="text-align:left;margin:0 auto 18px">${cardBody(b.dataset.k)}</div><div class="acts"><button class="btn primary" data-go="codex">返回</button></div></div>`);
  else if (go === 'back') showPause();
  else if (go === 'next') { const n = G.idx + 1; fadeTo(() => { hideScreen(); loadArea(n); }); }
  else if (go === 'continue') startGame(readSave());
  else if (go === 'respawn') respawn();
  else if (go === 'resume') togglePause(false);
  else if (go === 'title') { UI.pause = false; G = null; showTitle(); }
  else if (go === 'reload') location.reload();
});

/* ================= 音效 ================= */
let AC = null;
function unlockAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, dur, type, slide, vol, delay) {
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol || .06, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
let lastCoin = 0;
function sfx(n) {
  if (muted || !AC) return;
  try {
    switch (n) {
      case 'swing': tone(700, .07, 'triangle', -450, .04); break;
      case 'bow': tone(900, .09, 'square', -600, .03); break;
      case 'hit': tone(180, .07, 'square', -80, .05); break;
      case 'pop': tone(420, .12, 'triangle', 300, .05); break;
      case 'hurt': tone(220, .22, 'sawtooth', -140, .06); break;
      case 'coin': if (AC.currentTime - lastCoin < .05) break; lastCoin = AC.currentTime; tone(988, .06, 'square', 0, .03); tone(1319, .12, 'square', 0, .03, .05); break;
      case 'pick': tone(660, .08, 'triangle', 0, .05); tone(990, .12, 'triangle', 0, .05, .07); break;
      case 'open': [523, 659, 784].forEach((f, i) => tone(f, .14, 'triangle', 0, .05, i * .07)); break;
      case 'gate': [392, 523, 659, 784].forEach((f, i) => tone(f, .18, 'sine', 0, .06, i * .08)); break;
      case 'door': tone(110, .25, 'square', -40, .05); break;
      case 'deny': tone(160, .12, 'square', 0, .04); tone(120, .14, 'square', 0, .04, .1); break;
      case 'heal': [523, 784, 1047].forEach((f, i) => tone(f, .16, 'sine', 0, .05, i * .06)); break;
      case 'equip': tone(300, .06, 'square', 200, .04); break;
      case 'fire': tone(160, .3, 'sawtooth', -90, .04); break;
      case 'roar': tone(90, .6, 'sawtooth', -40, .08); break;
      case 'block': tone(1200, .05, 'triangle', -400, .04); break;
      case 'level': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', 0, .035, i * .06)); break;
      case 'win': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', 0, .06, i * .15)); break;
    }
  } catch (e) {}
}
$('#bSound').addEventListener('click', () => { muted = !muted; $('#bSound').textContent = muted ? '🔇' : '🔊'; unlockAudio(); });
$('#bBag').addEventListener('click', () => { unlockAudio(); UI.bag ? closeBag() : openBag(); });
$('#gear').addEventListener('click', ev => { if (ev.target.closest('[data-g]')) { unlockAudio(); if (!UI.bag) openBag(); } });
$('#bPause').addEventListener('click', () => { if (!UI.screen) togglePause(true); else if (UI.pause) togglePause(false); });

/* ================= 鍵盤 ================= */
window.addEventListener('keydown', ev => {
  unlockAudio();
  const c = ev.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(c) && !UI.screen) ev.preventDefault();
  if (UI.screen) {
    if (c === 'Escape' && UI.pause) togglePause(false);
    return;
  }
  if (UI.dlg) { if (['Space', 'KeyE', 'Enter', 'KeyJ', 'KeyK'].includes(c) && !ev.repeat) advance(); return; }
  if (UI.card) { if (['Escape', 'Enter', 'Space', 'KeyE'].includes(c) && !ev.repeat) closeCard(); return; }
  if (UI.ask) { if (c === 'Escape') closeExitAsk(false); return; }
  if (UI.full) { if (c === 'Escape') closeFull(); return; }
  if (UI.shop) { if (c === 'Escape' || c === 'KeyE') closeShop(); return; }
  if (UI.bag) { if (c === 'Escape' || c === 'KeyI' || c === 'KeyB' || c === 'Tab') closeBag(); else if (digit(c) >= 0 && !ev.repeat) quickSlot(digit(c)); return; }
  if (UI.fading) return;
  input.keys.add(c);
  if ((c === 'Space' || c === 'KeyJ') && P.hp > 0) { input.atkHeld = true; if (!ev.repeat) input.atkQ = true; }
  if ((c === 'KeyE' || c === 'KeyK' || c === 'Enter') && !ev.repeat && P.hp > 0) interact();
  if ((c === 'KeyI' || c === 'KeyB' || c === 'Tab') && !ev.repeat) openBag();
  if (c === 'KeyQ' && !ev.repeat && P.hp > 0) quickPotion();
  if (digit(c) >= 0 && !ev.repeat && P.hp > 0) quickSlot(digit(c));
  if ((c === 'Escape' || c === 'KeyP') && !ev.repeat) togglePause(true);
});
window.addEventListener('keyup', ev => {
  input.keys.delete(ev.code);
  if (ev.code === 'Space' || ev.code === 'KeyJ') input.atkHeld = false;
});
window.addEventListener('blur', () => { input.keys.clear(); input.atkHeld = false; });

/* ================= 觸控 ================= */
let touchMode = false;
function enableTouch() {
  if (touchMode) return;
  touchMode = true; $('#touch').hidden = false; $('#app').classList.add('touching');
}
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) enableTouch();
const joy = {id:null, ox:0, oy:0};
cv.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse') return;
  enableTouch(); unlockAudio();
  if (joy.id !== null || blockedUI()) return;
  joy.id = ev.pointerId; joy.ox = ev.clientX; joy.oy = ev.clientY;
  const r = $('#app').getBoundingClientRect();
  const j = $('#joy'); j.hidden = false; j.style.left = (ev.clientX - r.left) + 'px'; j.style.top = (ev.clientY - r.top) + 'px';
  $('#joyKnob').style.transform = '';
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
});
cv.addEventListener('pointermove', ev => {
  if (ev.pointerId !== joy.id) return;
  let dx = ev.clientX - joy.ox, dy = ev.clientY - joy.oy;
  const l = Math.hypot(dx, dy), R = 46;
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  input.joy.x = dx / R; input.joy.y = dy / R;
  $('#joyKnob').style.transform = `translate(${dx}px,${dy}px)`;
});
const joyEnd = ev => { if (ev.pointerId !== joy.id) return; joy.id = null; input.joy.x = input.joy.y = 0; $('#joy').hidden = true; };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
const tb = (id, down, up) => {
  const el = $(id);
  el.addEventListener('pointerdown', ev => { ev.preventDefault(); unlockAudio(); if (!blockedUI() || (UI.dlg && id === '#tAct')) down(); });
  if (up) { el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up); }
};
tb('#tAtk', () => { if (P.hp > 0) { input.atkHeld = true; input.atkQ = true; } }, () => { input.atkHeld = false; });
tb('#tAct', () => { if (UI.dlg) advance(); else if (P.hp > 0) interact(); });
tb('#tPot', () => { if (P.hp > 0) quickPotion(); });

/* ================= 主迴圈 ================= */
let last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (G && P) {
    if (!blockedUI() && P.hp > 0 && cardQ.length) showCard(cardQ.shift());
    if (!blockedUI() && P.hp > 0) update(dt);
    else if (P.hp <= 0 && !UI.screen) { for (const f of G.fx) { f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; } G.fx = G.fx.filter(f => f.life > 0); }
    render(t);
    updateHud();
    miniT -= dt; if (miniT <= 0) { miniT = .2; drawMini(); }
  } else render(t);
  $('#hud').style.visibility = $('#mini').style.visibility = $('#touch').style.visibility = (G && P && !UI.screen) ? 'visible' : 'hidden';
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();

// 開機：先讀雲端存檔、確認十關都通關了，才顯示標題畫面
function boot() {
  showScreen(`<div class="card"><p class="eyebrow">晨星勇者</p><h2>正在讀取你的存檔…</h2></div>`);
  requestAnimationFrame(t => { last = t; frame(t); });
  window.MS_BRIDGE.ready.then(api => {
    if (!api || api.error) { showOffline(api && api.error); return; }
    let docData = {};
    STORE = GAMESAVE.createStore({
      load: () => api.readDoc().then(d => { docData = d || {}; return (docData.games || {}).morningstar; }),
      write: rec => api.writeGame(rec),
      onState: cloudState
    });
    STORE.load().then(() => {
      const mods = docData.modules || {};
      const flowDone = {};
      ((mods.flowchart && mods.flowchart.units) || []).forEach(u => { flowDone[u] = true; });
      const GR = window.GRADING || {};
      const g = GAMESAVE.unlocked(window.FLOW_UNITS, flowDone, (mods.scratch && mods.scratch.unitStars) || {},
                                  GR.GATE, !!(GR.openAll && GR.openAll(window.CONFIG)));
      if (!g.ok) showLocked(g); else showTitle();
    }, e => showOffline((e && (e.code || e.message)) || e));
  });
}
// 關分頁、切走時把還沒寫出去的存檔趕快送出去
window.addEventListener('pagehide', () => { if (STORE) STORE.flush(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && STORE) STORE.flush(); });
boot();
})();
</script>
