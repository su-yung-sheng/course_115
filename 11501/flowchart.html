    /* ── 關卡小卡（2026-08-17：對齊下學期的層次，再補一點設計）──
       ★ 克制為主：這一頁要投影、也要在手機上讀得到。
         裝飾只做三件事 —— 左緣的關卡色帶、卡片進場的時間差、
         完成時的綠色光暈。其餘留白。
       ⚠️ 色帶用 border-left 就好，不要背景漸層 ——
          投影機把淡色漸層打出來是一片糊的。 */
    .unit-btn{border-left-width:6px}
    .unit-btn.c-blue{border-left-color:#60a5fa}
    .unit-btn.c-cyan{border-left-color:#22d3ee}
    .unit-btn.c-purple{border-left-color:#a78bfa}
    .unit-btn.c-green{border-left-color:#4ade80}
    .unit-btn.c-orange{border-left-color:#fb923c}
    .unit-btn.c-red{border-left-color:#f87171}
    .unit-btn.c-indigo{border-left-color:#818cf8}
    .unit-btn.c-slate{border-left-color:#94a3b8}
    .unit-btn.c-yellow{border-left-color:#facc15}
    .unit-btn.c-amber{border-left-color:#fbbf24}
    .unit-btn.locked{border-left-color:#cbd5e1}
    /* 進場的時間差：一張一張浮上來，不是十張同時閃出來。
       ⚠️ 上限 10 —— 再多會讓最後一張等超過一秒，那就變成卡頓感。 */
    .unit-btn{animation:pop .35s ease-out both}
    .unit-btn:nth-child(1){animation-delay:.02s}
    .unit-btn:nth-child(2){animation-delay:.05s}
    .unit-btn:nth-child(3){animation-delay:.08s}
    .unit-btn:nth-child(4){animation-delay:.11s}
    .unit-btn:nth-child(5){animation-delay:.14s}
    .unit-btn:nth-child(6){animation-delay:.17s}
    .unit-btn:nth-child(7){animation-delay:.20s}
    .unit-btn:nth-child(8){animation-delay:.23s}
    .unit-btn:nth-child(9){animation-delay:.26s}
    .unit-btn:nth-child(n+10){animation-delay:.29s}
    /* ⚠️ 會暈車的人要能關掉 —— 系統設定裡開了「減少動態效果」就不要動。 */
    @media (prefers-reduced-motion:reduce){
      .unit-btn{animation:none}
      .unit-btn:hover{transform:none}
    }

      // 7 動物點點名
      '建立「全域變數」總數並歸零': '全域＝所有角色共用同一個數字',
      '點擊動物→全域變數 ＋ 1（大家共用、接續累加）': '點哪一隻都加到同一個數字上',
      '建立「角色變數」各自計數': '角色變數＝每個角色都有一份自己的',
      '點擊某隻小貓→該角色變數 ＋ 1（各自獨立）': '只有被點的那一隻會加，其他不受影響',

      // 8 戰車王
      '設定每輛敵機的血量（角色變數）': '每架敵機各記各的血，才不會一起扣',
      '偵測方向鍵→移動戰車': '事件：按方向鍵控制自己的戰車',
      '按空白鍵→發射子彈分身': '事件：用分身當子彈，可以同時射很多發',
      '判斷：子彈碰到敵機？': '菱形＝要做決定，有沒有打中',
      '是→爆炸造型、刪除子彈、該敵機血量 －1': '打中之後要做的三件事',
      '血量 = 0→敵機消失': '血扣完了才把敵機移除',

      // 9 分身小貓
      '隱藏本尊': '本尊只負責生分身，自己不出場',
      '重複 N 次：編號 ＋1、建立分身': '先加編號再生分身，分身才會帶著不同的號碼',
      '當分身產生': '事件：每一個分身出生時各自執行下面這段',
      '繼承編號當作專屬 ID': '分身內：記住自己是第幾號',
      '一邊走一邊說出自己的編號': '分身內：證明每一隻真的都不一樣',

      // 10 螞蟻搬乳酪
      '用分身產生大量螞蟻': '一次做出很多隻，不必複製角色',
      '每隻螞蟻面朝乳酪前進': '每隻分身各自去找目標',
      '判斷：碰到乳酪？': '菱形＝要做決定，找到了沒',
      '是→狀態設為「搬運中」、乳酪跟隨螞蟻': '找到之後改變狀態，乳酪才會跟著走',
      '判斷：回到蟻穴？': '菱形＝要做決定，搬到家了沒',

    /** 放進 HTML 前先逸出，Mermaid 程式碼裡有 --> 這種符號 */
    function esc(t){ return String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    /** 取步驟說明（步驟文字前面可能有全形縮排空白，要先去掉） */
    function stepNote(s){ return STEP_NOTES[String(s).replace(/^[　\s]+/, '')] || ''; }


    /* ── 流程圖 → Mermaid 程式碼 ──────────────────────────
       學生排完之後，把同一張流程圖變成 Mermaid 語法，
       貼到 mermaid.ai 就會長出真正的流程圖（有方框、菱形、箭頭）。

       ★ 為什麼值得做：排卡片排出來的是「順序」，但流程圖真正的重點是
         **形狀有意義** —— 圓角是起訖、矩形是處理、菱形是判斷、
         平行四邊形是輸入輸出。看到自己排的東西變成正式的流程圖，
         那些形狀才會從課本上的圖變成自己畫得出來的東西。
       ★ 形狀依步驟文字判斷，規則就是課本教的那一套：
         開始／結束 → 圓角     判斷／？ → 菱形
         輸入／說出／顯示／演奏 → 平行四邊形     其餘 → 矩形 */
    function mermaidShape(text){
      if(text==='開始' || text==='結束') return ['([', '])'];
      if(/判斷|？|\?$/.test(text))       return ['{', '}'];
      if(/^輸入|說出|顯示|演奏|換造型/.test(text)) return ['[/', '/]'];
      return ['[', ']'];
    }
    function toMermaid(steps){
      const out = ['flowchart TD'];
      const id = i => 'S' + i;
      let pending = [];          // 還在等著接到下一個節點的節點
      let lastDecision = null;   // 最近一個菱形（是／否 要從它分出去）
      let parent = null;         // 縮排步驟的上層節點
      let chain = null;          // 縮排段落目前接到哪一個

      steps.forEach((raw, i) => {
        const indented = /^[　\s]/.test(raw);
        const text = String(raw).replace(/^[　\s]+/, '');
        const [o, c] = mermaidShape(text);
        out.push('    ' + id(i) + o + '"' + text.replace(/"/g, "'") + '"' + c);

        if(indented){
          // 縮排＝上一個節點的內容（迴圈裡面、或事件底下）
          out.push('    ' + id(chain === null ? parent : chain) + ' --> ' + id(i));
          chain = i;
          return;
        }
        // 離開縮排段落：如果上層是迴圈，最後一步要繞回去
        if(chain !== null && parent !== null){
          if(/重複|迴圈/.test(String(steps[parent]).replace(/^[　\s]+/, ''))){
            out.push('    ' + id(chain) + ' --> ' + id(parent));
            pending = [parent];
          } else {
            pending = [chain];
          }
          chain = null;
        }

        // 「是→…」「否→…」要從最近的菱形分出去，並標上是／否
        const both = /是→/.test(text) && /否→/.test(text);
        const yes = !both && /^是→/.test(text);
        const no  = !both && /^否→/.test(text);
        if((yes || no) && lastDecision !== null){
          out.push('    ' + id(lastDecision) + ' -->|' + (yes ? '是' : '否') + '| ' + id(i));
          pending = pending.filter(x => x !== lastDecision).concat(i);
        } else {
          pending.forEach(pv => out.push('    ' + id(pv) + ' --> ' + id(i)));
          pending = [i];
        }

        if(/判斷|？/.test(text)) lastDecision = i;
        parent = i;
      });
      return out.join('\n');
    }
    /** Mermaid 官方網站沒有「用網址帶程式碼」的公開格式，所以做成「複製 → 貼上」 */
    const MERMAID_SITE = 'https://mermaid.ai/';

    /* ── Mermaid 面板（過關畫面與「再看一次」畫面共用同一份）────────
       ⚠️⚠️ 2026-08-26 老師問：「忘記複製直接離開，是不是要重玩一次？
          是不是少了一個記錄點？」
       ★ 查下來**沒有東西需要記錄**：這段程式碼是 toMermaid(u.steps) ——
         來自單元定義的**正確步驟**，對每個學生、每一次都一模一樣。
         它不是學生的作品，是這一關的標準流程圖。
       ⇒ 缺的不是記錄點，是**入口**：排對過的關卡應該隨時能再拿到它。
         所以抽成函式，讓關卡列表也叫得到。
       ⚠️ 抽出來的另一個理由：原本只有過關畫面有這一段，
          再抄一份到別的畫面就會變成兩份各改各的。 */
    function mermaidPanel(u){
      return `              <details class="text-left bg-indigo-50 border border-indigo-200 rounded-xl mb-5" open>
                <summary class="cursor-pointer px-4 py-3 font-bold text-indigo-800 text-sm">
                  🧜 把這張流程圖變成真的圖（Mermaid）
                </summary>
                <div class="px-4 pb-4">
                  <p class="text-xs text-indigo-900/70 leading-relaxed mb-2">
                    下面是這張流程圖的 <b>Mermaid 程式碼</b>。複製起來貼到
                    <a href="${MERMAID_SITE}" target="_blank" rel="noopener" class="underline font-bold">mermaid.ai</a>，
                    就會畫出正式的流程圖。<br>
                    注意形狀：<b>圓角</b>＝開始／結束、<b>矩形</b>＝處理、
                    <b>菱形</b>＝判斷、<b>平行四邊形</b>＝輸入／輸出。
                  </p>
                  <pre id="mmd-code" class="bg-white border border-indigo-200 rounded-lg p-3 text-[11px] leading-relaxed overflow-auto max-h-56 whitespace-pre">${esc(toMermaid(u.steps))}</pre>
                  <div class="flex flex-wrap gap-2 mt-2">
                    <button id="copy-mmd" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">📋 複製程式碼</button>
                    <a href="${MERMAID_SITE}" target="_blank" rel="noopener" class="bg-white hover:bg-indigo-100 text-indigo-700 border border-indigo-300 text-xs font-bold px-4 py-2 rounded-lg transition">開啟 Mermaid →</a>
                  </div>
                </div>
              </details>`;

    function buildCandidates(u){
      const pool = [];
      UNITS.forEach(x=>{ if(x.id!==u.id) x.steps.forEach(s=>{ if(s!=='開始'&&s!=='結束'&&!u.steps.includes(s)) pool.push(s); }); });

      let need = 3;                                   // 基本陷阱數
      if((u.steps.length + need) % 2 !== 0) need++;   // 總數湊成偶數（版面兩欄才不會落單）

      return shuffle([...u.steps, ...distractors]);

    const GATE = (window.GRADING && window.GRADING.GATE) || {
      cleared:  function(){ return false; },
      openUpTo: function(){ return 0; },
      isOpen:   function(){ return false; },

    const OPEN_ALL = !!(window.GRADING && window.GRADING.openAll && window.GRADING.openAll(window.CONFIG));
    function openUpTo(){ return OPEN_ALL ? UNITS.length : GATE.openUpTo(UNITS, state.leadDone, state.done, state.progStars); }
    function unitOpen(no){ return OPEN_ALL ? true : GATE.isOpen(no, UNITS, state.leadDone, state.done, state.progStars); }

    /** 點到鎖住的關卡：把原因顯示在列表上方，並捲回頂端讓學生看得到 */
    function refuse(no){

    function mark(t){
      return String(t||'')
        .replace(/「([^」]+)」/g, '<span class="hl">「$1」</span>')

       ⚠️ 已經排對過流程圖的關卡回傳 0 —— 強制停留是為了「第一次別亂點」，
          不是懲罰。已經通關的人回來查資料、或想重排一次練習，
          每次都被鎖 30 秒只會讓人覺得系統在找麻煩。
          排錯太多次被退回重讀時也一樣：他本來就會通關的關卡，
          再罰他讀一次沒有意義。 */
    function readSecondsFor(u) {
      return (u && state.done[u.id]) ? 0 : READ_SECONDS;
    }
    const HINT_SECONDS = 10;   // 選件頁提示顯示秒數（只有一次機會）
    const SELECT_TRIES = 3;    // 選元件可確認的次數，用完退回重讀
    let readHold = null, hintTimer = null;
    function clearTimers(){
      if(readHold){ readHold.stop(); readHold=null; }
      if(hintTimer){ clearInterval(hintTimer); hintTimer=null; }
    }

    /* ── 閱讀倒數 ──────────────────────────────────────
       ★ 規則在 shared/readhold.js，這裡只管畫面文字。
         什麼叫「離開」（切分頁／並列視窗焦點跑掉）、寬限幾秒、
         什麼時候從頭算、保險絲 —— 全部在那一支，兩學期共用一份。

       ⚠️ 2026-08-11 之前這一頁自己判：
             function isWatching(){ return !document.hidden && document.hasFocus(); }
          焦點判對了（11502 那邊漏掉，並列視窗完全繞得過去），
          但**沒有保險絲** —— hasFocus() 一直回 false 的環境
          （內嵌瀏覽器、看板模式）學生會永遠卡在這一頁，
          畫面上只有一個不動的「⏸ 已暫停」，沒有任何錯誤訊息。
          而且 document.hidden 在 prerender 狀態是 true，
          配上沒有出口就更危險。
          兩學期各寫一套的結果是各自對一半、各自錯一半。

       ★ 直接改按鈕文字，不整頁重繪 —— 避免內嵌教材 iframe 被重載。 */
    function paintRead(v){
      const btn = document.getElementById('begin-sel');
      if(!btn) return;
      if(v && v.left > 0){
        btn.disabled = true;
        btn.textContent =
          v.state === 'reset' ? `⏸ 離開太久，從頭算（還要 ${v.left} 秒）` :
          v.state === 'pause' ? `⏸ 已暫停：請回到這個畫面才會繼續倒數（還要 ${v.left} 秒）` :
                                `請先仔細閱讀…（還要 ${v.left} 秒）`;
        btn.className = 'mt-5 w-full bg-slate-300 text-white font-bold text-lg py-3 rounded-xl cursor-not-allowed transition';
      }else{
        btn.disabled = false;
        btn.textContent = '我讀完了，開始闖關 →';
        btn.className = 'mt-5 w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-lg py-3 rounded-xl active:scale-95 transition';
      }
    }
    function startReadCountdown(){
      if(readHold){ readHold.stop(); readHold = null; }
      /* 沒載到 readhold.js 就直接放行。
         少讀 30 秒的代價，遠小於整節課卡在一個不會動的按鈕前面。 */
      if(!window.READHOLD){ state.readLeft = 0; paintRead(null); return; }
      readHold = window.READHOLD.start({
        sec:  readSecondsFor(state.unit),
        left: state.readLeft,          // 重繪時從目前秒數接著算
        onTick: v => { state.readLeft = v.left; paintRead(v); },
        onDone: () => { state.readLeft = 0; paintRead(null); }
      });
    }
    /* 切回畫面時立刻換文字，不用等下一秒。
       ⚠️ 只換「暫停／繼續」，不猜有沒有重算 —— 那要等下一次 onTick，
          在這裡猜會和真正的狀態對不上。 */
    ['visibilitychange','focus','blur'].forEach(ev=>{
      window.addEventListener(ev, ()=>{
        if(state.status==='read' && readHold && state.readLeft > 0){
          paintRead({ left: state.readLeft, state: readHold.away() ? 'pause' : 'run' });
        }
      });
    });
    /* 收下評分站回報的高度，讓 iframe 長成內容的高度：不出現內部捲軸，整頁只用外層捲軸。

       ⚠️ 2026-08-11 改法：高度由 **shared/grader.html 自己回報**（postMessage），
          這裡只負責收。原本是在這裡讀 iframe 的 contentDocument 自己量 ——
          那份程式碼只有這一頁有，而下學期的 11502/level.html 嵌的是同一支
          評分站、卻沒有這一段，於是那邊的「上傳你的作品」被切掉一半，
          而且 scrolling="no" 連捲都捲不到。
          高度只有評分站自己最清楚，讓它自己講，兩邊就不會有一邊漏掉。
       ⚠️ 一定要驗 e.source：任何網頁都可以 postMessage 過來。 */
    function wireGraderHeight(){
      const f = document.getElementById('grader-frame');
      if(!f) return;
      window.addEventListener('message', (e) => {
        const d = e.data;
        if(!d || d.type !== 'graderHeight') return;
        const cur = document.getElementById('grader-frame');
        if(!cur || e.source !== cur.contentWindow) return;
        const h = Number(d.h) || 0;
        if(h > 200 && h < 4000) cur.style.height = h + 'px';
      });
    }

    // 選件頁提示：顯示 10 秒後自動收起（每關只有一次機會）
    // 用 state.hintLeft 記錄剩餘秒數，即使中途重繪（例如點選元件）也不會中斷
    function paintHint(){
      const box = document.getElementById('hint-box');
      const btn = document.getElementById('hint-btn');
      if(!box || !btn) return;
      if(state.hintLeft > 0){
        box.classList.remove('hidden');
        btn.textContent = `💡 提示顯示中…${state.hintLeft} 秒`;
      }else{
        box.classList.add('hidden');
        btn.textContent = state.hintUsed ? '📖 回上一步重新閱讀' : '💡 提示（只有 1 次，顯示 10 秒）';
      }
    }
    function showHint(){
      state.hintUsed = true;
      state.hintLeft = HINT_SECONDS;
      paintHint();
      if(hintTimer) clearInterval(hintTimer);
      hintTimer = setInterval(() => {
        state.hintLeft--;
        if(state.hintLeft <= 0){ state.hintLeft = 0; clearInterval(hintTimer); hintTimer = null; }
        paintHint();
      }, 1000);
    }
    const LEAD = { href:'whatislist.html', title:'Scratch 清單學習機', note:'寫程式前先搞懂「清單（陣列）」怎麼存放一整排資料。' };

    // 內嵌參考教材面板（用 iframe 直接把教材放進本關頁面）
    function refPanel(u){
      if(!u.ref) return '';
      return `
        <div class="border border-rose-200 rounded-xl overflow-hidden mt-4">
          <button id="toggle-ref" class="w-full flex items-center justify-between gap-2 bg-rose-50 hover:bg-rose-100 px-3 py-2.5 text-left transition">
            <span class="flex items-center gap-2"><span class="text-lg">🎵</span><span><span class="text-sm font-bold text-rose-700">參考教材：${u.ref.title}</span><span class="block text-xs text-rose-500 leading-snug">${u.ref.note||''}</span></span></span>
            <span class="text-rose-500 font-black flex-shrink-0">${state.refOpen?'▾ 收合':'▸ 展開'}</span>
          </button>
          ${state.refOpen?`<iframe src="${u.ref.href}" class="w-full block bg-white" style="height:72vh;border:0" title="${u.ref.title}" loading="lazy"></iframe><div class="text-[11px] text-slate-400 px-3 py-1.5 text-center bg-rose-50">教材已嵌在此，看完往上滑繼續</div>`:''}
        </div>`;
    }

    // ===== 認證與登入 =====
    // AUTH.attachSession()：已經有身分（例如剛在闖關基地用學校 Google 帳號登入）
    //    就不要再匿名登入，否則會把 Google 身分蓋掉，安全規則的 isOwner() 失效。
    AUTH.attachSession(auth, signInAnonymously, onAuthStateChanged);
    onAuthStateChanged(auth, user=>{
      if(user && state.status==='loading'){
        const saved = sessionStorage.getItem(SAVED_KEY);
        if(saved && /^14\d{5}$/.test(saved)) autoLogin(saved);
        /* ⚠️ guard.js 已經擋掉沒登入的人，走到這裡幾乎只會是時序問題。
           不論如何都不該畫那個沒有功能的登入頁 —— 回闖關基地重登。 */
        else {
          const hub = (window.CONFIG && window.CONFIG.HUB_PAGE) || 'hub.html';
          location.replace(hub + '?next=' + encodeURIComponent('flowchart.html'));
        }
      }
    });
    /* ⚠️⚠️ 2026-08-26 老師回報：「進入程式設計時會短暫出現舊的輸入學號頁面，
       然後跳走」。原因就是這個逾時 —— autoLogin() 要跑**兩次** Firestore
       讀取（查名冊 ＋ 讀進度），學校網路慢一點就超過 2.5 秒，
       逾時先把畫面換成登入頁，資料讀完才跳回選單。
       ★ 而那個登入頁**早就沒有功能**：它要比對名冊裡的 code 欄位，
         但驗證碼在 2026-08-04 已經整套移除，永遠停在
         「此學號尚未設定驗證碼」——叫學生去做一件不存在的事。
       ⇒ 慢的時候只補一行提示，不換畫面。 */
    setTimeout(()=>{ if(state.status==='loading'){ state.slowNote='連線比較慢，請再等一下…'; render(); } }, 2500);
    /* ⚠️ 但也不能讓學生停在一個永遠不會變的畫面。十秒還沒進來
       代表身分真的有問題（guard.js 擋得住沒登入的人，走到這裡通常是
       Firebase 連不上），導回闖關基地重新登入。 */
    setTimeout(()=>{
      if(state.status==='loading'){
        const hub = (window.CONFIG && window.CONFIG.HUB_PAGE) || 'hub.html';
        location.replace(hub + '?next=' + encodeURIComponent('flowchart.html'));
      }
    }, 10000);

    async function loadProgress(sid){
      try{
        const snap = await getDoc(doc(db, COLLECTION, sid));
        const mods = (snap.exists() && snap.data().modules) || {};
        const units = (mods.flowchart && mods.flowchart.units) || [];
        state.done = {}; units.forEach(u=>state.done[u]=true);
        const sunits = (mods.scratch && mods.scratch.units) || [];
        state.progDone = {}; sunits.forEach(u=>state.progDone[u]=true);
        // 各單元的程式星數（由 AI 批改寫入）→ 有星數就代表這關的程式完成了
        state.progStars = (mods.scratch && mods.scratch.unitStars) || {};
        /* 老師審核給的加分星（交流程圖圖片 +1⭐、交程式錄影 +1⭐）。
           ★ 2026-08-19 老師問「內頁關卡上的星數比較多，是因為加分嗎？」——
             不是，是這一頁本來就沒讀加分、卻把流程圖那一軌寫死成 ★★★。
             現在兩件事一起修：星數照實算，加分也讀進來，
             讓「逐關加總」和闖關基地那張卡對得起來。 */
        state.imgUnits = (mods.flowchart && mods.flowchart.imgUnits) || {};
        state.vidUnits = (mods.scratch && mods.scratch.vidUnits) || {};
        // 前導教材：hub 也讀同一個 modules.list
        state.leadDone = !!(mods.list && mods.list.status === 'pass');
      }catch(e){ console.error('讀進度失敗',e); }
    }

    /* 前導教材通過：由 whatislist.html（嵌在下面的 iframe）用 postMessage 通知。
       那一頁刻意不碰 Firebase——它沒有學生身分，寫進度是這一頁的事。 */
    window.addEventListener('message', async e=>{
      if(e.origin !== location.origin) return;                 // 只收自己站台的訊息
      const d = e.data;
      if(!d || d.type !== 'lead-done' || d.module !== 'list') return;
      if(!state.studentId || state.leadDone) return;
      state.leadDone = true;                                   // 先更新畫面，不讓學生空等
      state.gateMsg = '';
      render();
      try{
        await setDoc(doc(db, COLLECTION, state.studentId), {
          modules: { list: { status:'pass', at: new Date().toISOString() } }
        }, { merge:true });
      }catch(err){
        console.error('前導完成寫入失敗', err);
        state.leadDone = false;
        state.gateMsg = '前導教材的完成紀錄沒存進去（可能是網路問題）。請重新整理再試一次，若還是不行請找老師。';
        render();
      }
    });
    async function autoLogin(sid){
      state.studentId = sid;
      try{ const r = await getDoc(doc(db, ROSTER, sid)); if(r.exists()) state.studentName = r.data().name||''; }catch(e){}
      await loadProgress(sid);
      state.status='menu'; render();
    }
    // 程式設計階段：測驗從題庫「5 選 3」，全對才算通過（通過才解鎖程式截圖）
    const QUIZ_PICK = 3;
    function newQuizSet(u){ return shuffle([...(PROG[u.id].quiz||[])]).slice(0, QUIZ_PICK); }
    function startProgram(){
      if(!state.unit || !unitOpen(state.unit.no)){ refuse(state.unit ? state.unit.no : 1); return; }
      state.quizSet = newQuizSet(state.unit);
      state.qIdx=0; state.qPicked=null; state.qScore=0; state.quizPassed=false;
      state.status='program'; render();
    }
    function retryQuiz(){                      // 沒全對 → 重新抽 3 題再來
      state.quizSet = newQuizSet(state.unit);
      state.qIdx=0; state.qPicked=null; state.qScore=0; render();
    }
    function pickAns(i){
      if(state.qPicked!=null) return;
      state.qPicked=i;
      const q=state.quizSet[state.qIdx];
      if(i===q.a) state.qScore++;
      render();
    }
    function nextQ(){
      state.qIdx++; state.qPicked=null;
      if(state.qIdx>=state.quizSet.length && state.qScore===state.quizSet.length) state.quizPassed=true;
      render();
    }
    // finishProgram 已移除：完成由 AI 批改星數自動認定
    /* 登出要把「上一個人的進度」清乾淨。
       教室是共用電腦，殘留 progStars／leadDone 會讓下一位同學看到別人的解鎖狀態。 */
    /* ⚠️ 2026-08-26：原本是 state.status='login' —— 回到本頁那個
       已經沒有功能的登入畫面。登出的正確去處是闖關基地。 */
    function logout(){
      sessionStorage.removeItem(SAVED_KEY);
      /* ⚠️ 導回闖關基地就是整頁重載，state 自然歸零 ——
         原本那一長串手動清除（progStars／leadDone…）是給
         「留在本頁、切回登入畫面」用的，現在不需要了。 */
      const hub = (window.CONFIG && window.CONFIG.HUB_PAGE) || 'hub.html';
      location.replace(hub);
    }

    // ===== 遊戲邏輯 =====
    function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function startUnit(u){
      // 最後一道關門：不管從哪裡被呼叫，鎖住的關卡就是進不去
      if(!u || !unitOpen(u.no)){ refuse(u ? u.no : 1); return; }
      clearTimers();
      state.unit=u; state.status='read'; state.refOpen=false; state.graderOpen=false;
      state.readLeft=readSecondsFor(u); state.hintUsed=false;   // 每關重新計時、提示機會重置
      render();
    }
    /* ⚠️ 2026-08-11：這一行本來是 `if(readTimer){clearInterval(readTimer);…}`。
       改用 READHOLD 之後 readTimer 這個變數已經不存在了，而這裡漏改 ——
       於是按下「我讀完了，開始闖關」的**第一行就丟 ReferenceError**，
       後面的 render() 根本跑不到。
       畫面上的症狀是「按了完全沒反應」：沒有錯誤、沒有動靜，
       只有 F12 主控台裡一行紅字。
       ★ 停計時器一律走 clearTimers()，不要在各處自己動內部變數 ——
         漏改的那一處不會有任何徵兆。 */
    function beginSelect(){ clearTimers(); const u=state.unit; state.candidates=buildCandidates(u); state.selected={}; state.selMsg=''; state.status='select'; render(); }
    function toggleSelect(step){ state.selected[step]=!state.selected[step]; state.selMsg=''; render(); }
    function confirmSelect(){
      const chosen = Object.keys(state.selected).filter(s=>state.selected[s]);
      const need = state.unit.steps;
      const missing = need.filter(s=>!state.selected[s]).length;
      const extra = chosen.filter(s=>!need.includes(s)).length;
      if(missing===0 && extra===0){ state.placed=[]; state.pool=shuffle(need); state.mistakes=0; state.status='play'; render(); return; }

      // 選錯：用掉一次機會，三次用完就退回重新閱讀
      state.selTries++;
      const left = SELECT_TRIES - state.selTries;
      if(left <= 0){
        clearTimers();
        state.status='read'; state.readLeft=readSecondsFor(state.unit); state.hintUsed=false; state.hintLeft=0; state.selTries=0;
        state.selMsg='';
        render();
        setTimeout(()=>alert('三次都沒挑對，先回去把步驟再讀一次，我們再來一次！'), 50);
        return;
      }
      state.selMsg = `再想想～${missing?`還少了 ${missing} 個需要的步驟`:''}${missing&&extra?'、':''}${extra?`多選了 ${extra} 個用不到的`:''}。還有 ${left} 次機會，用完要回去重讀喔！`;
      render();
    }
    function pickStep(idx){
      const step = state.pool[idx];
      const nextCorrect = state.unit.steps[state.placed.length];
      if(step === nextCorrect){
        state.placed.push(step);
        state.pool.splice(idx,1);
        if(state.placed.length === state.unit.steps.length) finishUnit();
        else render();
      } else {
        state.mistakes++;
        // 錯誤次數超過待排積木總數 → 退回重新閱讀
        if(state.mistakes > state.unit.steps.length){
          clearTimers();
          state.status='read'; state.readLeft=readSecondsFor(state.unit); state.hintUsed=false; state.hintLeft=0;
          state.selTries=0; state.selMsg=''; state.mistakes=0;
          render();
          setTimeout(()=>alert('排錯太多次了，先回去把流程再讀一次，等一下就會順很多！'), 50);
          return;
        }
        render();
        setTimeout(()=>{ const el=document.getElementById('pool'); if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),300);} }, 0);
      }
    }
    async function finishUnit(){
      const already = !!state.done[state.unit.id];
      state.done[state.unit.id]=true;
      state.status='clear'; render();
      if(!already){
        const count = Object.keys(state.done).length;
        const now = Date.now();
        try{
          await setDoc(doc(db, COLLECTION, state.studentId), {
            studentId: state.studentId,
            modules: { flowchart: { status: count>=UNITS.length?'pass':'in-progress', level: count, stars: window.GRADING.flowchartStars(count), source:'auto', units: arrayUnion(state.unit.id), updatedAt: now } },
            history: arrayUnion({ module:'flowchart', unit: state.unit.id, at: now, stars: STARS_PER_UNIT }),
            updatedAt: now
          }, { merge:true });
        }catch(e){ console.error('回報失敗',e); }
      }
    }

    // ===== 畫面 =====
    function render(){
      const el=document.getElementById('app');
      /* ⚠️ 逾時不再換成登入畫面，只補一行「比較慢」的提示。
         換畫面會讓學生以為要重新登入，而那個登入頁根本沒有功能。 */
      if(state.status==='loading'){ el.innerHTML=`<div class="min-h-screen flex flex-col items-center justify-center gap-3 text-slate-500 font-bold text-lg"><div>系統連線中…</div>${state.slowNote?`<div class="text-sm text-slate-400 font-normal">${state.slowNote}</div>`:''}</div>`; return; }


      if(state.status==='menu'){
        const doneCount = Object.keys(state.done).length;
        // 程式設計：由 AI 批改星數認定（0 星不算通關）
        const progStarTotal = Object.values(state.progStars||{}).reduce((a,b)=>a+(Number(b)||0),0);
        const progDoneCount = Object.values(state.progStars||{}).filter(v=>Number(v)>0).length;
        /* 加分星要一起顯示，否則交過作業的學生會看到
           「闖關基地 55⭐、點進來 45⭐」——同一份成績兩個數字。
           ★ 算法走 GRADING.bonusStars（和 hub、教師端同一支）。 */
        const bonusImg = (window.GRADING ? window.GRADING.bonusStars(state.imgUnits,'img') : 0);
        const bonusVid = (window.GRADING ? window.GRADING.bonusStars(state.vidUnits,'vid') : 0);
        const bonusAll = bonusImg + bonusVid;
        const grand = doneCount*STARS_PER_UNIT + progStarTotal + bonusAll;
        const openTo = openUpTo();
        /* ── 關卡小卡 ─────────────────────────────────────────
           ⚠️⚠️ 2026-08-17 老師：「比起 11502，11501 的入口小卡過於簡約，

                   排序考的是「先後關係」，不是記憶力，所以目標一直放著。 -->
              <div class="mt-3 bg-purple-50 border border-purple-200 rounded-xl px-4 py-3">
                <div class="text-xs font-black text-purple-700 mb-1">🎯 這個程式要做什麼</div>
                <p class="text-sm text-purple-900/80 leading-relaxed">${u.desc}</p>
              </div>

              <!-- 排到哪裡就提示到哪裡。不說答案，只把「現在該想什麼」講清楚。 -->
              <p class="text-slate-600 text-sm mt-3 font-medium">${nudge}</p>
              <p class="text-slate-400 text-xs mt-1">每張卡片下面那行灰字，是這一步在做什麼 —— 看懂了再決定它該排在哪。</p>

              <details class="mt-3">
                <summary class="cursor-pointer text-xs font-bold text-slate-500 hover:text-purple-600">📖 再看一次這一關的重點</summary>
                <ul class="mt-2 space-y-1 text-xs text-slate-500 leading-relaxed list-disc list-inside">
                  ${(u.details||[]).map(d=>`<li>${d}</li>`).join('')}
                </ul>
              </details>
            </div>
            <div class="mb-2 text-xs font-black text-purple-500">🧩 流程圖（${state.placed.length}/${u.steps.length}）</div>
            <div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-4 mb-6 min-h-[80px]">
              ${state.placed.length?placedHtml:'<div class="text-slate-400 text-sm text-center py-4">點下方步驟開始排列…</div>'}
            </div>
            <div class="text-xs font-black text-slate-500 mb-2">👇 選出下一步</div>
            <div id="pool" class="grid grid-cols-1 sm:grid-cols-2 gap-2">${poolHtml||'<div class="text-emerald-600 font-bold">全部排完了！</div>'}</div>
          </div>`;
        return;
      }

      /* 「再看一次流程圖代碼」——只給**排對過**的關卡，純檢視、不動進度。
         ⚠️ 沒排過的關卡看不到：那等於直接給答案。 */
      if(state.status==='mermaid'){
        const u = state.mmdUnit;
        el.innerHTML = `
          <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 pop">
              <div class="text-[11px] text-slate-400 font-mono">第 ${u.no} 關 · ${u.id}</div>
              <h2 class="font-black text-2xl mb-1">${u.title}</h2>
              <p class="text-sm text-slate-500 mb-4">
                你已經排對過這一關的流程圖，程式碼隨時可以再拿 —— 不用重排。
              </p>
              ${mermaidPanel(u)}
              <div class="flex flex-wrap gap-2">
                <button id="back-menu2" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-5 py-2.5 rounded-lg transition">回關卡列表</button>
              </div>
            </div>
          </div>`;
        return;
      }
      if(state.status==='clear'){
        const u=state.unit;
        const fc = u.steps.map((s,i)=>`<div class="flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center flex-shrink-0">${i+1}</span><span class="text-sm">${s}</span></div>${i<u.steps.length-1?'<div class="text-purple-300 text-center leading-none">↓</div>':''}`).join('');
        const doneCount = Object.keys(state.done).length;
        el.innerHTML = `
          <div class="max-w-xl mx-auto px-4 sm:px-6 py-10">
            <div class="bg-white rounded-2xl border border-emerald-200 shadow-lg p-6 text-center pop">
              <div class="text-5xl mb-2">🎉</div>
              <h2 class="text-2xl font-black text-emerald-700 mb-1">流程圖完成！</h2>
              <p class="text-slate-500 text-sm mb-4">${u.title}　獲得 <b class="text-amber-500">+${STARS_PER_UNIT}⭐</b>（累積 ${doneCount*STARS_PER_UNIT}⭐）</p>
              <div class="bg-slate-50 rounded-xl border border-slate-200 p-4 text-left space-y-1 mb-4">${fc}</div>

              <!-- 把剛排好的流程圖變成 Mermaid 程式碼。
                   排卡片排出來的是「順序」，但流程圖真正的重點是形狀有意義：
                   圓角起訖、矩形處理、菱形判斷、平行四邊形輸入輸出。
                   貼到 Mermaid 看到它長成正式的流程圖，那些形狀才會變成
                   自己畫得出來的東西，而不只是課本上的圖。 -->
              ${mermaidPanel(u)}
              <div class="flex flex-wrap gap-2 justify-center">
                <button id="to-program" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2.5 rounded-lg transition">🐱 接著做程式設計 →</button>
                <button id="back-menu2" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-5 py-2.5 rounded-lg transition">回關卡列表</button>
              </div>
            </div>
          </div>`;
        return;
      }

      if(state.status==='program'){
        const u=state.unit; const p=PROG[u.id]; const c=COLORS[u.color]||COLORS.purple;
        const total=(state.quizSet||[]).length; const q=(state.quizSet||[])[state.qIdx];
        const quizArea = state.qIdx>=total
          ? (state.qScore===total
            ? `<div class="text-center py-4">
                 <div class="text-4xl mb-2">🎉</div>
                 <p class="font-black text-emerald-700 text-lg">全對！${total} / ${total} 通過檢核</p>
                 <p class="text-sm text-slate-500 mt-1">已解鎖上方的<b>程式截圖／範例</b>，可以對照著實作了。</p>
                 <p class="text-sm font-bold text-emerald-700 mt-3 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">👉 寫好程式後，到<b>右邊的「程式評分」</b>上傳 .sb3 就能拿星星</p>
               </div>`
            : `<div class="text-center py-4">
                 <div class="text-4xl mb-2">🤔</div>
                 <p class="font-black text-amber-700 text-lg">答對 ${state.qScore} / ${total}，還要再加油！</p>
                 <p class="text-sm text-slate-500 mt-1">要<b>全部答對</b>才能解鎖程式截圖。回去看看影片，再挑戰一次吧！</p>
                 <button id="retry-quiz" class="mt-4 bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-3 rounded-xl transition">🔄 換 ${total} 題再挑戰</button>
               </div>`)
          : `<div class="text-xs text-slate-400 mb-2">第 ${state.qIdx+1} / ${total} 題</div>
             <p class="font-bold text-slate-800 mb-3">${q.q}</p>
             <div class="space-y-2">
               ${q.o.map((opt,i)=>{
                 let cls='bg-white border-slate-200 hover:border-orange-300';
                 if(state.qPicked!=null){ if(i===q.a) cls='bg-emerald-50 border-emerald-400 text-emerald-700'; else if(i===state.qPicked) cls='bg-red-50 border-red-400 text-red-700'; else cls='bg-white border-slate-200 opacity-60'; }
                 return `<button data-ans="${i}" class="ans-btn w-full text-left border-2 rounded-lg px-3 py-2.5 text-sm font-medium transition ${cls}">${opt}</button>`;
               }).join('')}
             </div>
             ${state.qPicked!=null?`<div class="mt-3 text-right"><button id="next-q" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2 rounded-lg transition">${state.qIdx<total-1?'下一題 →':'看結果 →'}</button></div>`:''}`;
        el.innerHTML = `
          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
            <div class="flex items-center justify-between mb-4">
              <!-- 這一頁的返回鍵同時會重讀進度，星數才會即時更新（不另設第二顆按鈕） -->
              <button id="back-refresh" class="text-slate-400 hover:text-slate-700 text-sm font-bold">← 關卡列表</button>
              <div class="text-xs text-slate-400">第 ${u.no} 關 · 程式設計</div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
            <!-- 左：教材與檢核 -->
            <div class="space-y-5">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden pop">
              <div class="p-4 flex items-center gap-3 border-b border-slate-100">
                <div class="w-12 h-12 rounded-xl ${c.split(' ').slice(0,2).join(' ')} flex items-center justify-center text-2xl flex-shrink-0 border ${c.split(' ')[2]}">${u.icon}</div>
                <div><div class="text-[11px] text-emerald-600 font-bold">✓ 流程圖完成</div><h2 class="text-xl font-black leading-tight">${u.title} · 寫程式</h2></div>
              </div>
              <div class="p-4 space-y-4">
                <div>
                  <div class="text-xs font-black text-orange-500 mb-2">🎬 教學影片</div>
                  <div class="relative rounded-xl overflow-hidden bg-black" style="padding-top:56.25%">
                    <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/${p.video}" title="教學影片" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                  </div>
                </div>
                ${p.imgs&&p.imgs.length?(state.quizPassed
                  ? `<div><div class="text-xs font-black text-orange-500 mb-2">🖼️ 程式截圖／範例　<span class="text-emerald-600">（已解鎖）</span></div><div class="grid gap-2 ${p.imgs.length>1?'sm:grid-cols-2':''}">${p.imgs.map(src=>`<img src="${src}" class="rounded-lg border border-slate-200 w-full" loading="lazy" alt="程式截圖">`).join('')}</div></div>`
                  : `<div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-5 text-center">
                       <div class="text-3xl mb-1">🔒</div>
                       <div class="text-sm font-black text-slate-600">程式截圖／範例尚未解鎖</div>
                       <div class="text-xs text-slate-500 mt-1">先看完影片，完成下方的<b>自我檢核測驗（${QUIZ_PICK} 題全對）</b>就會顯示。</div>
                     </div>`):''}
                ${refPanel(u)}
                <a href="https://scratch.mit.edu/projects/${p.project}" target="_blank" rel="noopener" class="block text-center bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition">🐱 打開 Scratch 專案，動手實作 →</a>
              </div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 pop">
              <div class="text-xs font-black text-orange-500 mb-3">✅ 自我檢核測驗（從題庫抽 ${QUIZ_PICK} 題，<b class="text-emerald-600">全對</b>才解鎖程式截圖）</div>
              ${quizArea}
            </div>
            </div>

            <!-- 右：程式評分（常駐，隨時可上傳；高度隨內容自動調整，不用內部捲軸） -->
            <div>
              <div class="bg-white rounded-2xl border-2 border-orange-300 shadow-sm overflow-hidden pop">
                <div class="bg-orange-50 px-4 py-3 border-b border-orange-200">
                  <div class="text-sm font-black text-orange-800">🤖 程式評分（AI 助教）</div>
                  <div class="text-[11px] text-orange-700 leading-snug mt-0.5 lg:whitespace-nowrap">寫好存成 <b>.sb3</b> 上傳即可評分：<b>90 分↑ 3⭐、75 分↑ 2⭐</b>；未滿 75 分不給星，要修改後再傳。</div>
                </div>
                <iframe id="grader-frame" src="../shared/grader.html?term=${window.CONFIG.TERM}&unit=${u.id}" class="w-full block bg-white" style="height:560px;border:0;overflow:hidden" scrolling="no" title="Scratch 作品評分"></iframe>
                <div class="p-3 border-t border-slate-100 text-center">
                  <p class="text-[11px] text-slate-500">上傳後看到「⭐ 已記錄 N 星」就代表這一關完成了，不必再按任何按鈕。<br>要看更新後的星數，點左上角的「← 關卡列表」即可。</p>
                </div>
              </div>
            </div>
            </div>
          </div>`;
        wireGraderHeight();
        return;
      }

      // （舊的獨立『評分』步驟已移除：評分改為程式設計頁右欄常駐）

      // （程式階段完成畫面已移除：完成與否改由 AI 批改星數認定）
    }

    // ===== 事件 =====
    document.addEventListener('click', e=>{
      if(e.target.closest('#logout')){ logout(); return; }
      if(e.target.closest('#toggle-lead')){ state.leadOpen=!state.leadOpen; render(); return; }
      if(e.target.closest('#toggle-ref')){ state.refOpen=!state.refOpen; render(); return; }
      if(e.target.closest('#to-grade')){ state.status='grade'; render(); return; }
      if(e.target.closest('#hint-btn')){
        if(state.hintUsed){                    // 已用掉提示 → 退回上一步重新閱讀（重新計時 30 秒）
          clearTimers();
          state.status='read'; state.readLeft=readSecondsFor(state.unit); render();
        }else{
          showHint();                          // 第一次：顯示 10 秒
        }
        return;
      }
      // 流程圖已通關的關卡：點「直接去程式設計」跳過重排（必須放在 unit-btn 之前攔截）
      /* 🧜 再看一次流程圖代碼 —— 純檢視，不碰進度也不重排。 */
      const gm=e.target.closest('.go-mmd');
      if(gm){
        const no=+gm.dataset.mmd;
        clearTimers(); state.mmdUnit=UNITS[no-1]; state.status='mermaid'; render(); return;
      }
      const gp=e.target.closest('.go-prog');
      if(gp){
        const no=+gp.dataset.prog;
        if(!unitOpen(no)){ refuse(no); return; }
        clearTimers(); state.unit=UNITS[no-1]; state.refOpen=false; startProgram(); return;
      }
      const ub=e.target.closest('.unit-btn');
      if(ub){
        const no=+ub.dataset.unit;
        if(!unitOpen(no)){ refuse(no); return; }   // 鎖住的關卡：說明還缺什麼，不進去
        state.gateMsg=''; startUnit(UNITS[no-1]); return;
      }
      if(e.target.closest('#begin-sel')){ beginSelect(); return; }
      const sc=e.target.closest('.sel-chip'); if(sc){ toggleSelect(state.candidates[+sc.dataset.sel]); return; }
      if(e.target.closest('#confirm-sel')){ confirmSelect(); return; }
      const pk=e.target.closest('.pick-btn'); if(pk){ pickStep(+pk.dataset.pick); return; }
      if(e.target.closest('#copy-mmd')){
        const box = document.getElementById('mmd-code');
        const btn = e.target.closest('#copy-mmd');
        const txt = box ? box.textContent : '';
        // 電腦教室的瀏覽器不一定給剪貼簿權限，失敗時退回「幫你選起來，自己按 Ctrl+C」
        const ok = () => { btn.textContent = '✅ 複製好了，去貼上吧'; setTimeout(()=>{ btn.textContent='📋 複製程式碼'; }, 2500); };
        const fallback = () => {
          const r = document.createRange(); r.selectNodeContents(box);
          const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          btn.textContent = '已選取，請按 Ctrl+C';
        };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(ok).catch(fallback);
        } else { fallback(); }
        return;
      }
      if(e.target.closest('#to-program')){ startProgram(); return; }
      const ans=e.target.closest('.ans-btn'); if(ans){ pickAns(+ans.dataset.ans); return; }
      if(e.target.closest('#next-q')){ nextQ(); return; }
      if(e.target.closest('#retry-quiz')){ retryQuiz(); return; }
      if(e.target.closest('#back-refresh')){          // 從評分區回列表：先重讀進度，星數才會即時更新
        clearTimers();
        const btn=e.target.closest('#back-refresh'); if(btn){ btn.disabled=true; btn.textContent='更新中…'; }
        loadProgress(state.studentId).finally(()=>{ state.status='menu'; render(); });
        return;
      }
      if(e.target.closest('#back-menu')||e.target.closest('#back-menu2')){ clearTimers(); state.status='menu'; render(); return; }
    });
    document.addEventListener('input', e=>{
    });
    /* ⚠️ 2026-08-26 移除：這裡原本監聽登入頁的 Enter 鍵。
       那個登入頁已經整個拿掉了（見下方 status 的說明）。 */

    render();
  </script>
</body>
</html>
