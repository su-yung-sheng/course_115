    };

    // 每個單元的一句情境（機器人開場用）
    const INTRO = {
      '2-1-1A':'我們要用「清單」當成班級置物櫃，練習把物品 新增、插入、取代、刪除。',
      '2-1-1B':'要做集合點名：查某人在不在名單裡、全班總共幾人。',
      '2-1-2':'把音階存進清單，再用迴圈一個一個依序演奏出來。',
      '2-1-3':'把全班成績存進清單，加總算出平均，再判斷及不及格。',
      '2-1-4':'從全班座號中隨機抽人，而且抽過的人不能再被抽到。',
      '2-1-5':'先建立 52 張撲克牌、洗牌，再一張一張發出去。',
      '2-2-1':'比較「全域變數（大家共用）」和「角色變數（各自獨立）」的差別。',
      '2-2-2':'控制戰車移動、發射子彈，子彈打中敵機就扣血。',
      '2-3-1':'用「分身」產生很多小貓，而且每隻小貓都有自己的編號。',
      '2-3-2':'很多螞蟻去找乳酪、搬回蟻穴得分。'
    };

    // 依當前單元組出候選元件（正確步驟＋來自其他單元的陷阱）
    // 產生候選元件：正確步驟 + 陷阱；並補到「偶數」讓兩欄排版對齊
    function buildCandidates(u){
      const pool = [];
      UNITS.forEach(x=>{ if(x.id!==u.id) x.steps.forEach(s=>{ if(s!=='開始'&&s!=='結束'&&!u.steps.includes(s)) pool.push(s); }); });
      const bank = shuffle([...new Set(pool)]);
      let need = 3;                                   // 基本陷阱數
      if((u.steps.length + need) % 2 !== 0) need++;   // 總數湊成偶數（版面兩欄才不會落單）
      const distractors = bank.slice(0, Math.min(need, bank.length));
      return shuffle([...u.steps, ...distractors]);
    }

    let state = { status:'loading', studentId:'', studentName:'', tempId:'', tempCode:'', loginError:'', done:{}, progDone:{},
                  progStars:{}, unit:null, candidates:[], selected:{}, selMsg:'', placed:[], pool:[], mistakes:0,
                  qIdx:0, qPicked:null, qScore:0, refOpen:false, leadOpen:false, graderOpen:false,
                  readLeft:0, hintUsed:false, hintLeft:0, selTries:0,
                  quizSet:[], quizPassed:false,
                  leadDone:false,      // 前導教材「Scratch 清單學習機」是否已通過結業測驗
                  gateMsg:'' };        // 點到鎖住的關卡時，顯示在列表上方的說明

    /* ===== 依序開放 =====
       規則本體在 shared/grading.js 的 GRADING.GATE，這裡只呼叫。
       ⚠️ 這是課堂秩序機制，擋的是「順手亂點」，不是防作弊：
          會開 F12 的學生繞得過前端。真正繞不過的是每一關的程式星數——
          那是 AI 批改寫進去的，而且安全規則有寫入幅度防呆。 */
    // grading.js 沒載進來時「全部鎖住」而不是「全部放行」——
    // 規則檔載入失敗只是網路問題，不該變成整班可以隨便跳關。
    const GATE = (window.GRADING && window.GRADING.GATE) || {
      cleared:  function(){ return false; },
      openUpTo: function(){ return 0; },
      isOpen:   function(){ return false; },
      reason:   function(){ return '闖關規則沒有載入成功，請重新整理頁面；若一直這樣請找老師。'; }
    };
    function openUpTo(){ return GATE.openUpTo(UNITS, state.leadDone, state.done, state.progStars); }
    function unitOpen(no){ return GATE.isOpen(no, UNITS, state.leadDone, state.done, state.progStars); }
    function lockReason(no){ return GATE.reason(no, UNITS, state.leadDone, state.done, state.progStars); }

    /** 點到鎖住的關卡：把原因顯示在列表上方，並捲回頂端讓學生看得到 */
    function refuse(no){
      state.gateMsg = lockReason(no);
      if(!state.leadDone) state.leadOpen = true;   // 卡在前導 → 順手展開教材，不用再找
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    // 自動畫重點：把「」內的關鍵詞塗上螢光筆；數字＋單位（例如 52 張、1 到 26）用藍色
    function mark(t){
      return String(t||'')
        .replace(/「([^」]+)」/g, '<span class="hl">「$1」</span>')
        .replace(/(\d+(?:\s*[～~-]\s*\d+)?\s*(?:張|次|項|個|人|拍|秒|分))/g, '<span class="hl-b">$1</span>');
    }

    const READ_SECONDS = 30;   // 閱讀頁強制停留秒數（切走畫面會暫停）
    const HINT_SECONDS = 10;   // 選件頁提示顯示秒數（只有一次機會）
    const SELECT_TRIES = 3;    // 選元件可確認的次數，用完退回重讀
    let readTimer = null, hintTimer = null;
    function clearTimers(){
      if(readTimer){ clearInterval(readTimer); readTimer=null; }
      if(hintTimer){ clearInterval(hintTimer); hintTimer=null; }
    }
    // 閱讀倒數：直接改按鈕文字，不整頁重繪（避免內嵌教材 iframe 被重載）
    // ⏸ 只有「這個分頁在前景」時才會倒數；切到別的分頁／視窗會暫停，要保持關注才算秒數
    function isWatching(){ return !document.hidden && document.hasFocus(); }
    function startReadCountdown(){
      const paint = () => {
        const btn = document.getElementById('begin-sel');
        if(!btn) return;
        if(state.readLeft > 0){
          btn.disabled = true;
          btn.textContent = isWatching()
            ? `請先仔細閱讀…（還要 ${state.readLeft} 秒）`
            : `⏸ 已暫停：請回到這個畫面才會繼續倒數（還要 ${state.readLeft} 秒）`;
          btn.className = 'mt-5 w-full bg-slate-300 text-white font-bold text-lg py-3 rounded-xl cursor-not-allowed transition';
        }else{
          btn.disabled = false;
          btn.textContent = '我讀完了，開始闖關 →';
          btn.className = 'mt-5 w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-lg py-3 rounded-xl active:scale-95 transition';
        }
      };
      paint();
      if(readTimer) clearInterval(readTimer);
      readTimer = setInterval(() => {
        if(!isWatching()){ paint(); return; }        // 沒在看 → 不扣秒數
        state.readLeft--;
        if(state.readLeft <= 0){ state.readLeft = 0; clearInterval(readTimer); readTimer = null; }
        paint();
      }, 1000);
    }
    // 切回畫面時立刻更新提示文字
    ['visibilitychange','focus','blur'].forEach(ev=>{
      window.addEventListener(ev, ()=>{ if(state.status==='read' && readTimer){ const b=document.getElementById('begin-sel'); if(b) b.textContent = isWatching()?`請先仔細閱讀…（還要 ${state.readLeft} 秒）`:`⏸ 已暫停：請回到這個畫面才會繼續倒數（還要 ${state.readLeft} 秒）`; } });
    });
    // 讓右側「程式評分」iframe 自動長成內容高度：不出現內部捲軸，整頁只用外層捲軸
    function autoSizeGraderFrame(){
      const f = document.getElementById('grader-frame');
      if(!f) return;
      const fit = () => {
        try{
          const d = f.contentDocument;
          if(!d || !d.body) return;
          const h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
          if(h > 0) f.style.height = (h + 12) + 'px';
        }catch(e){ /* 跨網域時忽略 */ }
      };
      f.addEventListener('load', () => {
        fit();
        try{ new ResizeObserver(fit).observe(f.contentDocument.body); }catch(e){}
        [300, 800, 1500, 3000].forEach(t => setTimeout(fit, t));   // 圖片／字型載入後再校正
      });
    }

    // 選件頁提示：顯示 10 秒後自動收起（每關只有一次機會）
    // 用 state.hintLeft 記錄剩餘秒數，即使中途重繪（例如點選元件）也不會中斷
    function paintHint(){
      const box = document.getElementById('hint-box');
      const btn = document.getElementById('hint-btn');
      if(!box || !btn) return;
      if(state.hintLeft > 0){
        box.classList.remove('hidden');
        btn.textContent = `💡 提示顯示中…${state.hintLeft} 秒`;
      }else{
        box.classList.add('hidden');
        btn.textContent = state.hintUsed ? '📖 回上一步重新閱讀' : '💡 提示（只有 1 次，顯示 10 秒）';
      }
    }
    function showHint(){
      state.hintUsed = true;
      state.hintLeft = HINT_SECONDS;
      paintHint();
      if(hintTimer) clearInterval(hintTimer);
      hintTimer = setInterval(() => {
        state.hintLeft--;
        if(state.hintLeft <= 0){ state.hintLeft = 0; clearInterval(hintTimer); hintTimer = null; }
        paintHint();
      }, 1000);
    }
    const LEAD = { href:'whatislist.html', title:'Scratch 清單學習機', note:'寫程式前先搞懂「清單（陣列）」怎麼存放一整排資料。' };

    // 內嵌參考教材面板（用 iframe 直接把教材放進本關頁面）
    function refPanel(u){
      if(!u.ref) return '';
      return `
        <div class="border border-rose-200 rounded-xl overflow-hidden mt-4">
          <button id="toggle-ref" class="w-full flex items-center justify-between gap-2 bg-rose-50 hover:bg-rose-100 px-3 py-2.5 text-left transition">
            <span class="flex items-center gap-2"><span class="text-lg">🎵</span><span><span class="text-sm font-bold text-rose-700">參考教材：${u.ref.title}</span><span class="block text-xs text-rose-500 leading-snug">${u.ref.note||''}</span></span></span>
            <span class="text-rose-500 font-black flex-shrink-0">${state.refOpen?'▾ 收合':'▸ 展開'}</span>
          </button>
          ${state.refOpen?`<iframe src="${u.ref.href}" class="w-full block bg-white" style="height:72vh;border:0" title="${u.ref.title}" loading="lazy"></iframe><div class="text-[11px] text-slate-400 px-3 py-1.5 text-center bg-rose-50">教材已嵌在此，看完往上滑繼續</div>`:''}
        </div>`;
    }

    // ===== 認證與登入 =====
    signInAnonymously(auth).catch(e=>console.error(e));
    onAuthStateChanged(auth, user=>{
      if(user && state.status==='loading'){
        const saved = sessionStorage.getItem(SAVED_KEY);
        if(saved && /^14\d{5}$/.test(saved)) autoLogin(saved);
        else { state.status='login'; render(); }
      }
    });
    setTimeout(()=>{ if(state.status==='loading'){ state.status='login'; render(); } }, 2500);

    async function loadProgress(sid){
      try{
        const snap = await getDoc(doc(db, COLLECTION, sid));
        const mods = (snap.exists() && snap.data().modules) || {};
        const units = (mods.flowchart && mods.flowchart.units) || [];
        state.done = {}; units.forEach(u=>state.done[u]=true);
        const sunits = (mods.scratch && mods.scratch.units) || [];
        state.progDone = {}; sunits.forEach(u=>state.progDone[u]=true);
        // 各單元的程式星數（由 AI 批改寫入）→ 有星數就代表這關的程式完成了
        state.progStars = (mods.scratch && mods.scratch.unitStars) || {};
        // 前導教材：hub 也讀同一個 modules.list
        state.leadDone = !!(mods.list && mods.list.status === 'pass');
      }catch(e){ console.error('讀進度失敗',e); }
    }

    /* 前導教材通過：由 whatislist.html（嵌在下面的 iframe）用 postMessage 通知。
       那一頁刻意不碰 Firebase——它沒有學生身分，寫進度是這一頁的事。 */
    window.addEventListener('message', async e=>{
      if(e.origin !== location.origin) return;                 // 只收自己站台的訊息
      const d = e.data;
      if(!d || d.type !== 'lead-done' || d.module !== 'list') return;
      if(!state.studentId || state.leadDone) return;
      state.leadDone = true;                                   // 先更新畫面，不讓學生空等
      state.gateMsg = '';
      render();
      try{
        await setDoc(doc(db, COLLECTION, state.studentId), {
          modules: { list: { status:'pass', at: new Date().toISOString() } }
        }, { merge:true });
      }catch(err){
        console.error('前導完成寫入失敗', err);
        state.leadDone = false;
        state.gateMsg = '前導教材的完成紀錄沒存進去（可能是網路問題）。請重新整理再試一次，若還是不行請找老師。';
        render();
      }
    });
    async function autoLogin(sid){
      state.studentId = sid;
      try{ const r = await getDoc(doc(db, ROSTER, sid)); if(r.exists()) state.studentName = r.data().name||''; }catch(e){}
      await loadProgress(sid);
      state.status='menu'; render();
    }
    async function handleLogin(){
      const t=(state.tempId||'').trim(), c=(state.tempCode||'').trim();
      if(!/^14\d{5}$/.test(t)){ state.loginError='學號格式錯誤：需 7 位數字、以 14 開頭'; render(); return; }
      if(!/^\d{6}$/.test(c)){ state.loginError='請輸入 6 位數字驗證碼'; render(); return; }
      try{
        const r = await getDoc(doc(db, ROSTER, t));
        if(!r.exists()){ state.loginError=`找不到學號 ${t}，請找老師確認名冊`; render(); return; }
        const info = r.data();
        if(!info.code){ state.loginError='此學號尚未設定驗證碼，請先到「闖關基地」首次登入設定'; render(); return; }
        if(String(info.code)!==c){ state.loginError='驗證碼錯誤'; render(); return; }
        state.studentName = info.name||'';
      }catch(e){ state.loginError='驗證失敗，請稍後再試'; render(); return; }
      state.studentId=t; sessionStorage.setItem(SAVED_KEY, t);
      await loadProgress(t);
      state.loginError=''; state.status='menu'; render();
    }
    // 程式設計階段：測驗從題庫「5 選 3」，全對才算通過（通過才解鎖程式截圖）
    const QUIZ_PICK = 3;
    function newQuizSet(u){ return shuffle([...(PROG[u.id].quiz||[])]).slice(0, QUIZ_PICK); }
    function startProgram(){
      if(!state.unit || !unitOpen(state.unit.no)){ refuse(state.unit ? state.unit.no : 1); return; }
      state.quizSet = newQuizSet(state.unit);
      state.qIdx=0; state.qPicked=null; state.qScore=0; state.quizPassed=false;
      state.status='program'; render();
    }
    function retryQuiz(){                      // 沒全對 → 重新抽 3 題再來
      state.quizSet = newQuizSet(state.unit);
      state.qIdx=0; state.qPicked=null; state.qScore=0; render();
    }
    function pickAns(i){
      if(state.qPicked!=null) return;
      state.qPicked=i;
      const q=state.quizSet[state.qIdx];
      if(i===q.a) state.qScore++;
      render();
    }
    function nextQ(){
      state.qIdx++; state.qPicked=null;
      if(state.qIdx>=state.quizSet.length && state.qScore===state.quizSet.length) state.quizPassed=true;
      render();
    }
    // finishProgram 已移除：完成由 AI 批改星數自動認定
    /* 登出要把「上一個人的進度」清乾淨。
       教室是共用電腦，殘留 progStars／leadDone 會讓下一位同學看到別人的解鎖狀態。 */
    function logout(){ sessionStorage.removeItem(SAVED_KEY); state.status='login'; state.studentId=''; state.studentName=''; state.tempId=''; state.tempCode='';
      state.done={}; state.progDone={}; state.progStars={}; state.leadDone=false; state.gateMsg=''; state.leadOpen=false; render(); }

    // ===== 遊戲邏輯 =====
    function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function startUnit(u){
      // 最後一道關門：不管從哪裡被呼叫，鎖住的關卡就是進不去
      if(!u || !unitOpen(u.no)){ refuse(u ? u.no : 1); return; }
      clearTimers();
      state.unit=u; state.status='read'; state.refOpen=false; state.graderOpen=false;
      state.readLeft=READ_SECONDS; state.hintUsed=false;   // 每關重新計時、提示機會重置
      render();
    }
    function beginSelect(){ if(readTimer){clearInterval(readTimer);readTimer=null;} const u=state.unit; state.candidates=buildCandidates(u); state.selected={}; state.selMsg=''; state.status='select'; render(); }
    function toggleSelect(step){ state.selected[step]=!state.selected[step]; state.selMsg=''; render(); }
    function confirmSelect(){
      const chosen = Object.keys(state.selected).filter(s=>state.selected[s]);
      const need = state.unit.steps;
      const missing = need.filter(s=>!state.selected[s]).length;
      const extra = chosen.filter(s=>!need.includes(s)).length;
      if(missing===0 && extra===0){ state.placed=[]; state.pool=shuffle(need); state.mistakes=0; state.status='play'; render(); return; }

      // 選錯：用掉一次機會，三次用完就退回重新閱讀
      state.selTries++;
      const left = SELECT_TRIES - state.selTries;
      if(left <= 0){
        clearTimers();
        state.status='read'; state.readLeft=READ_SECONDS; state.hintUsed=false; state.hintLeft=0; state.selTries=0;
        state.selMsg='';
        render();
        setTimeout(()=>alert('三次都沒挑對，先回去把步驟再讀一次，我們再來一次！'), 50);
        return;
      }
      state.selMsg = `再想想～${missing?`還少了 ${missing} 個需要的步驟`:''}${missing&&extra?'、':''}${extra?`多選了 ${extra} 個用不到的`:''}。還有 ${left} 次機會，用完要回去重讀喔！`;
      render();
    }
    function pickStep(idx){
      const step = state.pool[idx];
      const nextCorrect = state.unit.steps[state.placed.length];
      if(step === nextCorrect){
        state.placed.push(step);
        state.pool.splice(idx,1);
        if(state.placed.length === state.unit.steps.length) finishUnit();
        else render();
      } else {
        state.mistakes++;
        // 錯誤次數超過待排積木總數 → 退回重新閱讀
        if(state.mistakes > state.unit.steps.length){

          state.selTries=0; state.selMsg=''; state.mistakes=0;

            </div>
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-5 pop">
              <div class="text-xs text-purple-600 font-bold mb-1">第 ${u.no} 關</div>
              <h2 class="text-xl font-black">${u.title} — 排出正確流程圖</h2>
              <p class="text-slate-500 text-sm mt-1">從下方點選「下一步」，把流程圖從「開始」排到「結束」。順序對才會加進去。</p>
            </div>
            <div class="mb-2 text-xs font-black text-purple-500">🧩 流程圖（${state.placed.length}/${u.steps.length}）</div>
            <div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-4 mb-6 min-h-[80px]">
              ${state.placed.length?placedHtml:'<div class="text-slate-400 text-sm text-center py-4">點下方步驟開始排列…</div>'}
            </div>
            <div class="text-xs font-black text-slate-500 mb-2">👇 選出下一步</div>
            <div id="pool" class="grid grid-cols-1 sm:grid-cols-2 gap-2">${poolHtml||'<div class="text-emerald-600 font-bold">全部排完了！</div>'}</div>
          </div>`;
        return;
      }

      if(state.status==='clear'){
        const u=state.unit;
        const fc = u.steps.map((s,i)=>`<div class="flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center flex-shrink-0">${i+1}</span><span class="text-sm">${s}</span></div>${i<u.steps.length-1?'<div class="text-purple-300 text-center leading-none">↓</div>':''}`).join('');
        const doneCount = Object.keys(state.done).length;
        el.innerHTML = `
          <div class="max-w-xl mx-auto px-4 sm:px-6 py-10">
            <div class="bg-white rounded-2xl border border-emerald-200 shadow-lg p-6 text-center pop">
              <div class="text-5xl mb-2">🎉</div>
              <h2 class="text-2xl font-black text-emerald-700 mb-1">流程圖完成！</h2>
              <p class="text-slate-500 text-sm mb-4">${u.title}　獲得 <b class="text-amber-500">+${STARS_PER_UNIT}⭐</b>（累積 ${doneCount*STARS_PER_UNIT}⭐）</p>
              <div class="bg-slate-50 rounded-xl border border-slate-200 p-4 text-left space-y-1 mb-5">${fc}</div>
              <div class="flex flex-wrap gap-2 justify-center">
                <button id="to-program" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2.5 rounded-lg transition">🐱 接著做程式設計 →</button>
                <button id="back-menu2" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-5 py-2.5 rounded-lg transition">回關卡列表</button>
              </div>
            </div>
          </div>`;
        return;
      }

      if(state.status==='program'){
        const u=state.unit; const p=PROG[u.id]; const c=COLORS[u.color]||COLORS.purple;
        const total=(state.quizSet||[]).length; const q=(state.quizSet||[])[state.qIdx];
        const quizArea = state.qIdx>=total
          ? (state.qScore===total
            ? `<div class="text-center py-4">
                 <div class="text-4xl mb-2">🎉</div>
                 <p class="font-black text-emerald-700 text-lg">全對！${total} / ${total} 通過檢核</p>
                 <p class="text-sm text-slate-500 mt-1">已解鎖上方的<b>程式截圖／範例</b>，可以對照著實作了。</p>
                 <p class="text-sm font-bold text-emerald-700 mt-3 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">👉 寫好程式後，到<b>右邊的「程式評分」</b>上傳 .sb3 就能拿星星</p>
               </div>`
            : `<div class="text-center py-4">
                 <div class="text-4xl mb-2">🤔</div>
                 <p class="font-black text-amber-700 text-lg">答對 ${state.qScore} / ${total}，還要再加油！</p>
                 <p class="text-sm text-slate-500 mt-1">要<b>全部答對</b>才能解鎖程式截圖。回去看看影片，再挑戰一次吧！</p>
                 <button id="retry-quiz" class="mt-4 bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-3 rounded-xl transition">🔄 換 ${total} 題再挑戰</button>
               </div>`)
          : `<div class="text-xs text-slate-400 mb-2">第 ${state.qIdx+1} / ${total} 題</div>
             <p class="font-bold text-slate-800 mb-3">${q.q}</p>
             <div class="space-y-2">
               ${q.o.map((opt,i)=>{
                 let cls='bg-white border-slate-200 hover:border-orange-300';
                 if(state.qPicked!=null){ if(i===q.a) cls='bg-emerald-50 border-emerald-400 text-emerald-700'; else if(i===state.qPicked) cls='bg-red-50 border-red-400 text-red-700'; else cls='bg-white border-slate-200 opacity-60'; }
                 return `<button data-ans="${i}" class="ans-btn w-full text-left border-2 rounded-lg px-3 py-2.5 text-sm font-medium transition ${cls}">${opt}</button>`;
               }).join('')}
             </div>
             ${state.qPicked!=null?`<div class="mt-3 text-right"><button id="next-q" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2 rounded-lg transition">${state.qIdx<total-1?'下一題 →':'看結果 →'}</button></div>`:''}`;
        el.innerHTML = `
          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
            <div class="flex items-center justify-between mb-4">
              <!-- 這一頁的返回鍵同時會重讀進度，星數才會即時更新（不另設第二顆按鈕） -->
              <button id="back-refresh" class="text-slate-400 hover:text-slate-700 text-sm font-bold">← 關卡列表</button>
              <div class="text-xs text-slate-400">第 ${u.no} 關 · 程式設計</div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
            <!-- 左：教材與檢核 -->
            <div class="space-y-5">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden pop">
              <div class="p-4 flex items-center gap-3 border-b border-slate-100">
                <div class="w-12 h-12 rounded-xl ${c.split(' ').slice(0,2).join(' ')} flex items-center justify-center text-2xl flex-shrink-0 border ${c.split(' ')[2]}">${u.icon}</div>
                <div><div class="text-[11px] text-emerald-600 font-bold">✓ 流程圖完成</div><h2 class="text-xl font-black leading-tight">${u.title} · 寫程式</h2></div>
              </div>
              <div class="p-4 space-y-4">
                <div>
                  <div class="text-xs font-black text-orange-500 mb-2">🎬 教學影片</div>
                  <div class="relative rounded-xl overflow-hidden bg-black" style="padding-top:56.25%">
                    <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/${p.video}" title="教學影片" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                  </div>
                </div>
                ${p.imgs&&p.imgs.length?(state.quizPassed
                  ? `<div><div class="text-xs font-black text-orange-500 mb-2">🖼️ 程式截圖／範例　<span class="text-emerald-600">（已解鎖）</span></div><div class="grid gap-2 ${p.imgs.length>1?'sm:grid-cols-2':''}">${p.imgs.map(src=>`<img src="${src}" class="rounded-lg border border-slate-200 w-full" loading="lazy" alt="程式截圖">`).join('')}</div></div>`
                  : `<div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-5 text-center">
                       <div class="text-3xl mb-1">🔒</div>
                       <div class="text-sm font-black text-slate-600">程式截圖／範例尚未解鎖</div>
                       <div class="text-xs text-slate-500 mt-1">先看完影片，完成下方的<b>自我檢核測驗（${QUIZ_PICK} 題全對）</b>就會顯示。</div>
                     </div>`):''}
                ${refPanel(u)}
                <a href="https://scratch.mit.edu/projects/${p.project}" target="_blank" rel="noopener" class="block text-center bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition">🐱 打開 Scratch 專案，動手實作 →</a>
              </div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 pop">
              <div class="text-xs font-black text-orange-500 mb-3">✅ 自我檢核測驗（從題庫抽 ${QUIZ_PICK} 題，<b class="text-emerald-600">全對</b>才解鎖程式截圖）</div>
              ${quizArea}
            </div>
            </div>

            <!-- 右：程式評分（常駐，隨時可上傳；高度隨內容自動調整，不用內部捲軸） -->
            <div>
              <div class="bg-white rounded-2xl border-2 border-orange-300 shadow-sm overflow-hidden pop">
                <div class="bg-orange-50 px-4 py-3 border-b border-orange-200">
                  <div class="text-sm font-black text-orange-800">🤖 程式評分（AI 助教）</div>
                  <div class="text-[11px] text-orange-700 leading-snug mt-0.5 lg:whitespace-nowrap">寫好存成 <b>.sb3</b> 上傳即可評分：<b>90 分↑ 3⭐、75 分↑ 2⭐</b>；未滿 75 分不給星，要修改後再傳。</div>
                </div>
                <iframe id="grader-frame" src="scratch_ScratchGrader_student.html?unit=${u.id}" class="w-full block bg-white" style="height:560px;border:0;overflow:hidden" scrolling="no" title="Scratch 作品評分"></iframe>
                <div class="p-3 border-t border-slate-100 text-center">
                  <p class="text-[11px] text-slate-500">上傳後看到「⭐ 已記錄 N 星」就代表這一關完成了，不必再按任何按鈕。<br>要看更新後的星數，點左上角的「← 關卡列表」即可。</p>
                </div>
              </div>
            </div>
            </div>
          </div>`;
        autoSizeGraderFrame();
        return;
      }

      // （舊的獨立『評分』步驟已移除：評分改為程式設計頁右欄常駐）

      // （程式階段完成畫面已移除：完成與否改由 AI 批改星數認定）
    }

    // ===== 事件 =====
    document.addEventListener('click', e=>{
      if(e.target.closest('#go')){ state.tempId=document.getElementById('sid').value; state.tempCode=document.getElementById('code').value; handleLogin(); return; }
      if(e.target.closest('#logout')){ logout(); return; }
      if(e.target.closest('#toggle-lead')){ state.leadOpen=!state.leadOpen; render(); return; }
      if(e.target.closest('#toggle-ref')){ state.refOpen=!state.refOpen; render(); return; }
      if(e.target.closest('#to-grade')){ state.status='grade'; render(); return; }
      if(e.target.closest('#hint-btn')){
        if(state.hintUsed){                    // 已用掉提示 → 退回上一步重新閱讀（重新計時 30 秒）
          clearTimers();
          state.status='read'; state.readLeft=READ_SECONDS; render();
        }else{
          showHint();                          // 第一次：顯示 10 秒
        }
        return;
      }
      // 流程圖已通關的關卡：點「直接去程式設計」跳過重排（必須放在 unit-btn 之前攔截）
      const gp=e.target.closest('.go-prog');
      if(gp){
        const no=+gp.dataset.prog;
        if(!unitOpen(no)){ refuse(no); return; }
        clearTimers(); state.unit=UNITS[no-1]; state.refOpen=false; startProgram(); return;
      }
      const ub=e.target.closest('.unit-btn');
      if(ub){
        const no=+ub.dataset.unit;
        if(!unitOpen(no)){ refuse(no); return; }   // 鎖住的關卡：說明還缺什麼，不進去
        state.gateMsg=''; startUnit(UNITS[no-1]); return;
      }
      if(e.target.closest('#begin-sel')){ beginSelect(); return; }
      const sc=e.target.closest('.sel-chip'); if(sc){ toggleSelect(state.candidates[+sc.dataset.sel]); return; }
      if(e.target.closest('#confirm-sel')){ confirmSelect(); return; }
      const pk=e.target.closest('.pick-btn'); if(pk){ pickStep(+pk.dataset.pick); return; }
      if(e.target.closest('#to-program')){ startProgram(); return; }
      const ans=e.target.closest('.ans-btn'); if(ans){ pickAns(+ans.dataset.ans); return; }
      if(e.target.closest('#next-q')){ nextQ(); return; }
      if(e.target.closest('#retry-quiz')){ retryQuiz(); return; }
      if(e.target.closest('#back-refresh')){          // 從評分區回列表：先重讀進度，星數才會即時更新
        clearTimers();
        const btn=e.target.closest('#back-refresh'); if(btn){ btn.disabled=true; btn.textContent='更新中…'; }
        loadProgress(state.studentId).finally(()=>{ state.status='menu'; render(); });
        return;
      }
      if(e.target.closest('#back-menu')||e.target.closest('#back-menu2')){ clearTimers(); state.status='menu'; render(); return; }
    });
    document.addEventListener('input', e=>{
      if(e.target.id==='sid') state.tempId=e.target.value;
      if(e.target.id==='code') state.tempCode=e.target.value;
    });
    document.addEventListener('keypress', e=>{ if(e.key==='Enter'&&state.status==='login'){ state.tempId=document.getElementById('sid').value; state.tempCode=document.getElementById('code').value; handleLogin(); } });

    render();
  </script>
</body>
</html>
