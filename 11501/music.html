<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music 簡譜與 Scratch 音階</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 全站統一字型：Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans TC"','system-ui','sans-serif'] } } } };</script>
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    /* 自訂滾動條樣式 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    /* 琴鍵按壓動畫輔助 */
    .key-pressed { transform: scaleY(0.98); box-shadow: inset 0 4px 6px rgba(0,0,0,0.35); }
    .key-active-white { background-color: #6366f1 !important; color: white !important; }
    .key-active-black { background-color: #4f46e5 !important; border-color: #4338ca !important; }
  </style>
<style>
/* === 全站紙膠帶手作風套件（以 hub 為準，勿重複注入） === */
body{ background-color:#e7e5e4 !important; background-image:linear-gradient(rgba(120,113,108,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,113,108,.06) 1px,transparent 1px) !important; background-size:26px 26px !important; }
.tape{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);width:76px;height:26px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08);background:rgba(250,204,21,.3);z-index:5}
.underline-doodle{background:linear-gradient(transparent 62%, rgba(250,204,21,.55) 62%)}

  <!-- 身分守門：未從闖關基地登入者導回入口 -->
  <script src="../shared/semester.js"></script>
<script src="../shared/guard.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-indigo-100 pb-12">

  <!-- 導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div id="header-container" class="max-w-[1440px] mx-auto px-6 h-18 flex items-center justify-between transition-all duration-300">
      <div class="flex items-center gap-3 text-indigo-600">
        <i data-lucide="music" class="w-8 h-8 stroke-[2.5]"></i>
        <h1 class="text-2xl font-bold tracking-wide hidden sm:block"><span class="underline-doodle">Music 簡譜與 Scratch 音階</span></h1>
        <h1 class="text-xl font-bold tracking-wide sm:hidden">互動簡譜</h1>
      </div>
      <div class="flex items-center gap-2 sm:gap-4">
        <!-- Scratch 模式切換 -->
        <button id="btn-scratch-toggle" class="flex items-center gap-1.5 sm:gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-bold transition-all border shadow-sm bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200">
          <i data-lucide="code" class="w-4 h-4 sm:w-5 sm:h-5"></i>
          <span id="scratch-toggle-text">Scratch (OFF)</span>
        </button>
        <!-- 頁籤切換 -->
        <div class="flex bg-slate-100 p-1 rounded-lg">
          <button id="tab-search" class="flex items-center gap-1.5 px-4 sm:px-5 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all bg-white text-indigo-600 shadow-sm">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span class="hidden sm:inline">曲庫與演奏</span>
            <span class="sm:hidden">曲庫</span>
          </button>
          <button id="tab-compose" class="flex items-center gap-1.5 px-4 sm:px-5 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all text-slate-500 hover:text-slate-700">
            <i data-lucide="pen-tool" class="w-4 h-4"></i>
            <span class="hidden sm:inline">手動創作</span>
            <span class="sm:hidden">創作</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 固定 max-w-[1440px] 寬度，使版面保持最精緻的結構 -->
  <main id="main-container" class="max-w-[1440px] mx-auto px-6 py-8 relative transition-all duration-300">
    
    <!-- ================= 視圖 1：曲庫與自動演奏 ================= -->
    <div id="view-search" class="space-y-6 block">
      
      <!-- 搜尋列 -->
      <div class="relative max-w-md">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
        <input type="text" id="search-input" placeholder="搜尋曲名或作者 (例如：小星星)..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-base shadow-sm">
      </div>

      <div class="grid lg:grid-cols-4 gap-6 items-start">
        
        <!-- 左側：歌單列表 (佔 1 格) -->
        <div class="lg:col-span-1 bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col h-[650px]">
          <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 font-semibold text-slate-700 flex justify-between items-center">
            <span>經典歌單</span>
            <span id="song-count" class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-bold"></span>
          </div>
          <div class="overflow-y-auto flex-1">
            <ul id="song-list" class="divide-y divide-slate-100">
              <!-- JS 動態產生歌單 -->
            </ul>
            <div id="no-results" class="hidden p-8 text-center text-slate-500 text-sm">找不到相關歌曲</div>
          </div>
        </div>

        <!-- 右側：簡譜顯示與大鋼琴 (佔 3 格) -->
        <div class="lg:col-span-3 space-y-6">
          
          <!-- 樂譜區：固定寬度平鋪，優化小音符排版 -->
          <div class="bg-white rounded-xl border border-slate-200 p-8 shadow-sm relative overflow-hidden">
            <i data-lucide="music" class="absolute right-6 top-6 text-indigo-50/70 w-32 h-32 pointer-events-none"></i>
            
            <div class="relative z-10">
              <div class="mb-6 pb-4 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="text-center sm:text-left">
                  <h2 id="song-title" class="text-3xl font-bold text-slate-900">載入中...</h2>
                  <p id="song-artist" class="text-slate-500 text-base mt-1">...</p>
                </div>
                
                <!-- 控制按鈕 -->
                <div class="flex gap-3">
                  <button id="btn-play" class="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md transition-all active:scale-95">
                    <i data-lucide="play" class="w-5 h-5 fill-white"></i> 自動彈奏
                  </button>
                  <button id="btn-stop" class="hidden items-center gap-2 px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold shadow-md transition-all active:scale-95">
                    <i data-lucide="square" class="w-5 h-5 fill-white"></i> 停止
                  </button>
                </div>
              </div>
              
              <!-- 簡譜內容 -->
              <div class="bg-slate-50 p-6 sm:p-8 rounded-xl border border-slate-100 min-h-[160px] flex items-center justify-start">
                <div id="jianpu-container" class="flex flex-col gap-y-4 sm:gap-y-5 text-xl sm:text-2xl font-bold text-slate-800 leading-none items-start w-full">
                  <!-- JS 動態產生樂譜符號 -->
                </div>
              </div>
            </div>
          </div>

          <!-- 自動演奏實況鋼琴：高度調整為精緻的 h-44 -->
          <div class="bg-slate-900 p-5 rounded-2xl shadow-xl border border-slate-800">
            <div class="flex justify-between items-center mb-4">
              <span class="text-sm text-slate-400 flex items-center gap-2 font-medium">
                <i data-lucide="volume-2" class="w-5 h-5 text-indigo-400"></i>
                演奏實況 (同步反應音高)
              </span>
              <span id="playing-indicator" class="hidden text-xs px-3 py-1.5 rounded-full bg-indigo-950 text-indigo-400 animate-pulse font-bold border border-indigo-800/50">
                系統演奏中...
              </span>
            </div>
            <!-- 琴鍵容器 (高度回歸 h-44，小巧精緻) -->
            <div id="auto-piano-container" class="relative h-44 w-full flex select-none bg-slate-950 p-1 rounded-lg border border-slate-800 overflow-hidden">
              <!-- JS 動態產生琴鍵 -->
            </div>
          </div>

        </div>
      </div>
    </div>


    <!-- ================= 視圖 2：手動創作 ================= -->
    <div id="view-compose" class="hidden max-w-5xl mx-auto space-y-8">
      
      <div class="text-center space-y-2">
        <h2 class="text-3xl font-bold text-slate-900">手動鋼琴彈奏</h2>
        <p class="text-slate-500 text-base">點擊下方大鍵盤發出聲音，系統將即時記錄您的旋律</p>
      </div>

      <!-- 互動鋼琴 (手動琴鍵還原至 h-52) -->
      <div class="bg-slate-900 p-6 rounded-2xl shadow-xl border border-slate-800 relative">
        <div class="flex items-center justify-between mb-6 text-slate-400">
          <span class="text-sm font-medium flex items-center gap-2">
            <i data-lucide="volume-2" class="w-5 h-5 text-indigo-400"></i>
            點擊琴鍵自由彈奏
          </span>
          <button id="btn-add-bar" class="text-sm font-bold text-indigo-400 bg-indigo-950/50 border border-indigo-800/50 px-4 py-2 rounded-full hover:bg-indigo-900/50 transition-colors">
            加入小節線 (|)
          </button>
        </div>
        
        <div id="compose-piano-container" class="relative h-52 w-full flex select-none bg-slate-950 p-1 rounded-lg border border-slate-800 overflow-hidden">
           <!-- JS 動態產生琴鍵 -->
        </div>
      </div>

      <!-- 彈奏錄製記錄 -->
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
          <span class="font-semibold text-slate-700">您的創作記錄</span>

        </div>
        <div class="p-6 min-h-[180px]">

            <!-- JS 動態產生彈奏記錄 -->
          </div>
          <div id="composed-empty" class="h-full flex items-center justify-center text-slate-400 text-sm mt-8">
            點選上方琴鍵，您的音符會即時顯示在此。
          </div>
        </div>
      </div>

    </div>

  </main>

      { id: 25, title: '桃太郎', artist: '日本童謠', notation: '1 1 1 - | 1 2 3 - | 5 5 3 1 | 2 - - - / 1 1 1 - | 1 2 3 - | 5 5 3 2 | 1 - - - / 5 5 5 - | 3 3 3 - | 5 5 3 1 | 2 - - - / 1 1 1 - | 1 2 3 - | 5 5 3 2 | 1 - - -' },
      { id: 26, title: '甜蜜的家庭', artist: '世界名曲', notation: '3 5 1. 7 | 6 1. 5 - | 4 6 5 3 | 2 4 3 - / 3 5 1. 7 | 6 1. 5 - | 4 6 5 3 | 2 3 1 - / 2 2 3 4 | 5 1. 1. - | 6 6 7 1. | 2. - - - / 3. 2. 1. 7 | 6 1. 5 - | 4 6 5 3 | 2 3 1 -' },
      { id: 27, title: '螢火蟲', artist: '世界童謠', notation: '3 3 3 4 | 5 5 5 - | 4 4 4 5 | 6 6 6 - / 5 5 4 4 | 3 3 2 - | 1 1 2 3 | 1 - - - / 3 3 3 4 | 5 5 5 - | 4 4 4 5 | 6 6 6 - / 5 5 4 4 | 3 3 2 - | 1 1 2 3 | 1 - - -' },
      { id: 28, title: '兩隻小鳥', artist: '世界童謠', notation: '1 1 1 2 | 3 3 3 - | 2 2 2 3 | 4 4 4 - / 3 3 3 4 | 5 5 5 - | 4 4 4 5 | 6 6 6 - / 5 5 5 - | 3 3 3 - | 5 5 5 4 | 3 2 1 - / 1 1 1 2 | 3 3 3 - | 2 2 2 3 | 4 4 4 -' },
      { id: 29, title: '伊比呀呀', artist: '世界童謠', notation: '5 5 5 3 | 1 1 1 - | 2 2 2 4 | 3 3 3 - / 5 5 5 3 | 1 1 1 - | 2 2 2 4 | 3 - - - / 5 5 5 3 | 1 1 1 - | 2 2 2 4 | 3 3 3 - / 5 5 5 3 | 1 1 1 - | 2 2 2 4 | 1 - - -' },
      { id: 30, title: '當我們同在一起', artist: '世界童謠', notation: '1 1 1 1 | 3 3 3 - | 2 2 2 2 | 4 4 4 - / 3 3 3 3 | 5 5 5 - | 4 4 3 2 | 1 - - - / 5 5 3 1 | 5 5 3 1 | 4 4 2 7 | 4 4 2 7 / 1 1 1 1 | 3 3 3 - | 2 2 3 2 | 1 - - -' }
    ];

    // ================= 應用程式狀態 =================
    let isScratchMode = false;
    let selectedSong = SONGS[0];
    let composedNotes = [];
    let isPlaying = false;
    let currentPlayIndex = -1;
    let playTimeout = null;
    let audioContext = null;
    let activePianoKey = null;

    // DOM 元素快取
    const els = {
      searchTab: document.getElementById('tab-search'),
      composeTab: document.getElementById('tab-compose'),
      viewSearch: document.getElementById('view-search'),
      viewCompose: document.getElementById('view-compose'),
      scratchToggleBtn: document.getElementById('btn-scratch-toggle'),
      scratchToggleText: document.getElementById('scratch-toggle-text'),
      searchInput: document.getElementById('search-input'),
      songList: document.getElementById('song-list'),
      songCount: document.getElementById('song-count'),
      noResults: document.getElementById('no-results'),
      songTitle: document.getElementById('song-title'),
      songArtist: document.getElementById('song-artist'),
      btnPlay: document.getElementById('btn-play'),
      btnStop: document.getElementById('btn-stop'),
      playingIndicator: document.getElementById('playing-indicator'),
      jianpuContainer: document.getElementById('jianpu-container'),
      autoPianoContainer: document.getElementById('auto-piano-container'),
      composePianoContainer: document.getElementById('compose-piano-container'),
      composedDisplay: document.getElementById('composed-display'),
      composedEmpty: document.getElementById('composed-empty'),
      btnClearComposed: document.getElementById('btn-clear-composed'),
      btnAddBar: document.getElementById('btn-add-bar')
    };

    // ================= 音訊系統 =================
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playToneByMidi(midiCode, duration = 0.6) {
      initAudio();
      const noteData = PIANO_NOTES[midiCode];
      if (!noteData || !audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(noteData.freq, audioContext.currentTime);
      
      gainNode.gain.setValueAtTime(0, audioContext.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.4, audioContext.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);

      // 觸發視覺回饋 (琴鍵下沉/發光)
      highlightPianoKey(midiCode);
    }

    // ================= 介面渲染與更新 =================

    // 綁定事件監聽器
    function setupEventListeners() {
      // 頁籤切換
      els.searchTab.addEventListener('click', () => switchTab('search'));
      els.composeTab.addEventListener('click', () => switchTab('compose'));
      
      // Scratch 模式
      els.scratchToggleBtn.addEventListener('click', () => {
        isScratchMode = !isScratchMode;
        updateScratchModeUI();
        renderAll();
      });

      // 搜尋
      els.searchInput.addEventListener('input', (e) => renderSongList(e.target.value));

      // 播放控制
      els.btnPlay.addEventListener('click', () => startAutoPlay(selectedSong));
      els.btnStop.addEventListener('click', stopAutoPlay);

      // 創作控制
      els.btnClearComposed.addEventListener('click', () => {
        composedNotes = [];
        renderComposedNotes();
      });
      els.btnAddBar.addEventListener('click', () => {
        composedNotes.push('|');
        renderComposedNotes();
      });
    }

    function switchTab(tab) {
      stopAutoPlay();
      if (tab === 'search') {
        els.viewSearch.classList.remove('hidden');
        els.viewCompose.classList.add('hidden');
        els.searchTab.className = "flex items-center gap-1.5 px-4 sm:px-5 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all bg-white text-indigo-600 shadow-sm";
        els.composeTab.className = "flex items-center gap-1.5 px-4 sm:px-5 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all text-slate-500 hover:text-slate-700";
      } else {
        els.viewSearch.classList.add('hidden');
        els.viewCompose.classList.remove('hidden');
        els.composeTab.className = "flex items-center gap-1.5 px-4 sm:px-5 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all bg-white text-indigo-600 shadow-sm";
        els.searchTab.className = "flex items-center gap-1.5 px-4 sm:px-5 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all text-slate-500 hover:text-slate-700";
      }
    }

    function updateScratchModeUI() {
      if (isScratchMode) {
        els.scratchToggleBtn.className = "flex items-center gap-1.5 sm:gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-bold transition-all border shadow-sm bg-orange-100 text-orange-700 border-orange-200 animate-pulse";
        els.scratchToggleText.textContent = "Scratch (ON)";
      } else {
        els.scratchToggleBtn.className = "flex items-center gap-1.5 sm:gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-bold transition-all border shadow-sm bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200";
        els.scratchToggleText.textContent = "Scratch (OFF)";
      }
      // 已移除將版面強制放大至 max-w-full 的程式碼，不論狀態皆維持在 max-w-[1440px] 內。
    }

    function renderSongList(query = '') {
      const q = query.toLowerCase();
      const filtered = SONGS.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
      
      els.songCount.textContent = filtered.length;
      els.songList.innerHTML = '';
      
      if (filtered.length === 0) {
        els.noResults.classList.remove('hidden');
      } else {
        els.noResults.classList.add('hidden');
        filtered.forEach(song => {
          const li = document.createElement('li');
          const btn = document.createElement('button');
          const isSelected = selectedSong.id === song.id;
          
          btn.className = `w-full text-left px-4 py-4 hover:bg-indigo-50 transition-colors ${isSelected ? 'bg-indigo-50 border-l-4 border-indigo-500 font-semibold' : 'border-l-4 border-transparent'}`;
          btn.innerHTML = `
            <div class="text-base text-slate-900">${song.title}</div>
            <div class="text-xs text-slate-500 mt-1">${song.artist}</div>
          `;
          btn.onclick = () => {
            stopAutoPlay();
            selectedSong = song;
            renderSongList(els.searchInput.value);
            renderJianpuDisplay();
          };
          
          li.appendChild(btn);
          els.songList.appendChild(li);
        });
      }
    }

    function renderJianpuDisplay() {
      if (!selectedSong) return;
      els.songTitle.textContent = selectedSong.title;
      els.songArtist.textContent = `${selectedSong.artist} (簡譜呈現)`;
      
      els.jianpuContainer.innerHTML = '';
      
      const lines = selectedSong.notation.split('/');
      let playIndex = 0;
      
      lines.forEach(line => {
        const lineDiv = document.createElement('div');
        const gapClass = isScratchMode ? "gap-x-1 sm:gap-x-1.5 gap-y-1.5" : "gap-y-2 gap-x-1.5 sm:gap-x-2";
        lineDiv.className = `flex flex-wrap items-center justify-start ${gapClass} w-full pb-3 border-b border-slate-100/50 last:border-b-0`;
        
        const tokens = line.trim().split(/\s+/).filter(t => t !== '');
        
        tokens.forEach((token) => {
          const span = document.createElement('span');
          const isCurrent = isPlaying && playIndex === currentPlayIndex;
          
          if (token === '|') {
            span.className = `mx-1 sm:mx-2 text-slate-300 font-light text-lg sm:text-xl transition-all duration-200 flex-shrink-0 ${isCurrent ? 'text-indigo-500 scale-110' : ''}`;
            span.textContent = '|';
          } else if (token === '-') {
            span.className = `w-4 sm:w-6 border-b-2 border-slate-800 inline-block align-middle transform -translate-y-1/2 mx-0.5 flex-shrink-0`;
          } else if (token === '.') {
            span.className = `text-sm self-end mb-0.5 font-bold text-indigo-600 animate-bounce flex-shrink-0`;
            span.textContent = '.';
          } else {
            // 優化後的緊湊型音符 
            const normalizedToken = token.replace('.', '̇');
            const targetMidi = JIANPU_TO_MIDI[normalizedToken] || JIANPU_TO_MIDI[token];
            const displayToken = (isScratchMode && targetMidi) ? PIANO_NOTES[targetMidi].scratch : normalizedToken;
            
            const paddingClass = isScratchMode ? "px-1.5 py-1 min-w-[2.25rem] sm:min-w-[2.75rem]" : "px-2 min-w-[2rem] sm:min-w-[2.25rem]";
            const textSize = isScratchMode ? 'text-[10px] sm:text-xs' : 'text-base sm:text-lg';
            
            span.className = `relative inline-flex items-center justify-center h-8 sm:h-9 ${paddingClass} rounded-full transition-all duration-200 border flex-shrink-0 ${
              isCurrent 
                ? 'bg-indigo-600 text-white border-indigo-600 scale-105 shadow-sm ring-1 sm:ring-2 ring-indigo-200' 
                : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50'
            } ${textSize} font-bold`;
            span.textContent = displayToken;
          }
          
          span.id = `token-${playIndex}`;
          lineDiv.appendChild(span);
          playIndex++;
        });
        
        els.jianpuContainer.appendChild(lineDiv);
      });
    }

    function createPianoHTML(isInteractive) {
      const whiteKeys = Object.keys(PIANO_NOTES).filter(k => PIANO_NOTES[k].type === 'white');
      const blackKeys = Object.keys(PIANO_NOTES).filter(k => PIANO_NOTES[k].type === 'black');
      
      let html = '';
      
      // 白鍵 - 降低高度和邊距使其更小巧美觀
      whiteKeys.forEach(midiCode => {
        const note = PIANO_NOTES[midiCode];
        const displayLabel = isScratchMode ? note.scratch : note.jianpu;
        const textSize = isScratchMode ? 'text-xs sm:text-sm' : 'text-base sm:text-lg';
        const interactiveClasses = isInteractive ? 'cursor-pointer hover:bg-slate-100 active:bg-indigo-100' : '';
        
        html += `
          <div id="key-${isInteractive ? 'compose' : 'auto'}-${midiCode}" 
               data-midi="${midiCode}"
               class="flex-1 h-full rounded-b-xl border-r last:border-r-0 border-slate-300 flex flex-col justify-end items-center pb-3 sm:pb-4 transition-all duration-100 bg-white text-slate-800 ${interactiveClasses}">
            <span class="${textSize} font-bold pointer-events-none">${displayLabel}</span>
            <span class="text-xs opacity-70 uppercase pointer-events-none mt-0.5 font-medium">${note.name}</span>
          </div>
        `;
      });

      // 黑鍵 - 降低高度
      blackKeys.forEach(midiCode => {
        const note = PIANO_NOTES[midiCode];
        const displayLabel = isScratchMode ? note.scratch : note.jianpu;
        const textSize = isScratchMode ? 'text-[9px] sm:text-[11px]' : 'text-xs sm:text-sm';
        const interactiveClasses = isInteractive ? 'cursor-pointer hover:bg-slate-700 active:bg-indigo-600 active:border-indigo-700' : '';

        html += `
          <div id="key-${isInteractive ? 'compose' : 'auto'}-${midiCode}"
               data-midi="${midiCode}"
               class="absolute w-[6%] h-3/5 rounded-b-lg shadow-lg flex flex-col justify-end items-center pb-2.5 sm:pb-3 transition-all duration-100 bg-slate-800 border-slate-900 text-white ${interactiveClasses}"
               style="left: ${note.leftOffset}; z-index: 10;">
            <span class="${textSize} font-bold pointer-events-none">${displayLabel}</span>
            <span class="text-[9px] opacity-60 scale-90 pointer-events-none mt-0.5">${note.name}</span>
          </div>
        `;
      });

      return html;
    }

    function renderPianos() {
      els.autoPianoContainer.innerHTML = createPianoHTML(false);
      els.composePianoContainer.innerHTML = createPianoHTML(true);

      const composeKeys = els.composePianoContainer.children;
      for (let key of composeKeys) {
        key.addEventListener('mousedown', function(e) {
          const midi = this.getAttribute('data-midi');
          if (midi) {
            playToneByMidi(midi);
            composedNotes.push(midi);
            renderComposedNotes();
          }
        });
        key.addEventListener('touchstart', function(e) {
          e.preventDefault();
          const midi = this.getAttribute('data-midi');
          if (midi) {
            playToneByMidi(midi);
            composedNotes.push(midi);
            renderComposedNotes();
          }
        });
      }
    }

    function renderComposedNotes() {
      els.composedDisplay.innerHTML = '';
      
      if (composedNotes.length === 0) {
        els.composedEmpty.classList.remove('hidden');
        els.btnClearComposed.disabled = true;
      } else {
        els.composedEmpty.classList.add('hidden');
        els.btnClearComposed.disabled = false;
        
        composedNotes.forEach(token => {
          const span = document.createElement('span');
          if (token === '|') {
            span.className = "mx-2 text-slate-300 font-light text-2xl";
            span.textContent = "|";
          } else {
            const noteData = PIANO_NOTES[token];
            const displayToken = isScratchMode ? noteData?.scratch : noteData?.jianpu || token;
            const isBlack = noteData?.type === 'black';
            
            span.className = `inline-flex items-center justify-center px-3 py-2 rounded-md text-sm font-bold border transition-all ${
              isBlack ? 'bg-slate-800 text-white border-slate-700' : 'bg-indigo-50 text-indigo-700 border-indigo-100'
            }`;
            span.textContent = displayToken;
          }
          els.composedDisplay.appendChild(span);
        });
      }
    }

    function renderAll() {
      renderSongList(els.searchInput.value);
      renderJianpuDisplay();
      renderPianos();
      renderComposedNotes();
    }

    // ================= 自動彈奏邏輯 =================
    
    function highlightPianoKey(midiCode) {
      if (activePianoKey) {
        const autoKey = document.getElementById(`key-auto-${activePianoKey}`);
        const composeKey = document.getElementById(`key-compose-${activePianoKey}`);
        const noteData = PIANO_NOTES[activePianoKey];
        if (noteData) {
          if (autoKey) {
            autoKey.classList.remove('key-pressed', noteData.type==='white' ? 'key-active-white' : 'key-active-black');
          }
          if (composeKey) {
            composeKey.classList.remove('key-pressed', noteData.type==='white' ? 'key-active-white' : 'key-active-black');
          }
        }
      }

      activePianoKey = midiCode;
      if (midiCode) {
        const autoKey = document.getElementById(`key-auto-${midiCode}`);
        const composeKey = document.getElementById(`key-compose-${midiCode}`);
        const noteData = PIANO_NOTES[midiCode];
        
        if (noteData) {
          const activeClass = noteData.type === 'white' ? 'key-active-white' : 'key-active-black';
          if (autoKey) autoKey.classList.add('key-pressed', activeClass);
          if (composeKey) composeKey.classList.add('key-pressed', activeClass);
          
          setTimeout(() => {
            if (activePianoKey === midiCode) {
              if (autoKey) autoKey.classList.remove('key-pressed', activeClass);
              if (composeKey) composeKey.classList.remove('key-pressed', activeClass);
              activePianoKey = null;
            }
          }, 200);
        }
      }
    }

    function updatePlayUI() {
      if (isPlaying) {
        els.btnPlay.classList.add('hidden');
        els.btnStop.classList.remove('hidden');
        els.btnStop.classList.add('flex');
        els.playingIndicator.classList.remove('hidden');
      } else {
        els.btnPlay.classList.remove('hidden');
        els.btnStop.classList.add('hidden');
        els.btnStop.classList.remove('flex');
        els.playingIndicator.classList.add('hidden');
        renderJianpuDisplay();
      }
    }

    function stopAutoPlay() {
      if (playTimeout) {
        clearTimeout(playTimeout);
        playTimeout = null;
      }
      isPlaying = false;
      currentPlayIndex = -1;
      updatePlayUI();
    }

    function startAutoPlay(song) {
      stopAutoPlay();
      initAudio();
      isPlaying = true;
      updatePlayUI();

      const tokens = song.notation.replace(/\//g, ' ').split(/\s+/).filter(t => t !== '');
      let index = 0;

      const playNextStep = () => {
        if (index >= tokens.length) {
          stopAutoPlay();
          return;
        }

        currentPlayIndex = index;
        
        for(let i=0; i<tokens.length; i++) {
          const t = document.getElementById(`token-${i}`);
          if(t) {
             if (t.textContent === '|') {
                t.className = "mx-1 sm:mx-2 text-slate-300 font-light text-lg sm:text-xl transition-all duration-200 flex-shrink-0";
             } else if (t.textContent !== '-' && t.textContent !== '.') {
                const textSize = isScratchMode ? 'text-[10px] sm:text-xs' : 'text-base sm:text-lg';
                const paddingClass = isScratchMode ? "px-1.5 py-1 min-w-[2.25rem] sm:min-w-[2.75rem]" : "px-2 min-w-[2rem] sm:min-w-[2.25rem]";
                t.className = `relative inline-flex flex-shrink-0 items-center justify-center h-8 sm:h-9 ${paddingClass} rounded-full transition-all duration-200 border bg-white text-slate-800 border-slate-200 ${textSize} font-bold`;
             }
          }
        }
        
        const currentEl = document.getElementById(`token-${index}`);
        const token = tokens[index];

        if (currentEl) {
          if (token === '|') {
            currentEl.classList.add('text-indigo-500', 'scale-110');
          } else if (token !== '-' && token !== '.') {
            currentEl.classList.remove('bg-white', 'text-slate-800', 'border-slate-200');
            currentEl.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600', 'scale-105', 'shadow-sm', 'ring-1', 'sm:ring-2', 'ring-indigo-200');
          }
        }

        if (token === '|') {
          index++;
          playNextStep();
          return;
        }

        if (token !== '-' && token !== '.') {
          const normalizedToken = token.replace('.', '̇');
          const targetMidi = JIANPU_TO_MIDI[normalizedToken] || JIANPU_TO_MIDI[token];
          if (targetMidi) {
            playToneByMidi(targetMidi, 0.4);
          }
        }

        index++;
        playTimeout = setTimeout(playNextStep, 400);
      };

      playNextStep();
    }

    // ================= 初始化 =================
    
    // 隨機打亂歌單順序 (Fisher-Yates 洗牌演算法)
    function shuffleSongs() {
      for (let i = SONGS.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [SONGS[i], SONGS[j]] = [SONGS[j], SONGS[i]]; // 交換元素
      }
    }
    
    // 執行洗牌
    shuffleSongs();
    
    // 將預設選取的歌曲更新為洗牌後的第一首
    selectedSong = SONGS[0];

    setupEventListeners();
    renderAll();

  </script>
